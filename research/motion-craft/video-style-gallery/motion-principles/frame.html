<script>
  const S = {"easing": {"entry": "elastic.out(1, 0.45)", "exit": "power2.in", "ambient": "none", "pop": "back.out(1.6)", "counter": "power2.inOut", "wipe": null}, "rhythm": {"entrance": 0.55, "stagger": 0.07}, "text_animation": "squash", "transition": {"kind": "cut", "duration": 0, "flash": false, "band": false}, "moments": [[0, 2.0], [2.0, 4.5], [4.5, 6.5], [6.5, 8.5], [8.5, 10.0]]};

  const EASE = S.easing;

  const M = S.moments; // [[start,end],...]

  // ---- shared text animation (hook line, close wordmark): one choice per style, all seek-safe fromTo at absolute times
  function splitWords(el, accentIndex) {
    const words = el.textContent.split(" ");
    el.textContent = "";

      const mask = document.createElement("span"); mask.className = "mask";
      const span = document.createElement("span"); span.className = "w" + (i === accentIndex ? " accent-word" : ""); span.textContent = w;
      mask.appendChild(span); el.appendChild(mask);
      if (i < words.length - 1) el.appendChild(document.createTextNode(" "));
      return span;
    });
  }
  function splitChars(span) {
    const t = span.textContent; span.textContent = "";

  }

  function textIn(targets, t0, opts) {
    // targets: array of word spans; animates by S.text_animation. opts: {stagger, dur, chars}
    const o = Object.assign({ stagger: S.rhythm.stagger, dur: S.rhythm.entrance }, opts || {});
    const kind = S.text_animation;
    targets.forEach((w, i) => {
      const at = t0 + i * o.stagger;
      switch (kind) {
        case "rise-mask":
          tl.fromTo(w, { yPercent: 110, opacity: 1 }, { yPercent: 0, duration: o.dur, ease: EASE.entry }, at); break;
        case "fade-up":
          tl.fromTo(w, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: o.dur, ease: EASE.entry }, at); break;
        case "slam":

        case "scale-in":

        case "squash":

        case "write-on":

        case "stepped":
          tl.fromTo(w, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: o.dur, ease: "steps(4)" }, at); break;
        case "word-blur":
          tl.fromTo(w, { filter: "blur(10px)", opacity: 0 }, { filter: "blur(0px)", opacity: 1, duration: o.dur * 1.6, ease: EASE.entry }, at); break;

            const cat = at + j * (o.chars || 0.035);

            else if (kind === "drop") tl.fromTo(c, { y: -90, opacity: 0, rotation: (j % 2 ? 28 : -28) }, { y: 0, opacity: 1, rotation: 0, duration: o.dur, ease: EASE.entry }, cat);

        tl.fromTo(inStage, { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: d, ease: EASE.wipe || "expo.inOut" }, a); break;

        tl.to(outStage, { x: -1280, duration: d, ease: EASE.wipe || "power3.inOut", immediateRender: false }, a); break;
      case "zoom":
        tl.fromTo(inStage, { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: EASE.entry }, a);

        tl.set(inStage, { x: 16, skewX: -3 }, tb); tl.set(inStage, { x: -10, skewX: 2 }, tb + 0.035); tl.set(inStage, { x: 0, skewX: 0 }, tb + 0.07);

        tl.fromTo(inStage, { y: -720 }, { y: 0, duration: d, ease: EASE.wipe || "power4.out" }, a); break;

  // ---- time-driven content (counter, typing, caret, timecode): pure functions of t, written on every render
  const R = []; // renderers: fn(t)
  function renderAt(t) { for (const f of R) f(t); }
  {
    const words = splitWords(document.getElementById("hook"), 3);
    // accent-word highlight bar sits behind the accent word (only when the style asks for it)
    const aw = document.querySelector("#hook .accent-word");
    const hi = document.createElement("span"); hi.id = "hi"; aw.parentNode.insertBefore(hi, aw);
    gsap.set("#hi", { scaleX: 0 });
    tl.fromTo("#kicker .w", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: S.rhythm.entrance, ease: EASE.entry }, 0.1);
    textIn(words, 0.22);
    const settled = 0.22 + 3 * S.rhythm.stagger + S.rhythm.entrance;
    tl.fromTo("#hi", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, Math.min(settled, 1.25));
    tl.fromTo("#hookrule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: EASE.entry }, Math.min(settled + 0.05, 1.3));
    // a slow settle keeps the hook alive until the boundary
    tl.fromTo("#hook", { scale: 1.0 }, { scale: 1.02, duration: 1.2, ease: "sine.inOut" }, 0.8);
  }

  {
    const t0 = M[1][0] - TD / 2 + 0.05, e = S.rhythm.entrance, st = S.rhythm.stagger;
    tl.fromTo("#card", { y: 46, opacity: 0, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: e * 1.2, ease: EASE.entry }, t0);
    tl.fromTo(["#card .ck", "#card .title"], { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: e, ease: EASE.entry, stagger: st }, t0 + 0.15);
    tl.fromTo("#pill", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: e, ease: EASE.pop }, t0 + 0.35);
    tl.fromTo(".thumb", { y: 22, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: e, ease: EASE.entry, stagger: st * 1.2 }, t0 + 0.4);
    tl.fromTo("#btn", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: e, ease: EASE.entry, stagger: st }, t0 + 0.55);
    // the one action: Re-run pressed, the thumbnails refresh in turn
    const p = M[1][1] - 0.75;
    tl.fromTo("#btn", { scale: 1 }, { scale: 0.94, duration: 0.09, ease: "power2.in" }, p);
    tl.to("#btn", { scale: 1, duration: 0.25, ease: EASE.pop, immediateRender: false }, p + 0.09);
    tl.fromTo(".thumb", { opacity: 1 }, { opacity: 0.35, duration: 0.08, ease: "none", stagger: 0.07, immediateRender: false }, p + 0.12);
    tl.to(".thumb", { opacity: 1, duration: 0.22, ease: "power2.out", stagger: 0.07, immediateRender: false }, p + 0.2);
    if (EASE.ambient !== "none") tl.fromTo("#card", { y: 0 }, { y: -5, duration: 1.0, ease: EASE.ambient, immediateRender: false }, t0 + e * 1.2 + 0.1);
  }

  {
    const t0 = M[2][0] - TD / 2, e = S.rhythm.entrance;
    const c0 = t0 + 0.1, cd = 1.25, easeFn = gsap.parseEase(EASE.counter);
    const numEl = document.getElementById("num");
    R.push(t => { const p = Math.max(0, Math.min(1, (t - c0) / cd)); numEl.textContent = String(Math.round(easeFn(p) * 12)); });
    tl.fromTo("#num", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: e, ease: EASE.entry }, t0);
    textIn([document.getElementById("unit")], t0 + 0.12);
    tl.fromTo("#numfill", { scaleX: 0 }, { scaleX: 1, duration: cd, ease: EASE.counter }, c0);
    tl.fromTo("#numlabel", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: e, ease: EASE.entry }, c0 + cd * 0.55);
    tl.fromTo("#num", { scale: 1.0 }, { scale: 1.03, duration: 0.6, ease: "sine.inOut", immediateRender: false }, c0 + cd);
  }

  {
    const t0 = M[3][0] - TD / 2, e = S.rhythm.entrance;
    tl.fromTo("#term", { y: 34, opacity: 0, scale: 0.98 }, { y: 0, opacity: 1, scale: 1, duration: e * 1.1, ease: EASE.entry }, t0);
    const TEXT = "make the launch video for orbit.app", CPS = 48, ty0 = t0 + 0.25, tyEnd = ty0 + TEXT.length / CPS;
    const typed = document.getElementById("typed"), caret = document.getElementById("caret"), caret2 = document.getElementById("caret2");
    const promptW = document.querySelector("#tl1 .p").getBoundingClientRect().width;
    const probe = document.createElement("span"); probe.style.visibility = "hidden"; typed.parentNode.appendChild(probe);
    const edges = []; for (let i = 0; i <= TEXT.length; i++) { probe.textContent = TEXT.slice(0, i); edges.push(promptW + probe.getBoundingClientRect().width); }
    probe.remove();
    const r1 = tyEnd + 0.28, r2 = r1 + 0.32, r3 = r2 + 0.32, p2 = r3 + 0.3;
    R.push(t => {
      const n = Math.max(0, Math.min(TEXT.length, Math.floor((t - ty0) * CPS)));
      typed.textContent = TEXT.slice(0, n);
      const blink = (Math.floor(t * 2.5) % 2) === 0;
      caret.style.transform = "translateX(" + edges[n] + "px)";
      caret.style.opacity = t < r1 ? (t < ty0 ? (blink ? 1 : 0) : 1) : 0;
      caret2.style.opacity = (t >= p2 && blink) ? 1 : 0;
    });
    gsap.set("#caret2", { x: promptW });
    tl.fromTo("#tl2", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, r1);
    tl.fromTo("#tl3", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, r2);
    tl.fromTo("#tl4", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, r3);
    tl.fromTo("#tl5", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, p2);
  }

  {
    const t0 = M[4][0] - TD / 2 + 0.05, e = S.rhythm.entrance;
    textIn([document.querySelector("#mark .w")], t0, { chars: 0.045 });
    tl.fromTo("#markrule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: EASE.entry }, t0 + e * 0.8);
    tl.fromTo("#url", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: e, ease: EASE.entry }, t0 + e * 0.8 + 0.15);
    tl.fromTo("#mark", { scale: 1 }, { scale: 1.025, duration: 1.1, ease: "sine.inOut", immediateRender: false }, 8.9);
  }

  // transitions at each boundary
  const stages = ["#st1", "#st2", "#st3", "#st4", "#st5"];
  for (let i = 0; i < 4; i++) transition(stages[i], stages[i + 1], M[i][1]);
  gsap.set('#band', { xPercent: -100 });
  tl.to({}, { duration: 10 }, 0); // full-span anchor
  // the time-driven writers run on update and on every seek
  tl.to({ k: 0 }, { k: 1, duration: 10, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  renderAt(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
