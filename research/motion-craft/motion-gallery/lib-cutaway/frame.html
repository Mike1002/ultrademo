<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-cutaway</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .card { position: absolute; left: 264px; top: 110px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, opacity; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card .h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  .card.b .h1 { font-size: 96px; line-height: 104px; top: 74px; font-variant-numeric: tabular-nums; }
  .card.b .sub { top: 190px; }
  .cursor { position: absolute; left: 0; top: 0; width: 28px; height: 38px; pointer-events: none; will-change: transform; }
  .cursor svg { width: 28px; height: 38px; display: block; }
  /* the cutaway: a close-up of the button, authored at 2.6x */
  #cut { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; background: #ece7da; will-change: opacity; }
  #cut .bigcard { position: absolute; left: 120px; top: -300px; width: 1400px; height: 800px; background: #fffdf8; border: 5px solid #1d1c1a; border-radius: 62px; }
  #cut .bigsub { position: absolute; left: 266px; top: 120px; font-size: 57px; color: #6d6a63; white-space: nowrap; }
  #cut .bigbtn { position: absolute; left: 266px; top: 250px; width: 520px; height: 156px; border-radius: 36px; background: #f2c200; border: 5px solid #1d1c1a;
    font-size: 52px; font-weight: 700; line-height: 146px; text-align: center; will-change: transform; }
  #cut .bigcursor { position: absolute; left: 0; top: 0; width: 73px; height: 99px; pointer-events: none; will-change: transform; }
  #cut .bigcursor svg { width: 73px; height: 99px; display: block; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="card" id="a" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div>
        <div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left on this plan</div>
        <div class="btn" id="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div>
      </div>
      <div class="card b" id="b" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>This month</div>
        <div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div>
      </div>
      <div class="cursor" id="cur" data-layout-allow-overlap>
        <svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div id="cut" data-layout-allow-overlap>
        <div class="bigcard" data-layout-allow-overlap data-layout-allow-overflow></div>
        <div class="bigsub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left on this plan</div>
        <div class="bigbtn" id="bigbtn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div>
        <div class="bigcursor" id="bigcur" data-layout-allow-overlap>
          <svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
    <div id="label"><span class="l-name">Cutaway</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.6 } });
  const CUT_IN = 0.95, CUT_OUT = 1.85;
  // Rest: main action (A) with the cursor on its way; the cutaway layer and B are hidden.
  tl.fromTo("#a", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
  tl.fromTo("#b", { opacity: 0, scale: 1 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#cut", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  // Main action: the cursor travels to the Continue button.
  const BX = 264 + 56 + 100, BY = 110 + 240 + 30;
  tl.fromTo("#cur", { x: 860, y: 500, scale: 1 }, { x: BX, y: BY, duration: 0.85, ease: "power2.inOut" }, 0.15);
  // Cutaway: a hard cut to the close-up of the press, then a hard cut back.
  tl.to("#cut", { opacity: 1, duration: 0.034, ease: "none" }, CUT_IN);
  tl.to("#cut", { opacity: 0, duration: 0.034, ease: "none" }, CUT_OUT);
  // Inside the close-up: the big cursor settles onto the button and presses it; the button depresses with it.
  tl.fromTo("#bigcur", { x: 600, y: 360, scale: 1 }, { x: 540, y: 322, duration: 0.3, ease: "power2.out" }, CUT_IN);
  tl.to("#bigcur", { scale: 0.86, duration: 0.12, ease: "power2.in", yoyo: true, repeat: 1 }, 1.3);
  tl.fromTo("#bigbtn", { scale: 1, transformOrigin: "50% 50%" }, { scale: 0.95, duration: 0.12, ease: "power2.in", yoyo: true, repeat: 1 }, 1.3);
  // The main action keeps its own clock: the press happens while the cutaway covers it, so the return shows the result.
  tl.to("#cur", { scale: 0.85, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, 1.3);
  tl.fromTo("#btn", { scale: 1, transformOrigin: "50% 50%" }, { scale: 0.95, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, 1.3);
  tl.to("#a", { opacity: 0, duration: 0.034, ease: "none" }, 1.5);
  tl.to("#b", { opacity: 1, duration: 0.034, ease: "none" }, 1.5);
  tl.fromTo("#b .h1", { scale: 0.9, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 1.5);
  // After the return: a 0.7 s hold with the cursor drifting off the result card.
  tl.to("#cur", { x: BX + 260, y: BY + 90, duration: 0.8, ease: "power2.inOut" }, 2.0);
  tl.fromTo("#b .sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.95);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
