<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-light-sweep</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #171a21; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #171a21; color: #ece8df;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #world { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; transform-origin: 50% 55%; will-change: transform; }
  .plate { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .big { position: absolute; left: 20px; top: 110px; font-weight: 800; font-size: 330px; line-height: 1; letter-spacing: -0.04em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ttl { position: absolute; left: 740px; top: 190px; font-weight: 700; font-size: 64px; line-height: 1.14; letter-spacing: -0.03em; white-space: nowrap; }
  .ttl .ln { position: relative; display: block; }
  .ttl .w { position: relative; display: inline-block; }
  #ul { position: absolute; left: 0; width: 100%; bottom: -4px; height: 8px; background: #f2c200; transform-origin: 0 50%; }
  /* One text layer: the glyphs are filled by a gradient that is ink everywhere except a tilted yellow-white band, so only backgroundPosition moves. */
  .sheen { color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(112deg, #ece8df 0%, #ece8df 45.5%, #f2c200 47.8%, #fbf3cf 49.2%, #ffffff 50%, #fbf3cf 50.8%, #f2c200 52.2%, #ece8df 54.5%, #ece8df 100%);
    background-size: 250% 100%; background-position: 96.4% 0%; background-repeat: no-repeat; }
  .rl { position: absolute; left: 740px; top: 160px; width: 330px; height: 2px; background: #ece8df; }
  .sub { position: absolute; left: 740px; top: 440px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #a7adbb; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #a7adbb; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #ece8df; font-weight: 700; }
  #label .l-sep { color: #6d7380; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="world">
        <div class="plate sheen"><div class="big">98%</div><div class="ttl"><span class="ln">Ship it.</span><span class="ln"><span class="w">Show it.<i id="ul"></i></span></span><span class="ln">Launch day.</span></div></div>
        <div class="rl"></div>
        <div class="sub">12,480 invites sent · 98% delivered</div>
      </div>
    </div>
    <div id="label"><span class="l-name">Light sweep</span><span class="l-sep">·</span><span>Texture &amp; Style</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Camera: a very slow push-in so the frame breathes while the light is the subject.
  tl.fromTo("#world", { scale: 0.965, x: 18 }, { scale: 1, x: 0, duration: 2.9, ease: "sine.out" }, 0);
  // The band of light passes once: background 250% wide, position 96.4% -> 3.6% carries the band from off-left to off-right, only inside the glyphs.
  tl.fromTo(".sheen", { backgroundPosition: "96.4% 0%" }, { backgroundPosition: "3.6% 0%", duration: 1.5, ease: "power1.inOut" }, 0.3);
  // After the light has passed, one point of focus: the yellow underline.
  tl.fromTo("#ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.85);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
