<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-dolly-zoom</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #cam { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; perspective: 1000px; perspective-origin: 50% 50%; }
  #world { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; transform-style: preserve-3d; transform-origin: 584px 290px; will-change: transform; }
  #bg { position: absolute; left: -616px; top: -510px; width: 2400px; height: 1600px; transform: translateZ(-700px); transform-style: preserve-3d; }
  .ghost { position: absolute; width: 360px; height: 220px; border: 2px solid #d9d3c4; border-radius: 20px; background: #fbf9f3; }
  .ghost i { position: absolute; left: 32px; top: 32px; width: 180px; height: 22px; border-radius: 11px; background: #e3ded2; }
  .ghost b { position: absolute; left: 32px; top: 72px; width: 260px; height: 14px; border-radius: 7px; background: #ece7da; }
  .ghost u { position: absolute; left: 32px; top: 96px; width: 200px; height: 14px; border-radius: 7px; background: #ece7da; }
  .ghost s { position: absolute; left: 32px; top: 150px; width: 110px; height: 36px; border-radius: 10px; background: #e3ded2; }
  #card { position: absolute; left: 324px; top: 130px; width: 520px; height: 320px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  #card .lab { position: absolute; left: 48px; top: 40px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  #card h1 { position: absolute; left: 48px; top: 68px; font-size: 52px; font-weight: 700; line-height: 60px; white-space: nowrap; }
  #card .sub { position: absolute; left: 48px; top: 142px; font-size: 22px; color: #6d6a63; white-space: nowrap; }
  #card .btn { position: absolute; left: 48px; top: 216px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  #ro { position: absolute; left: 0; top: 520px; width: 1168px; height: 24px; text-align: center; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; line-height: 24px; white-space: nowrap; }
  #ro b { color: #1d1c1a; font-weight: 700; font-variant-numeric: tabular-nums; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="cam" data-layout-allow-overflow><div id="world" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="bg" data-layout-allow-overflow data-layout-allow-overlap></div>
        <div id="card" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="lab">Orbit</div>
          <h1>Invite your team</h1>
          <div class="sub">3 seats left on this plan</div>
          <div class="btn">Continue</div>
        </div>
      </div></div>
      <div id="ro" data-layout-allow-overlap>distance <b id="dv">1000</b> &nbsp;·&nbsp; field of view <b id="fv">45</b>°</div>
    </div>
    <div id="label"><span class="l-name">Dolly zoom</span><span class="l-sep">·</span><span>Camera</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // A field of faint cards sits 700 px behind the subject card. The dolly pulls the world away from the lens (z 0 -> -500)
  // while the world is scaled up by exactly (P - z) / P, so the subject keeps its size and only the background grows and flattens.
  const bg = document.getElementById("bg");
  let html = "";
  for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
    if (r === 2 && c === 2) continue;
    html += '<div class="ghost" style="left:' + (c * 410 + 40) + 'px;top:' + (r * 270 + 30) + 'px"><i></i><b></b><u></u><s></s></div>';
  }
  bg.innerHTML = html;
  const P = 1000, DZ = -500, FOV0 = 45;
  const ease = gsap.parseEase("power2.inOut");
  const clamp = v => Math.max(0, Math.min(1, v));
  const dv = document.getElementById("dv"), fv = document.getElementById("fv");
  function renderAt(t) {
    const p = ease(clamp((t - 0.2) / 1.5)) * (1 - ease(clamp((t - 2.0) / 0.9)));   // out over 1.5 s, hold, back over 0.9 s
    const z = DZ * p;
    gsap.set("#world", { z: z, scale: (P - z) / P });
    const d = P - z;
    dv.textContent = String(Math.round(d));
    fv.textContent = String(Math.round(2 * Math.atan(P * Math.tan(FOV0 / 2 * Math.PI / 180) / d) * 180 / Math.PI));
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
