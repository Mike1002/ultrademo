<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-scroll-scrub-cinema</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  .num { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .t-xl { font-size: 84px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .t-l { font-size: 56px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .t-m { font-size: 34px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .t-body { font-size: 22px; line-height: 1.4; }
  .hair { height: 1px; background: #e3ded2; }
  .dot { border-radius: 50%; background: #1d1c1a; }
  .dot.v { background: #f2c200; border: 2px solid #1d1c1a; }

  #world { position: absolute; left: 0; top: 0; width: 1100px; height: 580px; transform-origin: 550px 290px; will-change: transform; }
  #bg { position: absolute; left: 230px; top: 40px; font-size: 420px; color: #a19d93; opacity: .2; will-change: transform; }
  #s1lab { position: absolute; left: 80px; top: 40px; }
  .title { position: absolute; left: 80px; top: 72px; }
  .win { position: relative; height: 98px; overflow: hidden; }
  .win .line { display: block; line-height: 98px; white-space: nowrap; will-change: transform; }
  #dia { position: absolute; left: 0; top: 0; width: 1100px; height: 580px; }
  #dia .nd { position: absolute; will-change: transform; }
  #nIn { left: 118px; top: 374px; width: 72px; height: 72px; border-radius: 50%; background: #1d1c1a; }
  #nMo { left: 420px; top: 362px; width: 170px; height: 96px; background: #1d1c1a; border-radius: 14px; }
  #nOut { left: 820px; top: 374px; width: 72px; height: 72px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; }
  #dia .nl { position: absolute; top: 470px; width: 160px; text-align: center; }
  #dia svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #dia svg path { fill: none; stroke: #1d1c1a; stroke-width: 2; }
  #next { position: absolute; left: 80px; top: 215px; }
  #next .t-body { margin-top: 18px; color: #6d6a63; width: 640px; }
  #rail { position: absolute; left: 1120px; top: 40px; width: 1px; height: 500px; background: #e3ded2; }
  #fill { position: absolute; left: -1px; top: 0; width: 3px; height: 500px; background: #1d1c1a; }
  #knob { position: absolute; left: 0; top: 0; }
  #thumb { position: absolute; left: -8px; top: -8px; width: 17px; height: 17px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; }
  #read { position: absolute; left: 16px; top: -8px; font-size: 11px; letter-spacing: .04em; color: #1d1c1a; line-height: 17px; font-variant-numeric: tabular-nums; }
  .tick { position: absolute; left: -7px; width: 15px; height: 1px; background: #1d1c1a; }
  .tv { position: absolute; right: 16px; font-size: 10px; letter-spacing: .06em; color: #a19d93; line-height: 10px; }
  .beat { position: absolute; right: 16px; font-size: 11px; letter-spacing: .1em; color: #a19d93; line-height: 11px; text-transform: uppercase; }

  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">

      <div id="world" data-layout-allow-overlap data-layout-allow-overflow>
        <div id="bg" class="num" data-layout-allow-occlusion data-layout-allow-overflow data-layout-allow-overlap>12,480</div>
        <div class="lab" id="s1lab">Scene 01 · Pinned scene</div>
        <div class="title">
          <div class="win"><div class="line t-xl" id="l1">Invite</div></div>
          <div class="win"><div class="line t-xl" id="l2">your team</div></div>
        </div>
        <div id="dia" data-layout-allow-overlap>
          <svg width="1100" height="580">
            <path id="e1" d="M198 410 H404 M392 400 L404 410 L392 420" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
            <path id="e2" d="M598 410 H804 M792 400 L804 410 L792 420" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
          </svg>
          <div class="nd" id="nIn"></div>
          <div class="nd" id="nMo"></div>
          <div class="nd" id="nOut"></div>
          <div class="lab nl" id="tIn" style="left:74px">Invite</div>
          <div class="lab nl" id="tMo" style="left:425px">Accept</div>
          <div class="lab nl" id="tOut" style="left:776px">Join</div>
        </div>
        <div id="next" data-layout-allow-overflow>
          <div class="lab">Scene 02</div>
          <div class="t-l" style="margin-top:12px">Who joined so far?</div>
          <div class="t-body">Jamie Dalton, Sam Kim and Morgan Lee accepted their invites. 3 seats left.</div>
        </div>
      </div>
      <div id="rail" data-layout-allow-overlap>
        <div class="beat" id="bEnter" style="top:70px">enter</div>
        <div class="tick" style="top:150px"></div><div class="tv" style="top:145px">0.30</div>
        <div class="beat" id="bHold" style="top:257px">hold</div>
        <div class="tick" style="top:375px"></div><div class="tv" style="top:370px">0.75</div>
        <div class="beat" id="bExit" style="top:432px">exit</div>
        <div id="fill"></div>
        <div id="knob"><div id="thumb"></div><div id="read">0.00</div></div>
      </div>

    </div>
    <div id="label"><span class="l-name">Scroll-scrub cinema scene</span><span class="l-sep">·</span><span>Camera</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });

  // Scroll-scrub cinema: one progress value p drives every layer (title mask, assembling diagram, parallax number, world push-in).
  // The timeline plays the scroll: a baked human wheel curve (two pushes, a hesitation before 0.30, a long roll, a hesitation before 0.75, then out).
  const $ = id => document.getElementById(id);
  const clamp = v => Math.max(0, Math.min(1, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a));
  const out3 = gsap.parseEase("power3.out"), io2 = gsap.parseEase("power2.inOut");
  function rand(seed) { let a = seed >>> 0 || 1; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const R = rand(939);
  const scatter = ["nIn", "nMo", "nOut"].map(() => ({ x: (R() - 0.5) * 360, y: 160 + R() * 120, r: (R() - 0.5) * 24 }));
  const T1 = 0.30, T2 = 0.75;
  gsap.set("#fill", { transformOrigin: "50% 0%" });
  const curve = [
    [0.00, 0.17, 0.35, "power2.out"],
    [0.17, 0.29, 0.31, "power2.inOut"],
    [0.29, 0.30, 0.31, "sine.inOut"],
    [0.30, 0.735, 0.77, "power2.inOut"],
    [0.735, 0.75, 0.31, "sine.inOut"],
    [0.75, 1.00, 0.70, "power3.inOut"]
  ].map(([a, b, d, e]) => [a, b, d, gsap.parseEase(e)]);
  function progress(t) {
    let at = 0.1, p = 0;
    for (const [a, b, d, e] of curve) { if (t <= at) return p; p = t >= at + d ? b : a + (b - a) * e((t - at) / d); at += d; }
    return p;
  }
  function renderAt(t) {
    const p = progress(t);
    const s = 1 + 0.05 * io2(seg(p, T1, T2)) - 0.05 * io2(seg(p, T2, 1));
    gsap.set("#world", { scale: s });
    gsap.set("#bg", { x: -70 * p, y: 130 - 170 * p });
    [["l1", 0.02, 0.20, 0.76, 0.86], ["l2", 0.08, 0.27, 0.79, 0.90]].forEach(([id, a, b, c, d]) => {
      gsap.set($(id), { yPercent: 110 * (1 - out3(seg(p, a, b))) - 110 * io2(seg(p, c, d)) });
    });
    gsap.set("#s1lab", { opacity: 1 - seg(p, 0.76, 0.84) });
    const exitY = -520 * seg(p, T2 + 0.03, 1);
    [["nIn", "tIn", 0.10, 0.40, 1.00], ["nMo", "tMo", 0.16, 0.48, 1.12], ["nOut", "tOut", 0.22, 0.56, 1.24]].forEach(([n, tt, a, b, sp], i) => {
      const k = out3(seg(p, a, b)), sc = scatter[i];
      const x = sc.x * (1 - k), y = sc.y * (1 - k) + exitY * sp, r = sc.r * (1 - k);
      gsap.set($(n), { x: x, y: y, rotation: r, scale: 0.6 + 0.4 * k, opacity: seg(p, a, a + 0.08) });
      gsap.set($(tt), { x: x, y: y, opacity: seg(p, b - 0.06, b) });
    });
    gsap.set("#e1", { strokeDashoffset: 1 - io2(seg(p, 0.44, 0.60)), y: exitY * 1.06 });
    gsap.set("#e2", { strokeDashoffset: 1 - io2(seg(p, 0.54, 0.70)), y: exitY * 1.06 });
    const q = seg(p, 0.80, 1);
    gsap.set("#next", { y: 380 * (1 - q), opacity: seg(p, 0.80, 0.9) });
    gsap.set("#fill", { scaleY: p });
    gsap.set("#knob", { y: 500 * p });
    $("read").textContent = p.toFixed(2);
    const beat = p < T1 ? "bEnter" : p < T2 ? "bHold" : "bExit";
    ["bEnter", "bHold", "bExit"].forEach(b => { $(b).style.color = b === beat ? "#1d1c1a" : "#a19d93"; });
  }
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };

  window.__timelines["main"] = tl;
</script>
</body>
</html>
