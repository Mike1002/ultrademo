<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-outline-then-fill</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .kicker { position: absolute; left: 64px; top: 40px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  svg.canvas { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .shape { stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; fill-opacity: 0; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="kicker">Draw the structure, then fill it</div>
      <svg class="canvas" viewBox="0 0 1168 580">
        <path class="shape" id="s1" d="M170 380 L170 210 L310 130 L450 210 L450 380 L310 460 Z" fill="#1d1c1a" stroke="#1d1c1a" pathLength="1"/>
        <circle class="shape" id="s2" cx="640" cy="295" r="110" fill="#f2c200" stroke="#f2c200" pathLength="1"/>
        <path class="shape" id="s3" d="M820 440 L960 150 L1100 440 Z" fill="#1d1c1a" stroke="#1d1c1a" pathLength="1"/>
      </svg>
    </div>
    <div id="label"><span class="l-name">Outline then fill</span><span class="l-sep">·</span><span>Shape &amp; Path</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Each outline draws over 0.9 s, 0.18 s apart; the interior fills over 0.5 s once the outline is nearly closed.
  ["#s1", "#s2", "#s3"].forEach((id, i) => {
    tl.fromTo(id, { strokeDashoffset: 1 }, { strokeDashoffset: 0, autoRound: false, duration: 0.9, ease: "power2.out" }, 0.3 + i * 0.18);
    tl.fromTo(id, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.5, ease: "power1.inOut", immediateRender: false }, 1.25 + i * 0.18);
  });
  // Settle: the filled circle breathes once so the hold keeps moving.
  tl.fromTo("#s2", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.05, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.3);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
