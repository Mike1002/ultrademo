<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>card-morph-anchor</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  .caption { position: absolute; left: 0; top: 96px; width: 1280px; text-align: center; font-size: 20px; color: #6d6a63; }
  /* shot-1 geometry: a 220x88 pill, centred at (640,400) -> left 530, top 356. The morph is scale (x2.6 -> 572x229 apparent), never width/height. */
  .morph-card { position: absolute; left: 530px; top: 356px; width: 220px; height: 88px; border-radius: 44px; background: #f2c200;
    border: 2px solid #1d1c1a; overflow: hidden; transform-origin: 50% 50%; will-change: transform;
    box-shadow: 0px 6px 14px rgba(29,28,26,0.18); }
  .content-old, .content-new { position: absolute; inset: 0; }
  .content-old { display: grid; place-items: center; font-size: 28px; font-weight: 700; }
  /* new content authored at apparent size / 2.6 so it scales with the card */
  .content-new { opacity: 0; }
  .content-new .line { position: absolute; left: 17px; top: 17px; font-size: 15.4px; font-weight: 700; letter-spacing: -0.01em; }
  .content-new .sub { position: absolute; left: 17px; top: 38px; font-size: 7.7px; color: #6d6a63; }
  .content-new .num { position: absolute; left: 17px; top: 50px; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .content-new .bar { position: absolute; left: 100px; top: 56px; width: 100px; height: 5px; border-radius: 3px; background: #e3ded2; }
  .content-new .bar2 { position: absolute; left: 100px; top: 66px; width: 70px; height: 5px; border-radius: 3px; background: #e3ded2; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="caption">Every frame is code</div>
    <div class="morph-card" id="morph-card">
      <div class="content-old" id="content-old">Continue</div>
      <div class="content-new" id="content-new">
        <div class="line">Invite your team</div>
        <div class="sub">Active members this week</div>
        <div class="num">1,284</div>
        <div class="bar"></div><div class="bar2"></div>
      </div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  // Rule values: HOLD_BEAT 0.7, MORPH_DUR 1.0 power2.inOut, END_SCALE = 572/220 = 2.6, apparent radius 24 -> 24/2.6 pre-scale,
  // old content fades over the first 40%, new content over the last 40%; no handoff anchor (card holds its final state).
  const HOLD_BEAT = 0.7, MORPH_DUR = 1.0, END_SCALE = 2.6, SHOT_TWO_RADIUS = 24;
  const OLD_FADE_FRAC = 0.4, NEW_FADE_FRAC = 0.4, MORPH_START = HOLD_BEAT;
  // One tween, all channels: uniform scale + paint-only properties, landing slightly higher (x/y in the same tween).
  tl.fromTo("#morph-card",
    { scale: 1, y: 0, borderRadius: "44px", backgroundColor: "#f2c200", boxShadow: "0px 6px 14px rgba(29,28,26,0.18)" },
    { scale: END_SCALE, y: -40, borderRadius: `${SHOT_TWO_RADIUS / END_SCALE}px`, backgroundColor: "#fffdf8",
      boxShadow: "0px 10px 24px rgba(29,28,26,0.12)", duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);
  tl.fromTo("#content-old", { opacity: 1 }, { opacity: 0, duration: MORPH_DUR * OLD_FADE_FRAC, ease: "power1.in" }, MORPH_START);
  tl.fromTo("#content-new", { opacity: 0 }, { opacity: 1, duration: MORPH_DUR * NEW_FADE_FRAC, ease: "power1.out" },
    MORPH_START + MORPH_DUR * (1 - NEW_FADE_FRAC));
  // Final state holds; the bars fill as a quiet second beat so the dwell is not frozen.
  tl.fromTo("#content-new .bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 2.0);
  tl.fromTo("#content-new .bar2", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 2.15);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
