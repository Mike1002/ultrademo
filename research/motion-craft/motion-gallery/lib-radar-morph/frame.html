<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-radar-morph</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #chart text { font-size: 22px; fill: #1d1c1a; }
  #chart .small { font-size: 16px; fill: #6d6a63; }
  #chart .grid { stroke: #e3ded2; stroke-width: 2; }
  .heading { position: absolute; left: 32px; top: 26px; font-size: 34px; font-weight: 700; }
  .sub { position: absolute; left: 34px; top: 72px; font-size: 16px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="heading">Better on five axes</div>
      <div class="sub">Same axes and scale; only the outline changes</div>
      <svg id="chart" viewBox="0 0 1168 580" xmlns="http://www.w3.org/2000/svg">
        <g id="rings"></g>
        <g id="axes"></g>
        <polygon id="before" fill="none" stroke="#6d6a63" stroke-dasharray="5 6" stroke-width="2"/>
        <polygon id="radar" fill="#fbf3cf" fill-opacity=".75" stroke="#f2c200" stroke-width="4" stroke-linejoin="round"/>
        <g id="verts"></g>
        <text x="760" y="270">Before and after</text>
        <text class="small" x="760" y="316">Dashed ink · before</text>
        <text class="small" x="760" y="350">Yellow outline · after</text>
        <text class="small" x="760" y="408">All axes 0 to 100</text>
      </svg>
    </div>
    <div id="label"><span class="l-name">Radar chart morph</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  const CX = 405, CY = 333, R = 182, N = 5;
  const names = ["Accuracy", "Speed", "Context", "Clarity", "Stability"];
  const before = [0.45, 0.7, 0.4, 0.55, 0.6], after = [0.86, 0.8, 0.9, 0.7, 0.88], settle = [0.84, 0.84, 0.88, 0.74, 0.86];
  const pt = (i, v) => { const a = i * 2 * Math.PI / N - Math.PI / 2; return [CX + Math.cos(a) * R * v, CY + Math.sin(a) * R * v]; };
  const poly = vals => vals.map((v, i) => pt(i, v).map(n => n.toFixed(2)).join(",")).join(" ");
  // Static grid: four rings, five axes with labels.
  const rings = document.querySelector("#rings"), axes = document.querySelector("#axes"), verts = document.querySelector("#verts");
  [0.25, 0.5, 0.75, 1].forEach(s => { const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon"); p.setAttribute("class", "grid"); p.setAttribute("fill", "none"); p.setAttribute("points", poly([s, s, s, s, s])); rings.appendChild(p); });
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(i, 1), [lx, ly] = pt(i, 1.19);
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line"); l.setAttribute("class", "grid"); l.setAttribute("x1", CX); l.setAttribute("y1", CY); l.setAttribute("x2", x); l.setAttribute("y2", y); axes.appendChild(l);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text"); t.setAttribute("x", lx); t.setAttribute("y", ly + 8); t.setAttribute("text-anchor", "middle"); t.textContent = names[i]; axes.appendChild(t);
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle"); c.setAttribute("id", "v" + i); c.setAttribute("r", 7); c.setAttribute("fill", "#f2c200"); c.setAttribute("stroke", "#1d1c1a"); c.setAttribute("stroke-width", 2); verts.appendChild(c);
  }
  document.querySelector("#before").setAttribute("points", poly(before));
  const radar = document.querySelector("#radar"), vEls = names.map((_, i) => document.querySelector("#v" + i));
  const inOut = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  // Vertices slide along their fixed axes: before -> after over 0.4..1.7 s, then a small settle 2.1..2.8 s.
  function valuesAt(t) {
    const p1 = inOut(Math.max(0, Math.min(1, (t - 0.4) / 1.3)));
    const p2 = inOut(Math.max(0, Math.min(1, (t - 2.1) / 0.7)));
    return before.map((v, i) => { const m = v + (after[i] - v) * p1; return m + (settle[i] - m) * p2; });
  }
  function renderAt(t) {
    const vals = valuesAt(t);
    radar.setAttribute("points", poly(vals));
    vals.forEach((v, i) => { const [x, y] = pt(i, v); vEls[i].setAttribute("cx", x); vEls[i].setAttribute("cy", y); });
  }
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
