<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-dot-regroup</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .particle { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: #1d1c1a; will-change: transform; }
  .particle.selected { background: #f2c200; border: 2px solid #1d1c1a; }
  .label { position: absolute; top: 440px; font-size: 34px; font-weight: 700; }
  .label small { display: block; font-size: 15px; font-weight: 400; color: #6d6a63; margin-top: 4px; }
  .divider { position: absolute; left: 684px; top: 145px; width: 2px; height: 262px; background: #e3ded2; }
  .title { position: absolute; left: 100px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="title">30 invites sent</div>
      <div class="divider"></div>
      <div id="dots"></div>
      <div class="label" id="labA" style="left:247px">18<small>accepted</small></div>
      <div class="label" id="labB" style="left:837px">12<small>pending</small></div>
    </div>
    <div id="label"><span class="l-name">Dot regroup</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const r = rand(808), dots = document.querySelector("#dots");
  // 30 scattered dots (seed 808) travel to two orderly groups: 18 yellow on the left, 12 ink on the right.
  for (let i = 0; i < 30; i++) {
    const d = document.createElement("div");
    d.className = "particle" + (i < 18 ? " selected" : "");
    d.id = "dot" + i;
    dots.appendChild(d);
    const col = i < 18 ? i % 6 : (i - 18) % 4, row = i < 18 ? Math.floor(i / 6) : Math.floor((i - 18) / 4);
    const x0 = 90 + r() * 955, y0 = 105 + r() * 275;
    tl.fromTo(d, { x: x0, y: y0 }, { x: (i < 18 ? 138 : 764) + col * 61, y: 180 + row * 67, duration: 1.35, ease: "power2.inOut" }, 0.3 + i * 0.014);
  }
  tl.fromTo(["#labA", "#labB"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.1 }, 2.1);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
