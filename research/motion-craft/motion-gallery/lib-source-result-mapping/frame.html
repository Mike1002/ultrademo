<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-source-result-mapping</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .head { position: absolute; left: 64px; top: 48px; font-size: 34px; font-weight: 700; }
  .card { position: absolute; top: 150px; width: 380px; height: 300px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 22px; padding: 28px 30px; will-change: transform; }
  #src { left: 64px; } #res { left: 724px; }
  .line { font-size: 27px; line-height: 36px; margin-top: 26px; }
  .token { display: inline-block; padding: 2px 8px; margin-left: -8px; border-radius: 8px; border-bottom: 3px solid rgba(0,0,0,0); }
  #links { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; overflow: visible; }
  #links line { stroke: #1d1c1a; stroke-width: 2; }
  #links circle { fill: #1d1c1a; }
  .equiv { position: absolute; left: 470px; width: 228px; text-align: center; font-size: 15px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="head">Read the source and the result together</div>
      <section class="card" id="src"><span class="lab">Source · invite draft</span>
        <div class="line"><span class="token" id="a2">Jamie Dalton · owner</span></div>
        <div class="line"><span class="token" id="a1">Invite Sam Kim</span></div>
      </section>
      <svg id="links" viewBox="0 0 1168 580" data-layout-allow-overlap>
        <line id="c1" x1="446" y1="334" x2="722" y2="334"/><circle id="e1" cx="722" cy="334" r="5"/>
        <line id="c2" x1="446" y1="272" x2="722" y2="272"/><circle id="e2" cx="722" cy="272" r="5"/>
      </svg>
      <div class="equiv" id="q1" style="top:342px">same meaning</div>
      <div class="equiv" id="q2" style="top:246px">same meaning</div>
      <section class="card" id="res"><span class="lab">Result · what happened</span>
        <div class="line"><span class="token" id="b2">Owner: Jamie Dalton</span></div>
        <div class="line"><span class="token" id="b1">Sam Kim joined</span></div>
      </section>
    </div>
    <div id="label"><span class="l-name">Source-to-result mapping</span><span class="l-sep">·</span><span>Explainer</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  const Y0 = "rgba(242,194,0,0)", Y1 = "rgba(242,194,0,1)";
  // The source stays put; the result card slides in beside it (700 ms, power2.out).
  tl.fromTo("#res", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 0.2);
  // Pair 1: a connector draws from the source token to its result token, both get marked (350 ms).
  function pair(i, at) {
    const l = document.querySelector("#c" + i), x1 = +l.getAttribute("x1"), x2 = +l.getAttribute("x2");
    tl.fromTo("#c" + i, { attr: { x2: x1 } }, { attr: { x2: x2 }, duration: 0.5, ease: "power2.out" }, at);
    tl.fromTo("#e" + i, { opacity: 0, scale: 0, transformOrigin: "center center" }, { opacity: 1, scale: 1, duration: 0.2 }, at + 0.45);
    tl.to("#a" + i, { borderBottomColor: "#1d1c1a", duration: 0.3 }, at);
    tl.fromTo("#b" + i, { backgroundColor: Y0 }, { backgroundColor: Y1, duration: 0.35 }, at + 0.3);
    tl.fromTo("#q" + i, { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.6);
  }
  tl.set(["#e1", "#e2"], { opacity: 0 }, 0);
  pair(1, 0.8);
  // Pair 2 follows so the mapping keeps building through the second half.
  pair(2, 1.9);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
