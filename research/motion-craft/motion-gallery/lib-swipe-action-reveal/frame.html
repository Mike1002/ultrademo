<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-swipe-action-reveal</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #panel { position: absolute; left: 284px; top: 90px; width: 600px; height: 400px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; overflow: hidden; }
  #hdr { position: absolute; left: 0; top: 0; width: 596px; height: 72px; border-bottom: 2px solid #1d1c1a; }
  #hdr .t { position: absolute; left: 32px; top: 22px; font-size: 22px; font-weight: 700; }
  #hdr .c { position: absolute; right: 32px; top: 26px; font-size: 15px; color: #6d6a63; }
  .slot { position: absolute; left: 0; width: 596px; height: 96px; border-bottom: 2px solid #e3ded2; overflow: hidden; }
  .row { position: absolute; left: 0; top: 0; width: 596px; height: 94px; background: #fffdf8; z-index: 2; will-change: transform; }
  .row .cb { position: absolute; left: 32px; top: 36px; width: 22px; height: 22px; border-radius: 6px; border: 2px solid #1d1c1a; background: #fffdf8; }
  .row .av { position: absolute; left: 80px; top: 25px; width: 44px; height: 44px; border-radius: 50%; background: #ece7da; border: 2px solid #1d1c1a; }
  .row .nm { position: absolute; left: 144px; top: 24px; font-size: 22px; font-weight: 600; white-space: nowrap; }
  .row .rl { position: absolute; left: 144px; top: 54px; font-size: 15px; color: #6d6a63; }
  .act { position: absolute; top: 0; width: 72px; height: 94px; z-index: 1; font-size: 14px; font-weight: 700; text-align: center; line-height: 94px; will-change: transform, opacity; }
  #archive { left: 452px; background: #ece7da; border-left: 2px solid #1d1c1a; }
  #remove { left: 524px; background: #f2c200; border-left: 2px solid #1d1c1a; }
  #touch { position: absolute; left: 520px; top: 36px; width: 28px; height: 28px; border-radius: 50%; background: rgba(29,28,26,0.35); border: 2px solid #1d1c1a; z-index: 3; will-change: transform, opacity; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="panel">
        <div id="hdr"><div class="t">Members</div><div class="c">3 of 5 seats</div></div>
        <div class="slot" style="top:72px"><div class="row"><div class="cb"></div><div class="av"></div><div class="nm">Jamie Dalton</div><div class="rl">Owner</div></div></div>
        <div class="slot" style="top:168px">
          <div class="act" id="archive" data-layout-allow-overlap data-layout-allow-occlusion>Archive</div>
          <div class="act" id="remove" data-layout-allow-overlap data-layout-allow-occlusion>Remove</div>
          <div class="row" id="row" data-layout-allow-overlap><div class="cb"></div><div class="av"></div><div class="nm">Sam Kim</div><div class="rl">Editor</div></div>
          <div id="touch" data-layout-allow-overlap></div>
        </div>
        <div class="slot" style="top:264px;border-bottom:0"><div class="row"><div class="cb"></div><div class="av"></div><div class="nm">Morgan Lee</div><div class="rl">Editor</div></div></div>
      </div>
    </div>
    <div id="label"><span class="l-name">Swipe action reveal</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.3 } });
  // Params: 0.3 s slide, travel 144 px here (two actions wide), power2.out out and back.out(1.2) on the return.
  // The touch point lands on the row, drags it left, lifts; the actions underneath scale up as they are uncovered.
  tl.fromTo("#touch", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 0.3);
  tl.fromTo("#touch", { x: 0 }, { x: -144, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.5);
  tl.fromTo("#row", { x: 0 }, { x: -144, duration: 0.3, ease: "power2.out" }, 0.5);
  tl.fromTo(["#archive", "#remove"], { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.5);
  tl.to("#touch", { opacity: 0, duration: 0.2, ease: "none" }, 0.9);
  // Hold with the actions showing, then the row slides back over them with a small overshoot.
  tl.to("#row", { x: 0, duration: 0.4, ease: "back.out(1.2)" }, 2.0);
  tl.to(["#archive", "#remove"], { scale: 0.9, opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, 2.15);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
