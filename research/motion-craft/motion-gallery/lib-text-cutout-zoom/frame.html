<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-text-cutout-zoom</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #B { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; background: #f6f3ec; }
  #content { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; transform-origin: 584px 290px; will-change: transform; }
  .big { position: absolute; left: 0; width: 1168px; top: 150px; text-align: center; font-size: 132px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
  .big-l { position: absolute; left: 0; width: 1168px; top: 300px; text-align: center; font-size: 22px; color: #6d6a63; }
  .names { position: absolute; left: 0; width: 1168px; top: 372px; height: 56px; display: flex; justify-content: center; gap: 24px; }
  .name { width: 190px; height: 50px; line-height: 46px; text-align: center; border: 2px solid #1d1c1a; border-radius: 999px;
    font-size: 20px; background: #fffdf8; will-change: transform, opacity; }
  #cover { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #cover svg { display: block; width: 1168px; height: 580px; }
  #cover text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 232px; letter-spacing: -0.02em; }
  #cover .small { font-size: 22px; font-weight: 400; letter-spacing: 0.06em; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="B"><div id="content" data-layout-allow-overlap>
        <div class="big" id="big" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div>
        <div class="big-l" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div>
        <div class="names"><div class="name" id="n1" data-layout-allow-overlap data-layout-allow-occlusion>Jamie Dalton</div><div class="name" id="n2" data-layout-allow-overlap data-layout-allow-occlusion>Sam Kim</div><div class="name" id="n3" data-layout-allow-overlap data-layout-allow-occlusion>Morgan Lee</div></div>
      </div></div>
      <div id="cover" data-layout-allow-overlap>
        <svg viewBox="0 0 1168 580" aria-hidden="true">
          <defs>
            <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1168" height="580">
              <rect x="0" y="0" width="1168" height="580" fill="#fff"/>
              <text id="hole" x="0" y="378" fill="#000">O</text>
            </mask>
          </defs>
          <g id="plate" mask="url(#m)">
            <rect x="0" y="0" width="1168" height="580" fill="#1d1c1a"/>
            <text id="rest" x="0" y="378" fill="#f2c200">RBIT</text>
            <text class="small" x="584" y="470" text-anchor="middle" fill="#a19d93">LAUNCH DAY</text>
          </g>
        </svg>
      </div>
    </div>
    <div id="label"><span class="l-name">Text cutout zoom</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  // Lay the word out once: the O is the hole in the mask and sits over the centre of the scene behind; RBIT is drawn on the plate right after it.
  const hole = document.getElementById("hole"), rest = document.getElementById("rest");
  const wO = hole.getComputedTextLength();
  const x0 = 584 - wO / 2;
  hole.setAttribute("x", x0.toFixed(1)); rest.setAttribute("x", (x0 + wO).toFixed(1));
  const bb = hole.getBBox();
  // The zoom is centred on the O's left stroke, not its counter: the painted stroke is the hole, so that is what must grow over the frame.
  const cx = bb.width > 0 ? bb.x + bb.width * 0.13 : 500, cy = bb.height > 0 ? bb.y + bb.height / 2 : 290;
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.inOut", duration: 1.2 } });
  // Hold on the title, then the O-shaped hole scales 1 to 60 about its left stroke over 1.2 s (power3.inOut) until the frame is all scene.
  tl.fromTo("#hole", { scale: 1, svgOrigin: cx + " " + cy }, { scale: 60, duration: 1.2, ease: "power3.inOut" }, 0.75);
  // The scene behind pushes in gently as it is pulled into view.
  tl.fromTo("#content", { scale: 0.92 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 0.75);
  tl.fromTo("#cover", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "none" }, 1.95);
  // Quieter second move: the three name rows settle in one after the other.
  tl.fromTo(".name", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.12 }, 2.0);
  tl.to("#content", { scale: 1.03, duration: 0.8, ease: "sine.inOut" }, 2.2);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
