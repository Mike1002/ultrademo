<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-phrase-push-build</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #line { position: absolute; left: 584px; top: 220px; width: 0; height: 120px; }
  .chunk { position: absolute; left: 0; top: 0; height: 120px; line-height: 120px; font-size: 96px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; will-change: transform; }
  #ul { position: absolute; left: 0; top: 130px; width: 1168px; height: 8px; border-radius: 4px; background: #f2c200; will-change: transform; }
  #mid { position: absolute; left: 583px; top: 170px; width: 2px; height: 220px; background: #e3ded2; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="mid"></div>
      <div id="line" data-layout-allow-overlap>
        <div class="chunk" id="c0">Every</div>
        <div class="chunk" id="c1">frame</div>
        <div class="chunk" id="c2">is</div>
        <div class="chunk" id="c3">code.</div>
        <div id="ul"></div>
      </div>
    </div>
    <div id="label"><span class="l-name">Phrase push build</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out", duration: 0.45 } });
  const GAP = 28, ENTER = 80, IN = 0.45, STEP = 0.3, T0 = 0.3;
  const els = ["#c0", "#c1", "#c2", "#c3"].map(s => document.querySelector(s));
  const widths = els.map(el => el.offsetWidth + GAP);
  // left edge of chunk i once chunks 0..k are on screen, measured from the centre line
  const leftOf = (i, k) => { let total = 0; for (let j = 0; j <= k; j++) total += widths[j]; total -= GAP; let before = 0; for (let j = 0; j < i; j++) before += widths[j]; return -total / 2 + before; };
  els.forEach((el, i) => {
    const t = T0 + i * STEP;
    // the new chunk enters from 80 px right of its slot; every earlier chunk shifts left by half the new width
    tl.fromTo(el, { x: leftOf(i, i) + ENTER, opacity: 0 }, { x: leftOf(i, i), opacity: 1, duration: IN, ease: "expo.out" }, t);
    for (let j = 0; j < i; j++) tl.to(els[j], { x: leftOf(j, i), duration: IN, ease: "expo.out" }, t);
  });
  // Final hold, then a yellow rule draws under the finished phrase.
  const total = widths.reduce((a, b) => a + b, 0) - GAP;
  tl.fromTo("#ul", { x: -total / 2, scaleX: 0, transformOrigin: "0% 50%" }, { x: -total / 2, scaleX: total / 1168, duration: 0.5, ease: "power2.inOut" }, T0 + 3 * STEP + IN + 0.6);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
