<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-image-fanout</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .frame { position: absolute; left: 414px; top: 150px; width: 340px; height: 230px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 20px; overflow: hidden; will-change: transform; }
  .frame .bar { position: absolute; left: 0; top: 0; width: 336px; height: 36px; border-bottom: 2px solid #e3ded2; }
  .frame .dot { position: absolute; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: #e3ded2; }
  .frame .ttl { position: absolute; left: 24px; top: 56px; font-size: 24px; font-weight: 700; }
  .frame .ln { position: absolute; left: 24px; height: 10px; border-radius: 5px; background: #e3ded2; }
  .frame .btn { position: absolute; left: 24px; top: 166px; width: 120px; height: 40px; border-radius: 10px; background: #ece7da; border: 2px solid #1d1c1a;
    font-size: 15px; font-weight: 700; line-height: 36px; text-align: center; }
  #f5 .btn { background: #f2c200; }
  #cap { position: absolute; left: 0; top: 452px; width: 1168px; text-align: center; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  #sub { position: absolute; left: 0; top: 502px; width: 1168px; text-align: center; font-size: 20px; color: #6d6a63; }
  #badge { position: absolute; left: 536px; top: 120px; width: 96px; height: 36px; border-radius: 18px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 15px; font-weight: 700; line-height: 32px; text-align: center; will-change: transform; z-index: 9; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="frame" id="f1" style="z-index:1" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="bar"><div class="dot" style="left:14px"></div><div class="dot" style="left:32px"></div><div class="dot" style="left:50px"></div></div>
        <div class="ttl" data-layout-allow-overlap data-layout-allow-occlusion>Capture</div><div class="ln" style="top:102px;width:220px"></div><div class="ln" style="top:124px;width:160px"></div><div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Open</div>
      </div>
      <div class="frame" id="f2" style="z-index:2" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="bar"><div class="dot" style="left:14px"></div><div class="dot" style="left:32px"></div><div class="dot" style="left:50px"></div></div>
        <div class="ttl" data-layout-allow-overlap data-layout-allow-occlusion>Record</div><div class="ln" style="top:102px;width:200px"></div><div class="ln" style="top:124px;width:240px"></div><div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Open</div>
      </div>
      <div class="frame" id="f3" style="z-index:3" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="bar"><div class="dot" style="left:14px"></div><div class="dot" style="left:32px"></div><div class="dot" style="left:50px"></div></div>
        <div class="ttl" data-layout-allow-overlap data-layout-allow-occlusion>Ship</div><div class="ln" style="top:102px;width:260px"></div><div class="ln" style="top:124px;width:180px"></div><div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Open</div>
      </div>
      <div class="frame" id="f4" style="z-index:4" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="bar"><div class="dot" style="left:14px"></div><div class="dot" style="left:32px"></div><div class="dot" style="left:50px"></div></div>
        <div class="ttl" data-layout-allow-overlap data-layout-allow-occlusion>Share</div><div class="ln" style="top:102px;width:180px"></div><div class="ln" style="top:124px;width:230px"></div><div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Open</div>
      </div>
      <div class="frame" id="f5" style="z-index:5" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="bar"><div class="dot" style="left:14px"></div><div class="dot" style="left:32px"></div><div class="dot" style="left:50px"></div></div>
        <div class="ttl" data-layout-allow-overlap data-layout-allow-occlusion>Edit</div><div class="ln" style="top:102px;width:240px"></div><div class="ln" style="top:124px;width:150px"></div><div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Open</div>
      </div>
      <div id="badge" data-layout-allow-overlap data-layout-allow-occlusion>5 frames</div>
      <div id="cap">Record · Edit · Ship</div>
      <div id="sub">Five product frames in one stack</div>
    </div>
    <div id="label"><span class="l-name">Image fan out</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.5 } });
  // Params: 0.5 s per move, 8 deg per step, power2.out; five frames pivot about a point below their bottom edge.
  const frames = ["#f1", "#f2", "#f3", "#f4", "#f5"];
  const STEP_X = 150, STEP_DEG = 8;
  frames.forEach((sel, i) => {
    const offset = i - 2;
    gsap.set(sel, { transformOrigin: "50% 180%" });
    // Open: from the compact stack into the fan, staggered 50 ms from the first.
    tl.fromTo(sel, { x: 0, rotation: 0 }, { x: offset * STEP_X, rotation: offset * STEP_DEG, duration: 0.5, ease: "power2.out" }, 0.3 + i * 0.05);
    // Close: back to the stack, same stagger, after a hold.
    tl.to(sel, { x: 0, rotation: 0, duration: 0.5, ease: "power2.inOut" }, 2.0 + i * 0.05);
  });
  // The badge lifts away while the fan is open and drops back as it closes.
  tl.fromTo("#badge", { y: 0 }, { y: -58, duration: 0.5, ease: "power2.out" }, 0.3);
  tl.to("#badge", { y: 0, duration: 0.5, ease: "power2.inOut" }, 2.0);
  tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.7);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
