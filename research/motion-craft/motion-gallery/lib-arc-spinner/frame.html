<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-arc-spinner</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .heading { position: absolute; left: 80px; top: 50px; font-size: 18px; color: #6d6a63; }
  .copy { position: absolute; left: 650px; top: 160px; }
  .copy .t-xl { font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; white-space: nowrap; }
  .copy p { font-size: 22px; color: #6d6a63; margin-top: 18px; white-space: nowrap; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
  .dial { position: absolute; left: 104px; top: 90px; width: 360px; height: 360px; }
  .dial svg { position: absolute; left: 0; top: 0; width: 360px; height: 360px; overflow: visible; }
  .dial .num { position: absolute; left: 0; top: 0; width: 360px; height: 360px; display: flex; align-items: center; justify-content: center; font-size: 95px; font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="dial">
        <svg viewBox="0 0 360 360"><circle cx="180" cy="180" r="145" fill="none" stroke="#e3ded2" stroke-width="2"/><circle id="arc" cx="180" cy="180" r="145" fill="none" stroke="#f2c200" stroke-width="12" stroke-linecap="round" pathLength="100"/></svg>
        <span class="num">3</span>
      </div>
      <div class="copy"><div class="t-xl">Sending</div><div class="t-xl">invites</div><p>An arc that changes length · still working</p></div>
    </div>
    <div id="label"><span class="l-name">Arc spinner</span><span class="l-sep">·</span><span>Loop &amp; Ambient</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Three turns in 3 s at constant speed; the arc length breathes 12% -> 72% -> 12% twice, independent of the rotation.
  tl.fromTo("#arc", { strokeDasharray: "12 100", rotation: 0, svgOrigin: "180 180" }, { rotation: 1080, duration: 3, ease: "none" }, 0);
  for (let i = 0; i < 2; i++) {
    tl.fromTo("#arc", { strokeDasharray: "12 100" }, { strokeDasharray: "72 100", duration: 0.75, ease: "sine.inOut", immediateRender: false }, i * 1.5);
    tl.fromTo("#arc", { strokeDasharray: "72 100" }, { strokeDasharray: "12 100", duration: 0.75, ease: "sine.inOut", immediateRender: false }, i * 1.5 + 0.75);
  }
  window.__timelines["main"] = tl;
</script>
</body>
</html>
