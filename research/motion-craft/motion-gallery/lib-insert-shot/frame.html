<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-insert-shot</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; will-change: transform, opacity, filter; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
  .card { position: absolute; left: 264px; top: 110px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, filter, opacity; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  .card h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; white-space: nowrap; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a; color: #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; will-change: transform; }
  .card.b h1 { font-size: 96px; line-height: 104px; top: 74px; font-variant-numeric: tabular-nums; }
  .card.b .sub { top: 190px; }
  .card.b .bar { position: absolute; left: 56px; top: 250px; width: 300px; height: 14px; border-radius: 7px; background: #f2c200; border: 2px solid #1d1c1a; transform-origin: 0 50%; will-change: transform; }
  .cursor { position: absolute; width: 28px; height: 38px; z-index: 10; pointer-events: none; transform-origin: 2px 2px; will-change: transform; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
  .cursor svg { width: 28px; height: 38px; display: block; }

  .shot.a { background: #f6f3ec; }
  #detail { background: #f6f3ec; opacity: 0; }
  /* The close-up is the same card seen three times larger, framed on the button: a static transform, never tweened. */
  #zoomwrap { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; transform-origin: 420px 380px; transform: translate(164px, -90px) scale(3); }
  .card .sub2 { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; white-space: nowrap; opacity: 0; }
  #tag { position: absolute; left: 24px; top: 24px; height: 30px; padding: 0 14px; border-radius: 999px; background: #1d1c1a; color: #f6f3ec;
    font-size: 13px; letter-spacing: .06em; text-transform: uppercase; line-height: 30px; opacity: 0; }

</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">

      <div data-layout-allow-overlap data-layout-allow-occlusion class="shot a" id="wide">
        <div data-layout-allow-overlap data-layout-allow-occlusion class="card a" id="a"><div data-layout-allow-overlap data-layout-allow-occlusion class="lab">Orbit</div><h1 data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</h1><div data-layout-allow-overlap data-layout-allow-occlusion class="sub">3 seats left on this plan</div><div data-layout-allow-overlap data-layout-allow-occlusion class="btn" id="btn1">Continue</div><div data-layout-allow-overlap data-layout-allow-occlusion class="sub2">Invites are on their way</div></div>
        <div class="cursor" id="cur" style="left:420px;top:380px" data-layout-allow-overlap ><svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg></div>
      </div>
      <div data-layout-allow-overlap data-layout-allow-occlusion class="shot" id="detail">
        <div data-layout-allow-overlap data-layout-allow-occlusion id="zoomwrap" data-layout-allow-overflow>
          <div data-layout-allow-overlap data-layout-allow-occlusion class="card a" id="a2"><div data-layout-allow-overlap data-layout-allow-occlusion class="lab">Orbit</div><h1 data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</h1><div data-layout-allow-overlap data-layout-allow-occlusion class="sub">3 seats left on this plan</div><div data-layout-allow-overlap data-layout-allow-occlusion class="btn" id="btn2">Continue</div></div>
          <div class="cursor" id="cur2" style="left:420px;top:380px" data-layout-allow-overlap ><svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg></div>
        </div>
        <div data-layout-allow-overlap data-layout-allow-occlusion id="tag">Close-up</div>
      </div>

    </div>
    <div id="label"><span class="l-name">Insert shot</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>

  const tl = gsap.timeline({ paused: true, defaults: { ease: "none" } });
  const IN = 0.9, OUT = 1.9;   // cut in at 0.9 s, hold the detail 1.0 s, cut back and hold the wide shot
  const DARK = { backgroundColor: "#1d1c1a", color: "#f6f3ec" }, YEL = { backgroundColor: "#f2c200", color: "#1d1c1a" };
  tl.fromTo("#wide", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
  tl.fromTo("#detail", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#tag", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo(["#btn1", "#btn2"], YEL, { backgroundColor: "#f2c200", duration: 0.01 }, 0);
  tl.fromTo("#a .sub2", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#cur2", { x: 0, y: 0, scale: 1 }, { x: 0, duration: 0.01 }, 0);
  // Wide: the cursor crosses to Continue.
  tl.fromTo("#cur", { x: 470, y: 150 }, { x: 0, y: 0, duration: 0.8, ease: "power2.out" }, 0.08);
  // Cut in: the close-up of the button with the cursor on it; the press happens here, three times larger.
  tl.set("#wide", { opacity: 0 }, IN);
  tl.set("#detail", { opacity: 1 }, IN);
  tl.set("#tag", { opacity: 1 }, IN);
  tl.to("#cur2", { scale: 0.85, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1 }, 1.15);
  tl.fromTo("#btn2", { scale: 1 }, { scale: 0.95, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, 1.15);
  tl.to("#btn2", { ...DARK, duration: 0.08 }, 1.24);
  // The wide shot's button takes the same state while it is off screen, so the cut back shows it already dark.
  tl.to("#btn1", { ...DARK, duration: 0.02 }, 1.5);
  // Cut back to the wide shot: context regained, the button now dark; the cursor lifts away and the line under the title changes.
  tl.set("#detail", { opacity: 0 }, OUT);
  tl.set("#tag", { opacity: 0 }, OUT);
  tl.set("#wide", { opacity: 1 }, OUT);
  tl.to("#cur", { x: 110, y: 70, duration: 0.5, ease: "power2.inOut" }, 2.1);
  tl.to("#a .sub", { opacity: 0, duration: 0.2 }, 2.25);
  tl.to("#a .sub2", { opacity: 1, duration: 0.25 }, 2.35);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
