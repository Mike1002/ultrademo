<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>center-outward-expansion</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  .burst-wrap { position: relative; width: 100%; height: 100%; }
  /* every item sits on the stage centre; GSAP bakes xPercent/yPercent -50 and tweens x/y as pure offsets */
  .burst-item { position: absolute; top: 50%; left: 50%; width: 220px; height: 150px; background: #fffdf8;
    border: 2px solid #1d1c1a; border-radius: 20px; display: grid; place-items: center; will-change: transform; }
  .num { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; }
  .txt { font-size: 22px; font-weight: 600; text-align: center; padding: 0 20px; }
  .btn { width: 180px; height: 56px; border-radius: 14px; background: #f2c200; font-size: 22px; font-weight: 700; display: grid; place-items: center; }
  .ring { width: 72px; height: 72px; border-radius: 50%; border: 10px solid #1d1c1a; }
  .dots { display: flex; gap: 14px; }
  .dots i { display: block; width: 24px; height: 24px; border-radius: 50%; background: #1d1c1a; }
  .bars { display: flex; gap: 12px; align-items: flex-end; height: 80px; }
  .bars i { display: block; width: 22px; background: #1d1c1a; border-radius: 6px 6px 0 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="burst-wrap">
      <div class="burst-item" id="b0" data-target-x="-420" data-target-y="-190"><div class="num">1,284</div></div>
      <div class="burst-item" id="b1" data-target-x="0" data-target-y="-220"><div class="txt">Every frame is code</div></div>
      <div class="burst-item" id="b2" data-target-x="420" data-target-y="-190"><div class="dots"><i></i><i></i><i></i></div></div>
      <div class="burst-item" id="b3" data-target-x="-420" data-target-y="190"><div class="bars"><i style="height:30px"></i><i style="height:55px"></i><i style="height:42px"></i><i style="height:80px"></i></div></div>
      <div class="burst-item" id="b4" data-target-x="0" data-target-y="220"><div class="btn">Continue</div></div>
      <div class="burst-item" id="b5" data-target-x="420" data-target-y="190"><div class="num">98%</div></div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const EXPAND_DUR = 1.2, EXPAND_EASE = "power3.out", STAGGER = 0.06, ENTRY_AT = 0.2, START_PROGRESS = 0;
  const items = Array.from(document.querySelectorAll(".burst-item"));
  items.forEach((el, i) => {
    const tx = Number(el.dataset.targetX), ty = Number(el.dataset.targetY);
    tl.fromTo(el,
      { xPercent: -50, yPercent: -50, x: tx * START_PROGRESS, y: ty * START_PROGRESS, scale: 0.6, opacity: 0 },
      { x: tx, y: ty, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: EXPAND_EASE },
      ENTRY_AT + i * STAGGER);
    // post-landing life: a gentle micro-float, out of phase per item, absolute y values
    tl.to(el, { y: ty + (i % 2 ? 6 : -6), duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 1.8 + (i % 3) * 0.05);
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
