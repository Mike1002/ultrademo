<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-token-split</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .lab { position: absolute; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #row { position: absolute; left: 0; top: 230px; width: 1168px; height: 90px; display: flex; justify-content: center; align-items: flex-start; }
  .token { position: relative; display: block; height: 90px; line-height: 90px; padding: 0 8px; border-radius: 12px; font-size: 64px; font-weight: 700; white-space: nowrap; will-change: transform; }
  .token.sp { margin-right: 18px; }
  .under { position: absolute; left: 0; top: 102px; width: 100%; height: 30px; border-top: 1px solid #a19d93; padding-top: 10px; font-size: 13px; line-height: 16px; letter-spacing: .06em; color: #6d6a63; text-align: left; font-variant-numeric: tabular-nums; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="lab" style="left:120px;top:125px">Sentence → tokens</div>
      <div id="row">
        <div class="token sp" id="k1">Every<div class="under" id="u1">01</div></div>
        <div class="token sp" id="k2">frame<div class="under" id="u2">02</div></div>
        <div class="token sp" id="k3">is<div class="under" id="u3">03</div></div>
        <div class="token" id="k4">code<div class="under" id="u4">04</div></div>
        <div class="token" id="k5">.<div class="under" id="u5">05</div></div>
      </div>
    </div>
    <div id="label"><span class="l-name">Token split</span><span class="l-sep">·</span><span>Explainer</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  const toks = ["#k1", "#k2", "#k3", "#k4", "#k5"];
  // The continuous sentence spreads apart from its centre: piece i moves (i-2) x 34 px.
  toks.forEach((s, i) => tl.fromTo(s, { x: 0 }, { x: (i - 2) * 34, duration: 1.05, ease: "power3.inOut" }, 0.3));
  // Only the third piece is marked.
  tl.fromTo("#k3", { backgroundColor: "rgba(242,194,0,0)" }, { backgroundColor: "rgba(242,194,0,1)", duration: 0.35 }, 0.75);
  // Hairlines and index numbers appear under each piece in order.
  tl.fromTo(["#u1", "#u2", "#u3", "#u4", "#u5"], { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.06 }, 1.1);
  // Second beat: a small counted ripple runs through the pieces.
  toks.forEach((s, i) => {
    tl.to(s, { y: -12, duration: 0.2, ease: "power2.out" }, 2.0 + i * 0.08);
    tl.to(s, { y: 0, duration: 0.3, ease: "power2.in" }, 2.2 + i * 0.08);
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
