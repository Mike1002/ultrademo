<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-color-encoding-transition</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .cap { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; fill: #6d6a63; }
  .mode { font-size: 40px; font-weight: 700; fill: #1d1c1a; }
  .lg { font-size: 20px; fill: #1d1c1a; }
  .lgs { font-size: 16px; fill: #6d6a63; }
  .dot { stroke: #1d1c1a; stroke-width: 3; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <text class="cap" x="60" y="40">Members · 24</text>
        <g id="modeA"><text class="mode" x="60" y="92">By team</text></g>
        <g id="modeB"><text class="mode" x="60" y="92">By value</text></g>
        <g id="dots"></g>
        <g id="legA">
          <circle class="dot" cx="860" cy="200" r="16" fill="#f2c200"/><text class="lg" x="896" y="207" data-layout-allow-overlap>Design</text>
          <circle class="dot" cx="860" cy="264" r="16" fill="#1d1c1a"/><text class="lg" x="896" y="271" data-layout-allow-overlap>Sales</text>
          <circle class="dot" cx="860" cy="328" r="16" fill="#a19d93"/><text class="lg" x="896" y="335" data-layout-allow-overlap>Ops</text>
        </g>
        <g id="legB">
          <defs><linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5f00"/><stop offset="0.5" stop-color="#f2c200"/><stop offset="1" stop-color="#fbf3cf"/></linearGradient></defs>
          <rect x="844" y="184" width="32" height="160" rx="8" fill="url(#ramp)" stroke="#1d1c1a" stroke-width="3"/>
          <text class="lg" x="896" y="198" data-layout-allow-overlap>High</text>
          <text class="lgs" x="896" y="271" data-layout-allow-overlap>Invites sent</text>
          <text class="lg" x="896" y="344" data-layout-allow-overlap>Low</text>
        </g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Color encoding transition</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const dotsG = document.getElementById("dots");
  const TEAM = ["#f2c200", "#1d1c1a", "#a19d93"];
  const NEUTRAL = "#ece7da";
  const ramp = gsap.utils.interpolate(["#fbf3cf", "#f2c200", "#7a5f00"]);
  const teams = [0,1,2,0,1,1, 2,0,0,1,2,0, 1,2,0,2,1,0, 0,1,2,1,0,2];
  const dots = [];
  for (let i = 0; i < 24; i++) {
    const c = document.createElementNS(NS, "circle");
    const col = i % 6, row = Math.floor(i / 6);
    c.setAttribute("class", "dot");
    c.setAttribute("cx", 120 + col * 112);
    c.setAttribute("cy", 170 + row * 112);
    c.setAttribute("r", 30);
    c.setAttribute("fill", NEUTRAL);
    dotsG.appendChild(c);
    const v = ((i * 9301 + 49297) % 233280) / 233280;   // index-derived value, 0..1
    dots.push({ el: c, team: TEAM[teams[i]], value: ramp(v), v });
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.65 } });
  const D = 0.65, T1 = 0.25, T2 = 1.55;
  // Rest: marks neutral, "By team" title and legend hidden, "By value" hidden.
  tl.fromTo("#modeA", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#legA", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#modeB", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#legB", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  // Transition 1: every mark stays put and takes its team colour over 650 ms (linear); the legend updates at the same moment.
  dots.forEach(d => tl.fromTo(d.el, { fill: NEUTRAL }, { fill: d.team, duration: D }, T1));
  tl.to("#modeA", { opacity: 1, duration: D }, T1);
  tl.to("#legA", { opacity: 1, duration: D }, T1);
  // Transition 2: the same marks recolour by value on a yellow ramp; team legend gives way to the ramp legend.
  dots.forEach(d => tl.fromTo(d.el, { fill: d.team }, { fill: d.value, duration: D, immediateRender: false }, T2));
  tl.to("#modeA", { opacity: 0, duration: D }, T2);
  tl.to("#legA", { opacity: 0, duration: D }, T2);
  tl.to("#modeB", { opacity: 1, duration: D }, T2);
  tl.to("#legB", { opacity: 1, duration: D }, T2);
  // Settle: the highest-value mark gets a brief stroke pulse so the frame keeps moving.
  const topDot = dots.reduce((a, b) => (b.v > a.v ? b : a));
  tl.fromTo(topDot.el, { attr: { "stroke-width": 3 } }, { attr: { "stroke-width": 9 }, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 2.45);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
