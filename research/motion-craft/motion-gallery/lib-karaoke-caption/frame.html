<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-karaoke-caption</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px;  }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .diagram { position: absolute; left: 110px; right: 110px; top: 240px; display: flex; align-items: center; gap: 30px; }
  .diagram i { height: 1px; background: #e3ded2; flex: 1; display: block; }
  .diagram .dot { width: 38px; height: 38px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; }
  .headline { position: absolute; left: 110px; top: 95px; font-size: 56px; font-weight: 700; }
  .rail { position: absolute; left: 70px; right: 70px; top: 470px; height: 72px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 46px; }
  .rail span { display: block; white-space: nowrap; padding: 4px 14px; border-radius: 14px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="diagram"><span class="lab">Invite</span><i></i><span class="lab">Accept</span><i></i><span class="dot"></span></div>
      <div class="headline">Invite your team</div>
      <div class="rail" id="rail"><span id="w1">Invite</span><span id="w2">your</span><span id="w3">team</span><span id="w4">in</span><span id="w5">one</span><span id="w6">click.</span></div>
    </div>
    <div id="label"><span class="l-name">Karaoke caption</span><span class="l-sep">·</span><span>Captions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Fixed cues standing in for word timestamps; the pill moves, the line does not.
  const OFF = "rgba(242,194,0,0)", ON = "#f2c200";
  const cues = [[0.3, 0.72], [0.72, 1.14], [1.14, 1.56], [1.56, 1.98], [1.98, 2.4], [2.4, 2.95]];
  cues.forEach(([start, end], i) => {
    const el = "#w" + (i + 1);
    tl.fromTo(el, { backgroundColor: OFF }, { backgroundColor: ON, duration: 0.15, ease: "power1.out" }, start);
    tl.to(el, { backgroundColor: OFF, duration: 0.15, ease: "power1.out" }, end);
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
