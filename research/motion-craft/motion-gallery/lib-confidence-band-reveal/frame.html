<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-confidence-band-reveal</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .cap { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; fill: #6d6a63; }
  .ttl { font-size: 40px; font-weight: 700; fill: #1d1c1a; }
  .tick { font-size: 18px; fill: #6d6a63; }
  .grid { stroke: #e3ded2; stroke-width: 2; }
  .axis { stroke: #1d1c1a; stroke-width: 2; }
  #band { fill: #f2c200; opacity: 0.22; }
  #est { fill: none; stroke: #1d1c1a; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  #hist { fill: none; stroke: #1d1c1a; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  .note { font-size: 20px; font-weight: 700; fill: #1d1c1a; }
  .notes { font-size: 16px; fill: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <defs>
          <clipPath id="reveal"><rect id="revealRect" x="160" y="60" width="0" height="480"/></clipPath>
        </defs>
        <text class="cap" x="160" y="36">Forecast · invites</text>
        <line class="grid" x1="160" y1="150" x2="1080" y2="150"/>
        <line class="grid" x1="160" y1="260" x2="1080" y2="260"/>
        <line class="grid" x1="160" y1="370" x2="1080" y2="370"/>
        <line class="axis" x1="160" y1="480" x2="1080" y2="480"/>
        <line class="axis" x1="160" y1="60" x2="160" y2="480"/>
        <text class="tick" x="140" y="156" text-anchor="end">15k</text>
        <text class="tick" x="140" y="266" text-anchor="end">10k</text>
        <text class="tick" x="140" y="376" text-anchor="end">5k</text>
        <text class="tick" x="140" y="486" text-anchor="end">0</text>
        <text class="tick" x="160" y="514" text-anchor="middle">Jan</text>
        <text class="tick" x="390" y="514" text-anchor="middle">Apr</text>
        <text class="tick" x="620" y="514" text-anchor="middle">Jul</text>
        <text class="tick" x="850" y="514" text-anchor="middle">Oct</text>
        <text class="tick" x="1080" y="514" text-anchor="middle">Dec</text>
        <line id="today" x1="620" y1="60" x2="620" y2="480" stroke="#a19d93" stroke-width="2" stroke-dasharray="6 8"/>
        <g clip-path="url(#reveal)">
          <polygon id="band" points=""/>
          <polyline id="hist" points=""/>
          <polyline id="est" points=""/>
        </g>
        <g id="note">
          <text class="note" x="1072" y="90" text-anchor="end">12,480 expected</text>
          <text class="notes" x="1072" y="116" text-anchor="end">90% interval</text>
        </g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Confidence band reveal</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // Monthly invites: actuals Jan-Jul, estimate Jul-Dec. y: 0 at 480, 15k at 150 (22 px per 1k).
  const xs = [160, 237, 313, 390, 467, 543, 620, 697, 773, 850, 927, 1003, 1080];
  const vals = [2.1, 2.6, 2.4, 3.3, 3.9, 4.4, 5.0, 5.6, 6.4, 7.3, 8.8, 10.6, 12.48];
  const y = v => 480 - v * 22;
  const pts = arr => arr.map((v, i) => xs[i] + "," + y(v)).join(" ");
  // Band half-width in k: zero at the last actual, widening toward the right. Wide (early) and narrow (after more data).
  const wide = [0, 0.5, 1.0, 1.6, 2.3, 3.1, 4.0];
  const narrow = [0, 0.25, 0.5, 0.8, 1.15, 1.55, 2.0];
  const bandPts = hw => {
    const upper = [], lower = [];
    for (let i = 6; i < 13; i++) { upper.push(xs[i] + "," + y(vals[i] + hw[i - 6])); lower.unshift(xs[i] + "," + y(Math.max(0, vals[i] - hw[i - 6]))); }
    return upper.concat(lower).join(" ");
  };
  document.getElementById("hist").setAttribute("points", pts(vals.slice(0, 7)));
  document.getElementById("est").setAttribute("points", vals.slice(6).map((v, i) => xs[i + 6] + "," + y(v)).join(" "));
  document.getElementById("band").setAttribute("points", bandPts(wide));
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 1.2 } });
  // Rest: nothing revealed, note hidden.
  tl.fromTo("#note", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#band", { attr: { points: bandPts(wide) } }, { attr: { points: bandPts(wide) }, duration: 0.01 }, 0);
  // Reveal: one clip rectangle unfolds the estimate line and its band together, left to right over 1.2 s (linear).
  tl.fromTo("#revealRect", { attr: { width: 0 } }, { attr: { width: 920 }, duration: 1.2, ease: "none" }, 0.2);
  tl.to("#note", { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.3);
  // Second beat: more data arrives, so the band narrows around the same estimate.
  tl.to("#band", { attr: { points: bandPts(narrow) }, duration: 0.7, ease: "power2.inOut" }, 2.0);
  tl.fromTo("#band", { opacity: 0.22 }, { opacity: 0.3, duration: 0.7, ease: "power2.inOut" }, 2.0);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
