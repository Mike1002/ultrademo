<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-card-flip</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #171a21; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #171a21; color: #ece8df;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px;  }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #a7adbb; white-space: nowrap; }
  .num { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .t-xl { font-size: 84px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .t-l { font-size: 56px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .t-m { font-size: 34px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .t-body { font-size: 22px; line-height: 1.4; }
  .hair { height: 1px; background: #2a2f3a; }
  .dot { border-radius: 50%; background: #ece8df; }
  .dot.v { background: #f2c200; border: 2px solid #ece8df; }

  .space { position: absolute; inset: 0; perspective: 900px; }
  .card { position: absolute; left: 244px; top: 120px; width: 680px; height: 340px; transform-style: preserve-3d; will-change: transform; }
  .face { position: absolute; inset: 0; background: #1f232c; border: 2px solid #ece8df; border-radius: 24px; backface-visibility: hidden; padding: 44px; }
  .back { transform: rotateY(180deg); }
  .face .lab { margin-bottom: 35px; }
  .face .t-l { font-size: 62px; }
  .face .dot { position: absolute; right: 42px; bottom: 36px; width: 48px; height: 48px; }
  .hint { position: absolute; left: 0; width: 1168px; top: 500px; text-align: center; }

  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #a7adbb; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #ece8df; font-weight: 700; }
  #label .l-sep { color: #6d7380; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">

      <div class="space"><div class="card" data-layout-allow-overlap>
        <section class="face" data-layout-allow-overlap data-layout-allow-occlusion><div class="lab">Invite</div><div class="t-l" data-layout-allow-overlap>Invite your team</div></section>
        <section class="face back" data-layout-allow-overlap data-layout-allow-occlusion><div class="lab">Sent</div><div class="t-l" data-layout-allow-overlap>12,480 invites sent</div><div class="dot v"></div></section>
      </div></div>
      <div class="lab hint">One card · two states</div>

    </div>
    <div id="label"><span class="l-name">Card flip</span><span class="l-sep">·</span><span>3D & Depth</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });

  // Card flip: the card turns 180 degrees around its vertical axis to show its back (backface hidden on both faces), then turns on to the front again.
  tl.fromTo(".card", { rotationY: 0 }, { rotationY: 180, duration: 0.8, ease: "power2.inOut" }, 0.4);
  tl.to(".card", { rotationY: 360, duration: 0.8, ease: "power2.inOut" }, 2.1);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
