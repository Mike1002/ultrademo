<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-split-edit</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .strip-lab { position: absolute; left: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #pic { position: absolute; left: 0; top: 24px; width: 1168px; height: 300px; border: 2px solid #1d1c1a; border-radius: 20px; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 0; width: 1164px; height: 296px; }
  #pa { background: #ece7da; }
  #pb { background: #fffdf8; }
  #pa .card { position: absolute; left: 282px; top: 38px; width: 600px; height: 220px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 20px; }
  #pa .lab { position: absolute; left: 40px; top: 30px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #pa .h1 { position: absolute; left: 40px; top: 54px; font-size: 44px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  #pa .btn { position: absolute; left: 40px; top: 130px; width: 170px; height: 52px; border-radius: 12px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 18px; font-weight: 700; line-height: 48px; text-align: center; }
  #pb .num { position: absolute; left: 0; top: 58px; width: 1164px; text-align: center; font-size: 120px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #pb .cap { position: absolute; left: 0; top: 196px; width: 1164px; text-align: center; font-size: 22px; color: #6d6a63; }
  #snd { position: absolute; left: 0; top: 394px; width: 1168px; height: 166px; border: 2px solid #1d1c1a; border-radius: 20px; overflow: hidden; background: #fffdf8; }
  #wave { position: absolute; left: 0; top: 0; width: 2140px; height: 162px; will-change: transform; }
  .bar { position: absolute; width: 6px; border-radius: 3px; }
  .bar.a { background: #a19d93; }
  .bar.b { background: #1d1c1a; }
  #head { position: absolute; left: 582px; top: 0; width: 4px; height: 162px; background: #f2c200; border-left: 1px solid #1d1c1a; border-right: 1px solid #1d1c1a; }
  .tag { position: absolute; top: 344px; height: 32px; padding: 0 16px; border-radius: 16px; background: #1d1c1a; color: #f6f3ec; font-size: 15px; font-weight: 700; line-height: 32px; white-space: nowrap; will-change: transform, opacity; }
  #tj { left: 600px; } #tlc { left: 600px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="strip-lab" style="top:0">Picture</div>
      <div id="pic">
        <div class="shot" id="pb"><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div><div class="cap" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div></div>
        <div class="shot" id="pa" data-layout-allow-overlap><div class="card"><div class="lab">Orbit</div><div class="h1">Invite your team</div><div class="btn">Continue</div></div></div>
      </div>
      <div class="tag" id="tj" data-layout-allow-overlap data-layout-allow-occlusion>J-cut · sound leads by 0.4 s</div>
      <div class="tag" id="tlc" data-layout-allow-overlap data-layout-allow-occlusion>L-cut · sound lingers 0.4 s</div>
      <div class="strip-lab" style="top:370px">Sound</div>
      <div id="snd">
        <div id="wave" data-layout-allow-overlap data-layout-allow-overflow></div>
        <div id="head" data-layout-allow-overlap></div>
      </div>
    </div>
    <div id="label"><span class="l-name">J-cut and L-cut</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // The waveform scrolls left at 320 px/s under a fixed playhead at x 584. A bar at x reaches the playhead at t = (x - 584) / 320.
  // Sound switches to B at 0.7 s (x 808) and back to A at 2.5 s (x 1384); the picture cuts at 1.1 s and 2.1 s.
  const SPEED = 320, HEAD = 584, PITCH = 10, N = 214;
  const SW_B = HEAD + SPEED * 0.7, SW_A = HEAD + SPEED * 2.5;
  let html = "";
  for (let j = 0; j < N; j++) {
    const x = j * PITCH, r1 = ((j * 9301 + 49297) % 233280) / 233280, r2 = ((j * 7919 + 104729) % 233280) / 233280;
    const isB = x >= SW_B && x < SW_A;
    const h = isB ? 40 + r1 * 100 + Math.sin(j * 0.9) * 12 : 12 + r1 * 30 + r2 * 8;
    html += '<div class="bar ' + (isB ? "b" : "a") + '" style="left:' + x + 'px;top:' + (81 - h / 2).toFixed(1) + 'px;height:' + h.toFixed(1) + 'px"></div>';
  }
  document.getElementById("wave").innerHTML = html;
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.6 } });
  tl.fromTo("#wave", { x: 0 }, { x: -SPEED * 3, duration: 3, ease: "none" }, 0);
  // Picture hard cuts, one frame each: A -> B at 1.1 s (the J-cut lands), B -> A at 2.1 s (the L-cut: B's sound carries on to 2.5 s).
  tl.fromTo("#pa", { opacity: 1 }, { opacity: 0, duration: 0.034 }, 1.1);
  tl.to("#pa", { opacity: 1, duration: 0.034 }, 2.1);
  // Tags name each cut as it happens.
  tl.fromTo("#tj", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.7);
  tl.to("#tj", { opacity: 0, duration: 0.2 }, 1.8);
  tl.fromTo("#tlc", { opacity: 0, y: 8 }, { opacity: 0, duration: 0.01 }, 0);
  tl.to("#tlc", { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 2.1);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
