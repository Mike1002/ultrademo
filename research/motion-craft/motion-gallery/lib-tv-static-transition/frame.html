<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-tv-static-transition</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .card { position: absolute; left: 264px; top: 110px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: opacity; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  #b h1 { font-size: 96px; line-height: 104px; top: 74px; font-variant-numeric: tabular-nums; }
  #b .sub { top: 190px; }
  #cv { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; opacity: 0; will-change: opacity; }
  #flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="card" id="a" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div>
        <h1 data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</h1>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left on this plan</div>
        <div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div>
      </div>
      <div class="card" id="b" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>This month</div>
        <h1 data-layout-allow-overlap data-layout-allow-occlusion>12,480</h1>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div>
      </div>
      <canvas id="cv" width="1168" height="580" data-layout-allow-overlap></canvas>
      <div id="flash" data-layout-allow-overlap></div>
    </div>
    <div id="label"><span class="l-name">TV static transition</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  const W = 1168, H = 580, N = 5;
  // Five grey-noise tiles baked once from a seeded generator (mulberry32, seed 29); the frame picks a tile by its number, never Math.random.
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = rand(29);
  const tiles = [];
  for (let k = 0; k < N; k++) {
    const c = document.createElement("canvas"); c.width = W / 2; c.height = H / 2;
    const x = c.getContext("2d"), img = x.createImageData(W / 2, H / 2), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.floor(rnd() * 256), g = v < 40 ? 20 : v > 215 ? 240 : v;
      d[i] = g; d[i + 1] = g; d[i + 2] = g; d[i + 3] = 255;
    }
    x.putImageData(img, 0, 0); tiles.push(c);
  }
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  let last = -1;
  function renderAt(t) {
    const k = Math.floor(t * 15) % N;   // a new tile every two frames
    if (k === last) return; last = k;
    ctx.drawImage(tiles[k], 0, 0, W / 2, H / 2, 0, 0, W, H);
    // a faint dark roll bar drifting with the tile, as on an untuned set
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(0, (k * 137) % H, W, 40);
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power1.inOut", duration: 0.2 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  // Resting state: A on top, B hidden, static and flash clear.
  tl.fromTo("#a", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
  tl.fromTo("#b", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#cv", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#flash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  // Static burst from `from` to `to` at t: the noise rises to 0.92 over `inD` (power1.in), the scenes swap under it with a 120 ms white kick,
  // a short hold, then the noise falls away over `outD` (power1.out).
  function burst(from, to, t, inD, hold, outD) {
    tl.to("#cv", { opacity: 0.92, duration: inD, ease: "power1.in" }, t);
    tl.to(from, { opacity: 0, duration: 0.034, ease: "none" }, t + inD);
    tl.to(to, { opacity: 1, duration: 0.034, ease: "none" }, t + inD);
    tl.to("#flash", { opacity: 0.4, duration: 0.04, ease: "none" }, t + inD);
    tl.to("#flash", { opacity: 0, duration: 0.08, ease: "none" }, t + inD + 0.04);
    tl.to("#cv", { opacity: 0, duration: outD, ease: "power1.out" }, t + inD + hold);
  }
  burst("#a", "#b", 0.9, 0.2, 0.15, 0.2);     // 500 ms, the card's own timing, centred on the poster
  burst("#b", "#a", 2.3, 0.12, 0.08, 0.15);   // a shorter signal drop back, so the second half moves
  window.__timelines["main"] = tl;
</script>
</body>
</html>
