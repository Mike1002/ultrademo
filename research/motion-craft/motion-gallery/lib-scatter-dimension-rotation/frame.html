<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-scatter-dimension-rotation</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #171a21; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #171a21; color: #ece8df;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #a7adbb; white-space: nowrap; }
  .t-m { font-size: 34px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .space { position: absolute; inset: 0; perspective: 1200px; }
  #cloud { position: absolute; left: 584px; top: 318px; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
  .ax { position: absolute; background: #6d7380; }
  #axx { left: -330px; top: -1px; width: 660px; height: 2px; }
  #axy { left: -1px; top: -200px; width: 2px; height: 400px; will-change: transform; }
  #axz { left: -330px; top: -1px; width: 660px; height: 2px; background: #f2c200; will-change: transform; }
  .dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #ece8df; border: 2px solid #171a21; will-change: transform; }
  .dot.v { background: #f2c200; }
  #title { position: absolute; left: 0; top: 0; }
  #sub { position: absolute; left: 0; top: 46px; }
  #axlab { position: absolute; right: 0; top: 540px; width: 400px; height: 20px; text-align: right; }
  #axlab span { position: absolute; right: 0; top: 0; }
  #ylab { position: absolute; left: 0; top: 540px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #a7adbb; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #ece8df; font-weight: 700; }
  #label .l-sep { color: #6d7380; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="space"><div id="cloud" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="ax" id="axx" data-layout-allow-overlap data-layout-allow-occlusion></div>
        <div class="ax" id="axy" data-layout-allow-overlap data-layout-allow-occlusion></div>
        <div class="ax" id="axz" data-layout-allow-overlap data-layout-allow-occlusion></div>
      </div></div>
      <div class="t-m" id="title">Rotate to the next pair</div>
      <div class="lab" id="sub">28 members · yellow is the Sales team</div>
      <div class="lab" id="ylab">Up: seats filled</div>
      <div class="lab" id="axlab"><span id="lx">Across: invites sent</span><span id="lz">Across: replies</span></div>
    </div>
    <div id="label"><span class="l-name">Scatter dimension rotation</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const r = rand(33), cloud = document.getElementById("cloud");
  // 28 points with three baked variables: x (invites), y (seats), z (replies). z follows y loosely so the new plane shows a pattern.
  const pts = Array.from({ length: 28 }, (_, i) => { const x = -290 + r() * 580, y = -170 + r() * 340; const z = Math.max(-290, Math.min(290, y * 1.2 + (r() - 0.5) * 220)); return { x, y, z, v: i % 4 === 0 }; });
  const dots = pts.map(p => { const d = document.createElement("div"); d.className = "dot" + (p.v ? " v" : ""); d.style.left = (p.x - 9) + "px"; d.style.top = (p.y - 9) + "px";
    d.setAttribute("data-layout-allow-overlap", ""); d.setAttribute("data-layout-allow-occlusion", ""); cloud.appendChild(d); return d; });
  gsap.set("#axz", { rotationY: 90 });

  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 0.6 } });
  tl.fromTo("#lz", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  // 1. Expand: each point moves out along z to its third variable (0.3 s, 400 ms).
  dots.forEach((d, i) => tl.fromTo(d, { z: 0, rotationY: 0, x: 0 }, { z: pts[i].z, duration: 0.4, ease: "power2.out" }, 0.3));
  // 2. Rotate: the cloud turns 90 degrees about Y while every dot counter-turns so it keeps facing the camera (0.7 s, 600 ms).
  tl.fromTo(cloud, { rotationY: 0 }, { rotationY: 90, duration: 0.6 }, 0.7);
  dots.forEach(d => tl.to(d, { rotationY: -90, duration: 0.6 }, 0.7));
  tl.fromTo("#axy", { rotationY: 0 }, { rotationY: -90, duration: 0.6 }, 0.7);   // the vertical axis stays face-on too
  tl.to("#lx", { opacity: 0, duration: 0.3, ease: "none" }, 0.85);
  tl.to("#lz", { opacity: 1, duration: 0.3, ease: "none" }, 1.0);
  // 3. Compress: the old across-variable, now depth, collapses to zero so the points regroup in the new plane (1.3 s, 400 ms).
  dots.forEach((d, i) => tl.to(d, { x: -pts[i].x, duration: 0.4, ease: "power2.in" }, 1.3));
  // Settle: the Sales points pulse once so the new grouping is pointed at.
  dots.forEach((d, i) => { if (pts[i].v) tl.fromTo(d, { scale: 1 }, { scale: 1.6, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.inOut", immediateRender: false }, 2.2 + (i % 7) * 0.04); });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
