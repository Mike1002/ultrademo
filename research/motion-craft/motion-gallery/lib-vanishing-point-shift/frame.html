<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-vanishing-point-shift</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #cam { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; perspective: 1000px; perspective-origin: 30% 50%; }
  #world { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; transform-style: preserve-3d; }
  #floor { position: absolute; left: -216px; top: -270px; width: 1600px; height: 1200px; transform-origin: 50% 50%; transform: translateY(290px) rotateX(90deg);
    background-image: linear-gradient(#e3ded2 2px, transparent 2px), linear-gradient(90deg, #e3ded2 2px, transparent 2px); background-size: 80px 80px; background-position: 40px 40px; }
  #page { position: absolute; left: 284px; top: 70px; width: 600px; height: 430px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; transform: translateZ(0px); }
  #page .lab { position: absolute; left: 48px; top: 40px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  #page h1 { position: absolute; left: 48px; top: 68px; font-size: 52px; font-weight: 700; line-height: 60px; white-space: nowrap; }
  #page .sub { position: absolute; left: 48px; top: 142px; font-size: 22px; color: #6d6a63; white-space: nowrap; }
  .row { position: absolute; left: 48px; width: 504px; height: 56px; border-top: 2px solid #e3ded2; }
  .row .av { position: absolute; left: 0; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: #e3ded2; border: 2px solid #1d1c1a; font-size: 14px; font-weight: 700; line-height: 32px; text-align: center; }
  .row .nm { position: absolute; left: 52px; top: 18px; font-size: 20px; font-weight: 600; white-space: nowrap; }
  #side { position: absolute; left: 896px; top: 110px; width: 236px; height: 330px; background: #fbf3cf; border: 2px solid #1d1c1a; border-radius: 20px;
    transform-origin: 0% 50%; transform: translateZ(24px) rotateY(-30deg); }
  #side .lab { position: absolute; left: 28px; top: 28px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  #side .big { position: absolute; left: 28px; top: 56px; font-size: 54px; font-weight: 700; line-height: 72px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #side .sm { position: absolute; left: 28px; top: 136px; font-size: 18px; color: #6d6a63; white-space: nowrap; }
  #side .btn { position: absolute; left: 28px; top: 230px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  .chip { position: absolute; height: 40px; padding: 0 18px; border-radius: 20px; background: #fffdf8; border: 2px solid #1d1c1a; font-size: 16px; font-weight: 600; line-height: 36px; white-space: nowrap; }
  #eye { position: absolute; left: 0; top: 540px; width: 1168px; height: 24px; text-align: center; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; line-height: 24px; white-space: nowrap; }
  #eye b { color: #1d1c1a; font-weight: 700; font-variant-numeric: tabular-nums; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="cam" data-layout-allow-overflow><div id="world" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="floor" data-layout-allow-overflow data-layout-allow-overlap></div>
        <div id="page" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="lab">Orbit · Members</div>
          <h1>Invite your team</h1>
          <div class="sub">3 seats left on this plan</div>
          <div class="row" style="top:200px"><div class="av">JD</div><div class="nm">Jamie Dalton</div></div>
          <div class="row" style="top:270px"><div class="av">SK</div><div class="nm">Sam Kim</div></div>
          <div class="row" style="top:340px"><div class="av">ML</div><div class="nm">Morgan Lee</div></div>
        </div>
        <div id="side" data-layout-allow-overlap data-layout-allow-overflow data-layout-allow-occlusion>
          <div class="lab">This month</div>
          <div class="big">12,480</div>
          <div class="sm">invites sent</div>
          <div class="btn">Continue</div>
        </div>
        <div class="chip" style="left:120px;top:120px;transform:translateZ(140px)" data-layout-allow-overlap data-layout-allow-overflow>Invite sent</div>
        <div class="chip" style="left:170px;top:380px;transform:translateZ(180px)" data-layout-allow-overlap data-layout-allow-overflow>Seat taken</div>
        <div class="chip" style="left:640px;top:4px;transform:translateZ(-160px)" data-layout-allow-overlap data-layout-allow-overflow>98% accepted</div>
      </div></div>
      <div id="eye" data-layout-allow-overlap>vanishing point <b id="ev">30% 50%</b></div>
    </div>
    <div id="label"><span class="l-name">Vanishing point shift</span><span class="l-sep">·</span><span>Camera</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // Nothing in the layout moves. Only the viewport's perspective-origin (the vanishing point) travels from 30% to 70% across,
  // then settles lower, so the floor, the tilted side panel and the floating chips re-project around the flat page.
  const cam = document.getElementById("cam"), ev = document.getElementById("ev");
  const ease = gsap.parseEase("power2.inOut");
  const clamp = v => Math.max(0, Math.min(1, v));
  function renderAt(t) {
    const a = ease(clamp((t - 0.2) / 1.6)), b = ease(clamp((t - 2.1) / 0.8));
    const px = 30 + 40 * a - 20 * b, py = 50 + 22 * b;
    cam.style.perspectiveOrigin = px.toFixed(2) + "% " + py.toFixed(2) + "%";
    ev.textContent = Math.round(px) + "% " + Math.round(py) + "%";
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
