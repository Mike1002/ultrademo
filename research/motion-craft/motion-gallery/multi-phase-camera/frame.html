<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>multi-phase-camera</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  /* background lives on the scene, never on the camera */
  .clip { position: absolute; inset: 0; overflow: hidden; background: #f6f3ec; }
  .camera { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
  /* faint dot grid so the pull-back and drift are visible against the ground */
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#d9d3c4 2px, transparent 2.5px); background-size: 64px 64px; background-position: 32px 32px; }
  .card { position: absolute; left: 290px; top: 170px; width: 700px; height: 380px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  .hero { position: absolute; left: 48px; top: 48px; font-size: 56px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; will-change: transform; }
  .num { position: absolute; left: 48px; top: 140px; font-size: 96px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; will-change: transform; }
  .tag { position: absolute; left: 48px; top: 250px; font-size: 22px; color: #6d6a63; will-change: transform; }
  .cta { position: absolute; left: 452px; top: 272px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; color: #1d1c1a;
    font-size: 22px; font-weight: 700; display: grid; place-items: center; will-change: transform; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="camera" id="camera">
      <div class="dots"></div>
      <div class="card" id="card">
        <div class="hero" id="hero">Every frame is code</div>
        <div class="num" id="num">1,284</div>
        <div class="tag" id="tag">renders this week, always current</div>
        <div class="cta" id="cta">Continue</div>
      </div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const camera = document.getElementById("camera");
  // Focus-in pattern: pulled back -> neutral -> slight push.
  const PHASE_1_SCALE = 0.90, PHASE_2_SCALE = 1.0, PHASE_3_SCALE = 1.10;
  const PHASE_2_AT = 0.3, PHASE_2_DUR = 1.2, PHASE_3_AT = 1.9, PHASE_3_DUR = 1.1;
  const TOTAL_DURATION = 3, DRIFT_CYCLES = 1, DRIFT_AMP_X = 6, DRIFT_AMP_Y = 3, DRIFT_FREQ_RATIO = 1.3;
  const phase = { scale: PHASE_1_SCALE };
  const drift = { p: 0 };
  // The ONE writer of camera.style.transform: phase scale composed with the sine drift.
  function writeCamera() {
    const dx = Math.sin(drift.p) * DRIFT_AMP_X;
    const dy = Math.sin(drift.p * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y;
    camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
  }
  writeCamera(); // seed frame 0
  // Phase 2: settle to neutral focus. Phase 3: slow push-in for the climax.
  tl.fromTo(phase, { scale: PHASE_1_SCALE }, { scale: PHASE_2_SCALE, duration: PHASE_2_DUR, ease: "power2.out" }, PHASE_2_AT);
  tl.to(phase, { scale: PHASE_3_SCALE, duration: PHASE_3_DUR, ease: "power2.inOut" }, PHASE_3_AT);
  // Drift driver spans the whole composition; it is the only tween that writes the transform.
  tl.fromTo(drift, { p: 0 }, { p: Math.PI * 2 * DRIFT_CYCLES, duration: TOTAL_DURATION, ease: "none", onUpdate: writeCamera }, 0);
  // Content reveals inside the camera frame, after the pull-back has landed (so the hero never "flies away").
  tl.fromTo("#hero", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0);
  tl.fromTo("#num", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.15);
  tl.fromTo("#tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.3);
  tl.fromTo("#cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 1.45);
  // Seek safety: re-run the single writer after every render so seeks without ticks still land the pose.
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); writeCamera(); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
