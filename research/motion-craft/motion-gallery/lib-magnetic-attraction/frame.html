<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-magnetic-attraction</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #card { position: absolute; left: 304px; top: 120px; width: 560px; height: 340px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  #card .lab { position: absolute; left: 48px; top: 40px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #card h1 { position: absolute; left: 48px; top: 70px; font-size: 48px; font-weight: 700; line-height: 56px; white-space: nowrap; letter-spacing: -0.01em; }
  #card .sub { position: absolute; left: 48px; top: 140px; font-size: 20px; color: #6d6a63; }
  #btn { position: absolute; left: 352px; top: 330px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; will-change: transform; z-index: 2; }
  #ring { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; pointer-events: none; z-index: 1; }
  .cursor { position: absolute; left: 522px; top: 410px; width: 28px; height: 38px; z-index: 10; pointer-events: none; will-change: transform; }
  .cursor svg { width: 28px; height: 38px; display: block; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="card">
        <div class="lab">Orbit</div>
        <h1>Invite your team</h1>
        <div class="sub">3 seats left on this plan</div>
      </div>
      <svg id="ring" viewBox="0 0 1168 580" data-layout-allow-overlap><circle id="ringc" cx="452" cy="360" r="140" fill="none" stroke="#a19d93" stroke-width="2" stroke-dasharray="8 10"/></svg>
      <div id="btn" data-layout-allow-overlap>Continue</div>
      <div class="cursor" id="cursor" data-layout-allow-overlap>
        <svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="label"><span class="l-name">Magnetic attraction</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.5 } });
  // Params: 0.5 s per move, 12 px maximum lean, power2.out toward the pointer, back.out on the return.
  // Cursor: arrives from the lower right to just below the button's right edge, drifts up past it, then leaves.
  tl.fromTo("#cursor", { x: 400, y: 170 }, { x: 0, y: 0, duration: 0.7, ease: "power2.out" }, 0.2);
  tl.to("#cursor", { x: -10, y: -100, duration: 0.5, ease: "power2.inOut" }, 1.3);
  tl.to("#cursor", { x: 340, y: -260, duration: 0.5, ease: "power2.in" }, 2.0);
  // Button: leans toward the pointer by proximity, follows the drift, springs back when the pointer leaves.
  tl.fromTo("#btn", { x: 0, y: 0, scale: 1 }, { x: 12, y: 6, scale: 1.04, duration: 0.5, ease: "power2.out" }, 0.55);
  tl.to("#btn", { x: 10, y: -7, duration: 0.5, ease: "power2.inOut" }, 1.3);
  tl.to("#btn", { x: 0, y: 0, scale: 1, duration: 0.6, ease: "back.out(2.5)" }, 2.05);
  // The reach of the magnet, shown while the pointer is inside it.
  tl.fromTo("#ringc", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0.6);
  tl.to("#ringc", { opacity: 0, duration: 0.3, ease: "none" }, 2.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
