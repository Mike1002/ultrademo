<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-frame-border-transition</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .card { position: absolute; left: 264px; top: 110px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, opacity; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card .h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  .card.b .h1 { font-size: 96px; line-height: 104px; top: 74px; font-variant-numeric: tabular-nums; }
  .card.b .sub { top: 190px; }
  /* the frame: four ink bars that grow inward from the stage edges; together they can cover the whole stage */
  .bar { position: absolute; background: #1d1c1a; will-change: transform; }
  #bt { left: 0; top: 0; width: 1168px; height: 290px; }
  #bb { left: 0; top: 290px; width: 1168px; height: 290px; }
  #bl { left: 0; top: 0; width: 584px; height: 580px; }
  #br { left: 584px; top: 0; width: 584px; height: 580px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="card" id="a" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div>
        <div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left on this plan</div>
        <div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div>
      </div>
      <div class="card b" id="b" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>This month</div>
        <div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div>
      </div>
      <div class="bar" id="bt" data-layout-allow-overlap></div>
      <div class="bar" id="bb" data-layout-allow-overlap></div>
      <div class="bar" id="bl" data-layout-allow-overlap></div>
      <div class="bar" id="br" data-layout-allow-overlap></div>
    </div>
    <div id="label"><span class="l-name">Frame border transition</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.inOut", duration: 0.45 } });
  const BORDER = 80, SY = BORDER / 290, SX = BORDER / 584;   // bar scale that leaves an 80 px border
  const CLOSE = 0.7, HALF = 0.45, SWAP = CLOSE + HALF, OPEN = SWAP;
  // Rest: A visible, B hidden, bars flat against their edges.
  tl.fromTo("#a", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
  tl.fromTo("#b", { opacity: 0, scale: 0.94, transformOrigin: "50% 50%" }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#bt", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 0, duration: 0.01 }, 0);
  tl.fromTo("#bb", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 0, duration: 0.01 }, 0);
  tl.fromTo("#bl", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 0, duration: 0.01 }, 0);
  tl.fromTo("#br", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 0, duration: 0.01 }, 0);
  // Close: the frame grows inward from every edge (power3.in) until it covers the old scene.
  tl.to(["#bt", "#bb"], { scaleY: 1, duration: HALF, ease: "power3.in" }, CLOSE);
  tl.to(["#bl", "#br"], { scaleX: 1, duration: HALF, ease: "power3.in" }, CLOSE);
  // Swap under cover.
  tl.to("#a", { opacity: 0, duration: 0.034, ease: "none" }, SWAP);
  tl.to("#b", { opacity: 1, duration: 0.034, ease: "none" }, SWAP);
  // Open: the frame pulls back outward (power3.out) and stops as an 80 px border enclosing the new scene, which settles up to size.
  tl.to(["#bt", "#bb"], { scaleY: SY, duration: HALF, ease: "power3.out" }, OPEN);
  tl.to(["#bl", "#br"], { scaleX: SX, duration: HALF, ease: "power3.out" }, OPEN);
  tl.to("#b", { scale: 1, duration: 0.7, ease: "power3.out" }, OPEN);
  // Second beat: the frame breathes once, tightening slightly and relaxing back to the border width.
  tl.to(["#bt", "#bb"], { scaleY: SY * 1.3, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2);
  tl.to(["#bl", "#br"], { scaleX: SX * 1.3, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2);
  tl.to("#b", { scale: 0.985, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
