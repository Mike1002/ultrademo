<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-zoom-flash</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .card { position: absolute; left: 264px; top: 110px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, filter, opacity; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  #b h1 { font-size: 96px; line-height: 104px; top: 74px; font-variant-numeric: tabular-nums; }
  #b .sub { top: 190px; }
  #flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="card" id="a" data-layout-allow-overlap>
        <div class="lab">Orbit</div>
        <h1>Invite your team</h1>
        <div class="sub">3 seats left on this plan</div>
        <div class="btn">Continue</div>
      </div>
      <div class="card" id="b" data-layout-allow-overlap>
        <div class="lab">This month</div>
        <h1>12,480</h1>
        <div class="sub">invites sent</div>
      </div>
    </div>
    <div id="label"><span class="l-name">Zoom flash</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>high</span></div>
    <div id="flash" data-layout-allow-overlap></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.in", duration: 0.18 } });
  // Resting state: A on top, B hidden, flash clear.
  tl.fromTo("#a", { scale: 1, opacity: 1, filter: "blur(0px) brightness(1)" }, { scale: 1, duration: 0.01 }, 0);
  tl.fromTo("#b", { scale: 1, opacity: 0, filter: "blur(0px) brightness(1)" }, { scale: 1, duration: 0.01 }, 0);
  tl.fromTo("#flash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  // Zoom flash from `from` to `to` at time t: the outgoing card zooms to 3.2 with blur and brightness over 0.18 s (power3.in),
  // the white flash rises at +0.12 s, the cards swap at the peak, the incoming card settles from 1.3 to 1 over 0.3 s (power3.out) as the flash fades.
  function zoomFlash(from, to, t) {
    tl.to(from, { scale: 3.2, filter: "blur(4px) brightness(2.4)", duration: 0.18, ease: "power3.in" }, t);
    tl.to("#flash", { opacity: 1, duration: 0.06, ease: "none" }, t + 0.12);
    tl.to(from, { opacity: 0, duration: 0.02, ease: "none" }, t + 0.18);
    tl.fromTo(to, { scale: 1.3, opacity: 1, filter: "blur(0px) brightness(1)" }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t + 0.18);
    tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.18);
    // reset the outgoing card quietly while it is invisible, so it can come back later
    tl.to(from, { scale: 1, filter: "blur(0px) brightness(1)", duration: 0.02, ease: "none" }, t + 0.5);
  }
  zoomFlash("#a", "#b", 0.95);
  zoomFlash("#b", "#a", 2.2);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
