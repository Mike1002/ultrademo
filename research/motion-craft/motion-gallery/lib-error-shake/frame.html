<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-error-shake</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .card { position: absolute; left: 184px; top: 60px; width: 800px; height: 460px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  .card .title { position: absolute; left: 48px; top: 44px; font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  .card .sub { position: absolute; left: 48px; top: 100px; font-size: 20px; color: #6d6a63; }
  .flab { position: absolute; left: 48px; top: 160px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #field { position: absolute; left: 48px; top: 188px; width: 560px; height: 72px; will-change: transform; }
  #ring { position: absolute; left: -6px; top: -6px; width: 572px; height: 84px; border-radius: 22px; border: 4px solid #f2c200; }
  #box { position: absolute; left: 0; top: 0; width: 560px; height: 72px; border: 2px solid #1d1c1a; border-radius: 16px; background: #fffdf8; }
  #val { position: absolute; left: 22px; top: 21px; font-size: 24px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #caret { position: absolute; left: 0; top: 20px; width: 2px; height: 32px; background: #1d1c1a; will-change: transform; }
  #chk { position: absolute; left: 504px; top: 16px; width: 40px; height: 40px; }
  #err { position: absolute; left: 48px; top: 276px; font-size: 18px; color: #1d1c1a; will-change: transform, opacity; }
  #err i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; margin-right: 10px; vertical-align: -1px; }
  #ok { position: absolute; left: 48px; top: 276px; font-size: 18px; color: #6d6a63; will-change: transform, opacity; }
  .btn { position: absolute; left: 48px; top: 340px; width: 200px; height: 60px; border-radius: 14px; background: #1d1c1a; color: #fffdf8; font-size: 20px; font-weight: 600; line-height: 60px; text-align: center; }
  .seats { position: absolute; left: 272px; top: 358px; font-size: 18px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="card">
        <div class="title">Invite your team</div>
        <div class="sub">Orbit · 3 seats left</div>
        <div class="flab">Email</div>
        <div id="field" data-layout-allow-overlap>
          <div id="ring" data-layout-allow-overlap></div>
          <div id="box"></div>
          <div id="val" data-layout-allow-overlap>jamie.dalton@orbit</div>
          <div id="caret" data-layout-allow-overlap></div>
          <svg id="chk" viewBox="0 0 40 40" data-layout-allow-overlap><circle cx="20" cy="20" r="17" fill="#f2c200" stroke="#1d1c1a" stroke-width="2"/><path id="tick" d="M11 20.5 L17.5 27 L29 13.5" fill="none" stroke="#1d1c1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
        </div>
        <div id="err" data-layout-allow-overlap><i></i>Enter a full email address</div>
        <div id="ok" data-layout-allow-overlap>Looks good. Invite goes to Jamie Dalton.</div>
        <div class="btn">Continue</div>
        <div class="seats">12,480 invites sent</div>
      </div>
    </div>
    <div id="label"><span class="l-name">Error shake</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Params: shake 250 ms at 6 px, 800 ms to correct, check drawn over 300 ms (pathLength 100).
  const BASE = "jamie.dalton@orbit", FIX = ".com";
  const val = document.getElementById("val"), caret = document.getElementById("caret");
  const valLeft = 22;
  // Caret positions measured once at build time (not inside a timeline callback).
  const widths = [0, 1, 2, 3, 4].map(n => { val.textContent = BASE + FIX.slice(0, n); return val.getBoundingClientRect().width; });
  function renderAt(t) {
    let n = 0;
    if (t >= 1.3) n = 1; if (t >= 1.42) n = 2; if (t >= 1.54) n = 3; if (t >= 1.66) n = 4;
    val.textContent = BASE + FIX.slice(0, n);
    caret.style.left = (valLeft + widths[n] + 2) + "px";
  }
  renderAt(0);
  gsap.set("#ring", { opacity: 0 });
  gsap.set("#chk", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" });
  gsap.set("#err", { opacity: 0, y: 6 });
  gsap.set("#ok", { opacity: 0, y: 6 });
  gsap.set("#caret", { opacity: 1 });
  // Error: ring lights, the field shakes 250 ms at 6 px, the message appears.
  tl.fromTo("#ring", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 0.4);
  tl.fromTo("#field", { x: 0 }, { x: -6, duration: 0.0625, ease: "none" }, 0.4);
  tl.to("#field", { x: 6, duration: 0.0625, ease: "none" }, 0.4625);
  tl.to("#field", { x: -6, duration: 0.0625, ease: "none" }, 0.525);
  tl.to("#field", { x: 0, duration: 0.0625, ease: "power2.out" }, 0.5875);
  tl.fromTo("#err", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.5);
  // Correction wait, then ".com" is typed (time-driven text, seek-safe).
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  // Success: ring and error leave, the check draws over 300 ms.
  tl.to("#err", { opacity: 0, y: -6, duration: 0.2, ease: "power2.in" }, 1.8);
  tl.to("#ring", { opacity: 0, duration: 0.2, ease: "none" }, 1.8);
  tl.to("#caret", { opacity: 0, duration: 0.1, ease: "none" }, 1.85);
  tl.fromTo("#chk", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 1.9);
  tl.fromTo("#tick", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.95);
  tl.fromTo("#ok", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.2);
  // Settle: the check gives one soft pulse so the clip keeps moving.
  tl.to("#chk", { scale: 1.12, duration: 0.2, ease: "power2.out" }, 2.55);
  tl.to("#chk", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.75);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
