<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-easing-curves</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .note { position: absolute; left: 50px; top: 36px; }
  .arrived { position: absolute; left: 700px; top: 36px; }
  .row { position: absolute; left: 50px; width: 1068px; height: 100px; }
  .row.a { top: 110px; } .row.b { top: 270px; } .row.c { top: 430px; }
  .name { position: absolute; left: 0; top: 42px; }
  .track { position: absolute; left: 170px; top: 50px; width: 670px; height: 2px; background: #e3ded2; }
  .end { position: absolute; left: 839px; top: 26px; width: 2px; height: 48px; background: #a19d93; }
  .dot { position: absolute; left: 146px; top: 26px; width: 48px; height: 48px; border-radius: 50%; background: #a19d93; will-change: transform; }
  .row.c .dot { background: #f2c200; border: 2px solid #1d1c1a; }
  .graph { position: absolute; left: 925px; top: 0; width: 120px; height: 100px; }
  .graph path { fill: none; stroke: #1d1c1a; stroke-width: 2.5; }
  .graph .axis { stroke: #e3ded2; stroke-width: 1.5; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="lab note">Same distance · same time · three speed curves</div>
      <div class="lab arrived" id="arrived">All arrive together</div>
      <div class="row a"><div class="lab name">Linear</div><div class="track"></div><div class="end"></div><div class="dot" id="linear" data-layout-allow-overlap></div>
        <svg class="graph" id="gLinear" viewBox="0 0 120 100"><path class="axis" d="M10 10V90H110"/><path d="M10 90L110 10"/></svg></div>
      <div class="row b"><div class="lab name">Ease in</div><div class="track"></div><div class="end"></div><div class="dot" id="in" data-layout-allow-overlap></div>
        <svg class="graph" id="gIn" viewBox="0 0 120 100"><path class="axis" d="M10 10V90H110"/><path id="inGraph"/></svg></div>
      <div class="row c"><div class="lab name">Ease out</div><div class="track"></div><div class="end"></div><div class="dot" id="out" data-layout-allow-overlap></div>
        <svg class="graph" id="gOut" viewBox="0 0 120 100"><path class="axis" d="M10 10V90H110"/><path id="outGraph"/></svg></div>
    </div>
    <div id="label"><span class="l-name">Easing</span><span class="l-sep">·</span><span>Principles</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Draw the two curved speed graphs from the same ease functions the dots use.
  ["in", "out"].forEach((type) => {
    const ease = gsap.parseEase("power3." + type);
    document.querySelector("#" + type + "Graph").setAttribute("d",
      Array.from({ length: 41 }, (_, i) => `${i ? "L" : "M"}${10 + i * 2.5} ${90 - 80 * ease(i / 40)}`).join(" "));
  });
  const rows = [["#linear", "none"], ["#in", "power3.in"], ["#out", "power3.out"]];
  // Same start, same 670 px, same 1.5 s; only the ease differs.
  rows.forEach(([s, ease]) => tl.fromTo(s, { x: 0 }, { x: 670, duration: 1.5, ease }, 0.3));
  tl.fromTo(".graph, #arrived", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 1.85);
  // Second beat: the trip back, same three curves.
  rows.forEach(([s, ease]) => tl.to(s, { x: 0, duration: 0.8, ease }, 2.15));
  window.__timelines["main"] = tl;
</script>
</body>
</html>
