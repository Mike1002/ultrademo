<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-histogram-rebin</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .cap { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; fill: #6d6a63; }
  .ttl { font-size: 34px; font-weight: 700; fill: #1d1c1a; }
  .tick { font-size: 18px; fill: #6d6a63; }
  .axis { stroke: #1d1c1a; stroke-width: 2; }
  .bin { fill: #ece7da; stroke: #a19d93; stroke-width: 2; }
  .dot { fill: #f2c200; stroke: #1d1c1a; stroke-width: 2.5; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <text class="cap" x="160" y="36">Invites per day · 40 days</text>
        <g id="tA"><text class="ttl" x="1080" y="44" text-anchor="end">8 bins</text></g>
        <g id="tB"><text class="ttl" x="1080" y="44" text-anchor="end">4 bins</text></g>
        <g id="bins"></g>
        <g id="dots"></g>
        <line class="axis" x1="160" y1="500" x2="1080" y2="500"/>
        <g id="ticksA"></g>
        <g id="ticksB"></g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Histogram rebinning</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = rand(11);
  // 40 observations (invites sent on a day, 0-40), seeded and bimodal: quiet days around 13, launch days around 27.
  // Eight bins show the two peaks; four bins merge them into one flat block. The value axis is fixed; only the bin edges change.
  const samples = []; for (let i = 0; i < 40; i++) { const u = (rnd() + rnd() + rnd()) / 3; samples.push(Math.max(0.1, Math.min(39.9, (i < 20 ? 13 : 27) + (u - 0.5) * 14))); }
  const X0 = 160, AW = 920, BASE = 500, R = 8.5, SP = 19;
  function layout(nbins) {
    const bw = AW / nbins, counts = new Array(nbins).fill(0), pos = [];
    samples.forEach(v => { const b = Math.min(nbins - 1, Math.floor(v / 40 * nbins)); pos.push([X0 + bw * (b + 0.5), BASE - R - 4 - counts[b] * SP]); counts[b]++; });
    return { pos, counts, bw };
  }
  const LA = layout(8), LB = layout(4);
  const binsG = document.getElementById("bins"), dotsG = document.getElementById("dots");
  // Bin outlines for both states (the 4-bin set waits invisible); dots are one set, keyed by sample index.
  const binsA = LA.counts.map((c, b) => mk("rect", { class: "bin", x: X0 + b * LA.bw + 4, y: BASE - 4 - c * SP, width: LA.bw - 8, height: c * SP + 4, rx: 8 }, binsG));
  const binsB = LB.counts.map((c, b) => mk("rect", { class: "bin", x: X0 + b * LB.bw + 4, y: BASE - 4 - c * SP, width: LB.bw - 8, height: c * SP + 4, rx: 8 }, binsG));
  const dots = samples.map((v, i) => mk("circle", { class: "dot", cx: LA.pos[i][0], cy: LA.pos[i][1], r: R }, dotsG));
  const tA = document.getElementById("ticksA"), tB = document.getElementById("ticksB");
  for (let b = 0; b <= 8; b++) { const t = mk("text", { class: "tick", x: X0 + b * LA.bw, y: 530, "text-anchor": "middle" }, tA); t.textContent = b * 5; }
  for (let b = 0; b <= 4; b++) { const t = mk("text", { class: "tick", x: X0 + b * LB.bw, y: 530, "text-anchor": "middle" }, tB); t.textContent = b * 10; }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 1.0 } });
  tl.fromTo("#tB", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#ticksB", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  binsB.forEach(r => tl.fromTo(r, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0));
  // Rebin 8 -> 4 (0.3-1.3 s): every observation travels to its new column and stack height; outlines and edge labels crossfade.
  function rebin(from, to, binsFrom, binsTo, tFrom, tTo, t0) {
    dots.forEach((d, i) => tl.fromTo(d, { attr: { cx: from.pos[i][0], cy: from.pos[i][1] } }, { attr: { cx: to.pos[i][0], cy: to.pos[i][1] }, duration: 1.0, immediateRender: false }, t0 + i * 0.004));
    binsFrom.forEach(r => tl.to(r, { opacity: 0, duration: 0.4, ease: "none" }, t0));
    binsTo.forEach(r => tl.to(r, { opacity: 1, duration: 0.4, ease: "none" }, t0 + 0.6));
    tl.to(tFrom, { opacity: 0, duration: 0.3, ease: "none" }, t0);
    tl.to(tTo, { opacity: 1, duration: 0.3, ease: "none" }, t0 + 0.3);
  }
  rebin(LA, LB, binsA, binsB, "#tA, #ticksA", "#tB, #ticksB", 0.3);
  // And back to 8 bins (1.9-2.9 s): the same observations return to the finer columns.
  rebin(LB, LA, binsB, binsA, "#tB, #ticksB", "#tA, #ticksA", 1.9);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
