<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-letter-drop-pile</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #line { position: absolute; left: 0; top: 150px; width: 1168px; height: 80px; text-align: center; font-size: 68px; font-weight: 700; letter-spacing: -0.01em; line-height: 80px; white-space: nowrap; }
  #line .ch { display: inline-block; width: auto; height: 80px; line-height: 80px; will-change: transform; }
  #line .sp { display: inline-block; width: 22px; height: 80px; }
  #floor { position: absolute; left: 0; top: 540px; width: 1168px; height: 2px; background: #e3ded2; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="floor"></div>
      <div id="line" data-layout-allow-overlap></div>
    </div>
    <div id="label"><span class="l-name">Letter drop pile</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  // Params: drop interval 60 ms, fall 0.9 s with bounce.out (approximating gravity 900 px/s² and a 0.3 restitution),
  // landing tilt ±10..30° by index, a seeded landing table (no random values), then a quiet settle of the heap.
  const TEXT = "Every frame is code.";
  const line = document.getElementById("line");
  let html = "";
  for (let i = 0; i < TEXT.length; i++) {
    const c = TEXT[i];
    html += c === " " ? '<div class="sp"></div>' : '<div class="ch" id="c' + i + '" data-layout-allow-overlap>' + c + '</div>';
  }
  line.innerHTML = html;
  const chars = Array.from(line.querySelectorAll(".ch"));
  const FLOOR = 540 - 150;           // floor line in #line coordinates
  const CX = 584;
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  chars.forEach((el, k) => {
    const i = Number(el.id.slice(1));
    const w = el.offsetWidth, h = el.offsetHeight;
    const cx = el.offsetLeft + w / 2;
    const r = ((i * 9301 + 49297) % 233280) / 233280;          // seeded 0..1
    const rot = (i % 2 ? 1 : -1) * (10 + (i * 7) % 20);
    const xDrift = (CX - cx) * 0.62 + (r - 0.5) * 70;           // letters slide toward the middle of the heap
    const fx = cx + xDrift;
    const lift = Math.max(0, k - 5) * 4.5 + Math.max(0, 1 - Math.abs(fx - CX) / 260) * 44 + r * 8; // first letters floor it, later ones stack in the middle
    const yTo = FLOOR - (el.offsetTop + h) + 8 - lift;
    const at = 0.3 + k * 0.06;
    tl.fromTo(el, { y: 0 }, { y: yTo, duration: 0.9, ease: "bounce.out" }, at);
    tl.fromTo(el, { x: 0, rotation: 0 }, { x: xDrift, rotation: rot, duration: 0.9, ease: "power2.out" }, at);
    // settle: the heap compacts a touch and the tilts relax
    tl.to(el, { y: yTo + 4 + r * 4, rotation: rot * 0.82, duration: 0.4, ease: "power2.out" }, 2.4 + r * 0.15);
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
