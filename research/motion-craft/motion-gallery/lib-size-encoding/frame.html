<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-size-encoding</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #chart text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .bubble { fill: #f2c200; stroke: #1d1c1a; stroke-width: 3; }
  .centre { fill: #1d1c1a; }
  .name { font-size: 20px; font-weight: 600; fill: #1d1c1a; }
  .val { font-size: 22px; fill: #6d6a63; font-variant-numeric: tabular-nums; }
  .week { font-size: 16px; fill: #6d6a63; }
  .heading { position: absolute; left: 32px; top: 16px; font-size: 34px; font-weight: 700; }
  .sub { position: absolute; left: 34px; top: 64px; font-size: 18px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="heading">Invites by member</div>
      <div class="sub">Circle area is proportional to invites; centres never move</div>
      <svg id="chart" viewBox="0 0 1168 580" xmlns="http://www.w3.org/2000/svg">
        <text id="w1" class="week" data-layout-allow-overlap="" x="1136" y="40" text-anchor="end" opacity="1">Week 1</text>
        <text id="w2" class="week" data-layout-allow-overlap="" x="1136" y="40" text-anchor="end" opacity="0">Week 2</text>
        <g id="bubbles"></g>
        <g id="names"></g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Animated size encoding</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const NAMES = ["Jamie", "Sam", "Morgan", "Alex", "Riley"];
  const V1 = [420, 180, 300, 90, 240], V2 = [260, 380, 120, 300, 150], MAX = 420, RMAX = 100, CY = 300;
  const rOf = v => v === 0 ? 0 : Math.max(2, RMAX * Math.sqrt(v / MAX));   // area ∝ value
  const gB = document.getElementById("bubbles"), gN = document.getElementById("names"), vals = [];
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.75 } });
  const T1 = 0.3, T2 = 1.9, DUR = 0.75;
  NAMES.forEach((n, i) => {
    const cx = 184 + i * 200;
    const c = document.createElementNS(NS, "circle"); c.id = "b" + i; c.setAttribute("class", "bubble"); c.setAttribute("cx", cx); c.setAttribute("cy", CY); c.setAttribute("r", 0); gB.appendChild(c);
    const d = document.createElementNS(NS, "circle"); d.setAttribute("class", "centre"); d.setAttribute("cx", cx); d.setAttribute("cy", CY); d.setAttribute("r", 3); gB.appendChild(d);
    const t = document.createElementNS(NS, "text"); t.setAttribute("class", "name"); t.setAttribute("x", cx); t.setAttribute("y", 452); t.setAttribute("text-anchor", "middle"); t.textContent = n; gN.appendChild(t);
    const v = document.createElementNS(NS, "text"); v.id = "v" + i; v.setAttribute("class", "val"); v.setAttribute("x", cx); v.setAttribute("y", 484); v.setAttribute("text-anchor", "middle"); v.textContent = "0"; gN.appendChild(v); vals.push(v);
    // Radius is the square root of the normalised value; it grows from the centre in 750 ms, then moves to the second set.
    tl.fromTo(c, { attr: { r: 0 } }, { attr: { r: rOf(V1[i]) } }, T1 + i * 0.06);
    tl.fromTo(c, { attr: { r: rOf(V1[i]) } }, { attr: { r: rOf(V2[i]) }, immediateRender: false }, T2 + i * 0.06);
  });
  tl.fromTo("#w1", { attr: { opacity: 1 } }, { attr: { opacity: 0 }, duration: 0.3, ease: "none" }, T2);
  tl.fromTo("#w2", { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.3, ease: "none" }, T2);
  // The value labels follow the same easing as the circles (pure function of time).
  const out = k => 1 - Math.pow(1 - Math.max(0, Math.min(1, k)), 2);
  function renderAt(t) {
    NAMES.forEach((n, i) => {
      const k1 = out((t - T1 - i * 0.06) / DUR), k2 = out((t - T2 - i * 0.06) / DUR);
      const v = V1[i] * k1 + (V2[i] - V1[i]) * k2;
      vals[i].textContent = Math.round(v).toLocaleString("en-US");
    });
  }
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
