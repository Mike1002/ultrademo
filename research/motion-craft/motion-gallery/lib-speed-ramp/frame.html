<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-speed-ramp</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .card { position: absolute; left: 264px; top: 70px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; will-change: transform; }
  #ripple { position: absolute; left: 360px; top: 280px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid #1d1c1a; will-change: transform, opacity; }
  .cur { position: absolute; left: 0; top: 0; width: 28px; height: 38px; will-change: transform; }
  .cur svg { width: 28px; height: 38px; display: block; }
  #readout { position: absolute; left: 968px; top: 70px; width: 140px; height: 56px; border-radius: 28px; background: #1d1c1a; color: #f2c200;
    font-size: 26px; font-weight: 700; line-height: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  #graph { position: absolute; left: 0; top: 470px; width: 1168px; height: 100px; }
  #graph .gl { position: absolute; left: 60px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #graph svg { position: absolute; left: 0; top: 0; width: 1168px; height: 100px; }
  #head { position: absolute; left: 160px; top: 10px; width: 3px; height: 80px; background: #f2c200; border-left: 1px solid #1d1c1a; border-right: 1px solid #1d1c1a; will-change: transform; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="card">
        <div class="lab">Orbit</div>
        <h1>Invite your team</h1>
        <div class="sub">3 seats left on this plan</div>
        <div class="btn" id="btn">Continue</div>
      </div>
      <div id="ripple" data-layout-allow-overlap></div>
      <div id="ghosts"></div>
      <div class="cur" id="cursor" data-layout-allow-overlap>
        <svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div id="readout">1.0x</div>
      <div id="graph">
        <div class="gl" style="top:2px">4x</div>
        <div class="gl" style="top:78px">0.25x</div>
        <svg viewBox="0 0 1168 100" id="gsvg"></svg>
        <div id="head" data-layout-allow-overlap></div>
      </div>
    </div>
    <div id="label"><span class="l-name">Speed ramp</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const CUR = '<svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg>';
  const NG = 6, gh = document.getElementById("ghosts");
  let h = "";
  for (let k = 1; k <= NG; k++) h += '<div class="cur" id="g' + k + '" data-layout-allow-overlap style="opacity:' + (0.4 - k * 0.055).toFixed(2) + '">' + CUR + '</div>';
  gh.innerHTML = h;
  // Speed curve over the 2 s ramp window (u = t - T0): 4x down to 0.25x in 0.3 s, hold 0.8 s, back up to 4x in 0.3 s, then 4x.
  const T0 = 0.6;
  function v(u) { return u < 0 ? 1 : u < 0.3 ? 4 + (0.25 - 4) * u / 0.3 : u < 1.1 ? 0.25 : u < 1.4 ? 0.25 + (4 - 0.25) * (u - 1.1) / 0.3 : u < 2 ? 4 : 1; }
  // Source time is the closed-form integral of the speed curve, so every seek lands on the same frame.
  function sourceTime(u) {
    if (u <= 0) return 0;
    if (u < 0.3) return 4 * u - 6.25 * u * u;
    if (u < 1.1) return 0.6375 + 0.25 * (u - 0.3);
    if (u < 1.4) { const w = u - 1.1; return 0.8375 + 0.25 * w + 6.25 * w * w; }
    if (u < 2) return 1.475 + 4 * (u - 1.4);
    return 3.875;
  }
  // The source action in source seconds: approach the button (0 to 0.64), click and ripple (0.64 to 0.84), drift away (0.84 to 3.875).
  const P0 = [40, 560], PC = [418, 350], P1 = [1130, 60];
  function pos(s) {
    if (s <= 0.64) { const k = s / 0.64; return [P0[0] + (PC[0] - P0[0]) * k, P0[1] + (PC[1] - P0[1]) * k - Math.sin(Math.PI * k) * 60]; }
    if (s <= 0.84) return PC;
    const k = Math.min(1, (s - 0.84) / (3.875 - 0.84)); return [PC[0] + (P1[0] - PC[0]) * k, PC[1] + (P1[1] - PC[1]) * k + Math.sin(Math.PI * k) * 40];
  }
  const cursor = document.getElementById("cursor"), ghosts = [];
  for (let k = 1; k <= NG; k++) ghosts.push(document.getElementById("g" + k));
  const btn = document.getElementById("btn"), ripple = document.getElementById("ripple"), readout = document.getElementById("readout");
  function renderAt(t) {
    const u = t - T0, s = sourceTime(u), p = pos(s);
    gsap.set(cursor, { x: p[0], y: p[1], scale: 1.7, transformOrigin: "0 0" });
    ghosts.forEach((g, i) => { const q = pos(Math.max(0, s - (i + 1) * 0.05)); gsap.set(g, { x: q[0], y: q[1], scale: 1.7, transformOrigin: "0 0" }); });
    const press = s > 0.64 && s < 0.72 ? 0.93 : 1;
    gsap.set(btn, { scale: press, transformOrigin: "50% 50%" });
    const rk = s <= 0.66 ? 0 : Math.min(1, (s - 0.66) / 0.18);
    gsap.set(ripple, { scale: 0.2 + rk * 1.2, opacity: rk > 0 && rk < 1 ? 1 - rk : 0, transformOrigin: "50% 50%" });
    const sp = v(u);
    readout.textContent = (sp >= 1 ? sp.toFixed(1) : sp.toFixed(2)) + "x";
  }
  // The speed graph: the curve drawn once, a playhead that runs linearly across the ramp window.
  let d = "";
  for (let i = 0; i < 200; i++) { const u = i / 100, x = 160 + u * 474, y = 90 - (v(u) - 0.25) / 3.75 * 80; d += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }
  document.getElementById("gsvg").innerHTML = '<path d="M160 90 L1108 90" stroke="#e3ded2" stroke-width="2" fill="none"/><path d="M160 10 L1108 10" stroke="#e3ded2" stroke-width="2" fill="none"/><path d="' + d + '" stroke="#1d1c1a" stroke-width="3" fill="none" stroke-linejoin="round"/>';
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  tl.fromTo("#head", { x: 0 }, { x: 948, duration: 2, ease: "none" }, T0);
  // Tail: once the ramp is over the ghost trail fades out and the readout dims.
  tl.fromTo("#ghosts", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, T0 + 2.05);
  tl.fromTo("#readout", { opacity: 1 }, { opacity: 0.4, duration: 0.3, ease: "power2.out" }, T0 + 2.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
