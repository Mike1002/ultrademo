<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-mask-reveal</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px;  }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .kicker { position: absolute; left: 120px; top: 90px; }
  .title { position: absolute; left: 120px; top: 130px; width: 980px; }
  .window { position: relative; height: 100px; overflow: hidden; }
  .window + .window { margin-top: 12px; }
  .line { display: block; line-height: 100px; white-space: nowrap; font-size: 84px; font-weight: 700; will-change: transform; }
  .line.dim { color: #6d6a63; }
  .edge { position: absolute; left: 120px; width: 980px; height: 1px; background: #e3ded2; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <span class="lab kicker">Each line has its own window</span>
      <div class="title">
        <div class="window"><span class="line" id="l1">Ship it.</span></div>
        <div class="window"><span class="line" id="l2">Show it.</span></div>
        <div class="window"><span class="line dim" id="l3">Every frame is code.</span></div>
      </div>
      <div class="edge" style="top: 230px"></div>
      <div class="edge" style="top: 342px"></div>
      <div class="edge" style="top: 454px"></div>
    </div>
    <div id="label"><span class="l-name">Mask reveal</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // In: yPercent 110 -> 0 over 1.05 s, lines 0.35 s apart, from 0.3 s.
  tl.fromTo(".line", { yPercent: 110 }, { yPercent: 0, duration: 1.05, stagger: 0.35, ease: "power3.out" }, 0.3);
  // Out through the top of the same windows.
  tl.to(".line", { yPercent: -110, duration: 0.4, stagger: 0.1, ease: "power3.in" }, 2.4);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
