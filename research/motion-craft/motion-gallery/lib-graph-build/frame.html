<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-graph-build</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .lab { position: absolute; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #diagram { position: absolute; left: 40px; top: 120px; width: 1088px; height: 380px; overflow: visible; }
  #diagram text { fill: #1d1c1a; font-size: 22px; text-anchor: middle; }
  #diagram text.num { font-size: 26px; font-weight: 700; }
  .edge { fill: none; stroke: #a19d93; stroke-width: 2; }
  .node circle { fill: #fffdf8; stroke: #1d1c1a; stroke-width: 2; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="lab" style="left:48px;top:50px">Nodes first, then the edges, then one path</div>
      <svg id="diagram" viewBox="0 0 1088 380" data-layout-allow-overlap>
        <g><path class="edge" id="e0" d="M110 190L370 90"/><path class="edge" id="e1" d="M110 190L370 290"/><path class="edge" id="e2" d="M370 90L680 190"/><path class="edge" id="e3" d="M370 290L680 190"/><path class="edge" id="e4" d="M680 190L990 190"/></g>
        <g class="node" id="n0"><circle cx="110" cy="190" r="38"/><text class="num" x="110" y="199">1</text><text x="110" y="265">Invite</text></g>
        <g class="node" id="n1"><circle cx="370" cy="90" r="38"/><text class="num" x="370" y="99">2</text><text x="370" y="165">Jamie Dalton</text></g>
        <g class="node" id="n2"><circle cx="370" cy="290" r="38"/><text class="num" x="370" y="299">3</text><text x="370" y="365">Sam Kim</text></g>
        <g class="node" id="n3"><circle cx="680" cy="190" r="38"/><text class="num" x="680" y="199">4</text><text x="680" y="265">Review</text></g>
        <g class="node" id="n4"><circle cx="990" cy="190" r="38"/><text class="num" id="n4num" x="990" y="199">5</text><text x="990" y="265">Live</text></g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Node-link build</span><span class="l-sep">·</span><span>Explainer</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Nodes pop in one by one (compressed from 250 ms to 180 ms apart for the 3 s clip).
  ["#n0", "#n1", "#n2", "#n3", "#n4"].forEach((s, i) => {
    tl.fromTo(s, { opacity: 0, scale: 0.8, transformOrigin: "center center" }, { opacity: 1, scale: 1, duration: 0.3 }, 0.15 + i * 0.18);
  });
  // Edges draw after their nodes; dash boundary parked mid-gap so frame 0 shows no cap dot.
  ["#e0", "#e1", "#e2", "#e3", "#e4"].forEach((s, i) => {
    const L = document.querySelector(s).getTotalLength();
    tl.fromTo(s, { strokeDasharray: `${L} ${L + 20}`, strokeDashoffset: L + 10 }, { strokeDashoffset: 0, duration: 0.45, ease: "none" }, 0.5 + i * 0.2);
  });
  // One path through the network thickens to ink, and the end node turns yellow.
  ["#e0", "#e2", "#e4"].forEach((s, i) => tl.to(s, { stroke: "#1d1c1a", strokeWidth: 4, duration: 0.3 }, 1.9 + i * 0.25));
  tl.to("#n4 circle", { fill: "#f2c200", stroke: "#1d1c1a", duration: 0.3 }, 2.55);
  tl.fromTo("#n4", { scale: 1, transformOrigin: "center center" }, { scale: 1.1, duration: 0.3, ease: "back.out(2)" }, 2.55);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
