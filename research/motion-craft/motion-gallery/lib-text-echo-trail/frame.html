<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-text-echo-trail</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #cv { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage"><canvas id="cv" width="1168" height="580"></canvas></div>
    <div id="label"><span class="l-name">Text echo trail</span><span class="l-sep">·</span><span>Texture &amp; Style</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const W = 1168, H = 580, INK = "#1d1c1a", ACC = "#f2c200", MUTED = "#6d6a63";
  const SANS = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  const clamp = x => Math.max(0, Math.min(1, x));
  const out = x => 1 - Math.pow(1 - clamp(x), 3);
  const mix = (a, b, p) => a + (b - a) * p;
  function title(s, x, y, size) { ctx.fillStyle = INK; ctx.font = "700 " + size + "px " + SANS; ctx.textAlign = "center"; ctx.fillText(s, x, y); ctx.textAlign = "left"; }
  function circle(x, y, r, color, alpha) { ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  // Six copies, each 0.045 s behind the one ahead, opacity falling with index; they fade out once the phrase settles.
  function trail(s, y, size, t0, from, to, dur, fade0) {
    const pos = t => mix(from, to, out((t - t0) / dur));
    for (let i = 6; i >= 1; i--) { ctx.globalAlpha = (0.48 - i * 0.055) * (1 - out((t_ - fade0) / 0.5)); title(s, pos(t_ - i * 0.045), y, size); }
    ctx.globalAlpha = 1; title(s, pos(t_), y, size);
  }
  let t_ = 0;
  function renderAt(t) {
    t_ = t;
    ctx.clearRect(0, 0, W, H); ctx.globalAlpha = 1;
    ctx.fillStyle = INK; ctx.font = "24px " + SANS; ctx.textAlign = "left"; ctx.fillText("What the move leaves behind", 104, 95);
    ctx.fillStyle = MUTED; ctx.font = "18px " + SANS; ctx.fillText("The echoes gather into one", 104, 514);
    // Main phrase: 0.2 -> 1.1 s from the left, echoes gone by 1.6 s.
    trail("Launch day.", 300, 108, 0.2, 180, 584, 0.9, 1.1);
    circle(900, 180, 39 * out((t - 1.3) / 0.5), ACC, 1);
    if (t > 1.3) { ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.beginPath(); ctx.arc(900, 180, 39 * out((t - 1.3) / 0.5), 0, Math.PI * 2); ctx.stroke(); }
    // Second beat: a sub-line crosses from the right with the same trail.
    if (t > 1.9) trail("Your product, in motion.", 400, 44, 1.9, 1000, 584, 0.8, 2.7);
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
