<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-glitch-transition</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #171a21; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #171a21; color: #ece8df;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .panel { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .art { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .art.a { background: #1f232c; }
  .art.b { background: #171a21; }
  .card { position: absolute; left: 204px; top: 100px; width: 760px; height: 380px; background: #1f232c;
    border: 2px solid #ece8df; border-radius: 24px; }
  .card .eyebrow { position: absolute; left: 56px; top: 44px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #a7adbb; }
  .card .h1 { position: absolute; left: 56px; top: 84px; font-size: 56px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 164px; font-size: 22px; color: #a7adbb; }
  .card .btn { position: absolute; left: 56px; top: 254px; width: 200px; height: 60px; background: #f2c200; border: 2px solid #ece8df;
    border-radius: 14px; font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; color: #1d1c1a; }
  .card .av { position: absolute; top: 44px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #ece8df; background: #1f232c;
    font-size: 20px; font-weight: 700; line-height: 60px; text-align: center; }
  .card .av.v1 { left: 540px; } .card .av.v2 { left: 592px; } .card .av.v3 { left: 644px; }
  .art.b .num { position: absolute; left: 92px; top: 86px; font-size: 136px; font-weight: 700; line-height: 1; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .art.b .cap { position: absolute; left: 100px; top: 236px; font-size: 22px; color: #a7adbb; }
  .art.b .row { position: absolute; left: 96px; width: 520px; height: 60px; border-top: 2px solid #2a2f3a; font-size: 22px; line-height: 58px;
    padding-left: 30px; will-change: transform; }
  .art.b .row .dot { position: absolute; left: 0; top: 24px; width: 12px; height: 12px; border-radius: 50%; background: #f2c200; }
  .art.b .row.r1 { top: 320px; } .art.b .row.r2 { top: 384px; } .art.b .row.r3 { top: 448px; }
  .art.b .disc { will-change: transform; position: absolute; left: 780px; top: 150px; width: 280px; height: 280px; border-radius: 50%; background: #f2c200;
    border: 2px solid #ece8df; text-align: center; color: #1d1c1a; }
  .art.b .disc .pct { position: absolute; left: 0; width: 276px; top: 86px; font-size: 72px; font-weight: 700; line-height: 1; }
  .art.b .disc .pl { position: absolute; left: 0; width: 276px; top: 166px; font-size: 18px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #a7adbb; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #ece8df; font-weight: 700; }
  #label .l-sep { color: #6d7380; }

  #B { opacity: 0; }
  #frag { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; opacity: 0; }
  .slice { will-change: transform; }
  .ghost { opacity: 0.35; will-change: transform; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="panel" id="A"><div class="art a" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class="card"><div class="eyebrow" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div><div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div><div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left</div><div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div><div class="av v1" data-layout-allow-overlap data-layout-allow-occlusion>JD</div><div class="av v2" data-layout-allow-overlap data-layout-allow-occlusion>SK</div><div class="av v3" data-layout-allow-overlap data-layout-allow-occlusion>ML</div></div></div></div>
      <div class="panel" id="B" data-layout-allow-overlap><div class="art b" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div><div class="cap" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div><div class="row r1" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Jamie Dalton</div><div class="row r2" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Sam Kim</div><div class="row r3" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Morgan Lee</div><div class="disc" data-layout-allow-overlap data-layout-allow-occlusion><div class="pct" data-layout-allow-overlap data-layout-allow-occlusion>98%</div><div class="pl" data-layout-allow-overlap data-layout-allow-occlusion>accepted</div></div></div></div>
      <div id="frag" data-layout-allow-overlap></div>
    </div>
    <div id="label"><span class="l-name">Glitch transition</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  const A_HTML = "<div class=\"art a\" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class=\"card\"><div class=\"eyebrow\" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div><div class=\"h1\" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div><div class=\"sub\" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left</div><div class=\"btn\" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div><div class=\"av v1\" data-layout-allow-overlap data-layout-allow-occlusion>JD</div><div class=\"av v2\" data-layout-allow-overlap data-layout-allow-occlusion>SK</div><div class=\"av v3\" data-layout-allow-overlap data-layout-allow-occlusion>ML</div></div></div>";
  const frag = document.getElementById("frag");
  const CUTS = [[0, 75], [25, 50], [50, 25], [75, 0]];
  let html = "";
  CUTS.forEach((c, i) => { html += '<div class="panel ghost" id="g' + i + '" data-layout-allow-overlap style="clip-path:inset(' + c[0] + '% 0 ' + c[1] + '% 0)">' + A_HTML + '</div>'; });
  CUTS.forEach((c, i) => { html += '<div class="panel slice" id="s' + i + '" data-layout-allow-overlap style="clip-path:inset(' + c[0] + '% 0 ' + c[1] + '% 0)">' + A_HTML + '</div>'; });
  frag.innerHTML = html;
  const slices = [0, 1, 2, 3].map(i => document.getElementById("s" + i));
  const ghosts = [0, 1, 2, 3].map(i => document.getElementById("g" + i));

  // Seeded (mulberry32, seed 163) jolt table baked once: 12 main steps plus a 3-step after-shock.
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const seeded = rand(163);
  function table(n, amp) {
    const out = [];
    for (let f = 0; f < n; f++) {
      const strength = (0.65 + 0.35 * Math.sin(Math.PI * f / (n - 1))) * amp;
      out.push(slices.map((_, i) => ({
        x: Math.round((i % 2 ? 1 : -1) * (130 + seeded() * 150) * strength * 0.55),
        y: Math.round((seeded() - 0.5) * 54 * strength),
        sk: (i % 2 ? 1 : -1) * (8 + seeded() * 6) * strength
      })));
    }
    return out;
  }
  const MAIN = table(12, 1), AFTER = table(3, 0.45);
  const G0 = 0.55, STEP = 0.075, G1 = G0 + 12 * STEP;   // 0.55 .. 1.45
  const H0 = 2.25, H1 = H0 + 3 * STEP;                   // after-shock 2.25 .. 2.475

  function apply(row, on) {
    slices.forEach((el, i) => { const j = row ? row[i] : { x: 0, y: 0, sk: 0 }; gsap.set(el, { x: j.x, y: j.y, skewX: j.sk }); });
    ghosts.forEach((el, i) => { const j = row ? row[i] : { x: 0, y: 0, sk: 0 }; gsap.set(el, { x: -j.x * 0.4 + (i % 2 ? 18 : -18) * (on ? 1 : 0), y: j.y * 0.5, skewX: -j.sk * 0.5 }); });
    gsap.set(frag, { opacity: on ? 1 : 0 });
  }
  function renderAt(t) {
    if (t >= G0 && t < G1) apply(MAIN[Math.min(11, Math.floor((t - G0) / STEP))], true);
    else if (t >= H0 && t < H1) apply(AFTER[Math.min(2, Math.floor((t - H0) / STEP))], true);
    else apply(null, false);
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  // The scene underneath swaps at the peak of the glitch.
  tl.fromTo("#A", { opacity: 1 }, { opacity: 0, duration: 0.034, ease: "none" }, 1.0);
  tl.fromTo("#B", { opacity: 0 }, { opacity: 1, duration: 0.034, ease: "none" }, 1.0);
  const ROWS_AT = 1.5;
  // Second beat: the three rows of the new scene settle in so the clip keeps moving.
  tl.fromTo(".art.b .row.r1", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT);
  tl.fromTo(".art.b .row.r2", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT + 0.1);
  tl.fromTo(".art.b .row.r3", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT + 0.2);
  tl.fromTo(".art.b .disc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, ROWS_AT + 0.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
