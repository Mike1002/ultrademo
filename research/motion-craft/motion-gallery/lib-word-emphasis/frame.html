<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-word-emphasis</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px;  }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .kicker { position: absolute; left: 60px; top: 150px; }
  .text { position: absolute; left: 60px; top: 200px; white-space: pre; letter-spacing: -.01em; line-height: 1.3; font-size: 84px; font-weight: 700; }
  .text span { display: inline-block; }
  #focus { transform-origin: 50% 65%; will-change: transform; }
  .baseline { position: absolute; left: 60px; right: 60px; top: 330px; height: 1px; background: #e3ded2; }
  .caption { position: absolute; left: 60px; top: 370px; font-size: 18px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <span class="lab kicker">One phrase inside a sentence</span>
      <div class="text"><span class="rest" id="r1" data-layout-allow-overlap>Every frame </span><span id="focus" data-layout-allow-overlap>is code</span><span class="rest" id="r2" data-layout-allow-overlap>.</span></div>
      <div class="baseline"></div>
      <div class="caption">Colour and a little scale say what to read; the line never shifts.</div>
    </div>
    <div id="label"><span class="l-name">Word emphasis</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>calm</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  tl.fromTo("#focus", { color: "#1d1c1a", scale: 1 }, { color: "#f2c200", scale: 1.06, duration: 0.65, ease: "power2.inOut" }, 0.65);
  tl.fromTo(".rest", { opacity: 1 }, { opacity: 0.32, duration: 0.65, ease: "power2.inOut" }, 0.65);
  // Release: the emphasis hands the sentence back.
  tl.to("#focus", { color: "#1d1c1a", scale: 1, duration: 0.5, ease: "power2.inOut" }, 2.3);
  tl.to(".rest", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 2.3);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
