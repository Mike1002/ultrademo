<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-particle-network</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #171a21; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #171a21; color: #ece8df;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #cv { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #a7adbb; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #ece8df; font-weight: 700; }
  #label .l-sep { color: #6d7380; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage"><canvas id="cv" width="1168" height="580"></canvas></div>
    <div id="label"><span class="l-name">Connected particle network</span><span class="l-sep">·</span><span>Generative</span><span class="l-sep">·</span><span>calm</span></div>
  </section>
</div>
<script>
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const W = 1168, H = 580, INK = "#ece8df", ACC = "#f2c200", MUTED = "#a7adbb";
  const SANS = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  const rng = rand(303);
  function circle(x, y, r, color, alpha) { ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  // 84 seeded nodes; each position is a pure function of t (a slow seeded sway), so there is no frame-to-frame state.
  const nodes = Array.from({ length: 84 }, () => ({ x: 130 + rng() * 905, y: 170 + rng() * 295, phase: rng() * 6.28, v: 18 + rng() * 15 }));
  function renderAt(t) {
    ctx.clearRect(0, 0, W, H); ctx.globalAlpha = 1;
    ctx.fillStyle = INK; ctx.font = "24px " + SANS; ctx.textAlign = "left"; ctx.fillText("Relations that form when things get close", 104, 95);
    ctx.fillStyle = MUTED; ctx.font = "18px " + SANS; ctx.fillText("A network made of distance", 104, 540);
    // The source's 5 s sway is played at 1.6x so links form and break visibly within 3 s.
    const s = t * 1.6;
    const pts = nodes.map(n => ({ x: n.x + Math.sin(s * 0.55 + n.phase) * n.v, y: n.y + Math.cos(s * 0.65 + n.phase) * n.v }));
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) { ctx.strokeStyle = i === 0 ? ACC : INK; ctx.globalAlpha = (1 - d / 130) * 0.5; ctx.lineWidth = i === 0 ? 1.8 : 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    pts.forEach((p, i) => circle(p.x, p.y, i === 0 ? 10 : 3.5, i === 0 ? ACC : INK, 1));
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
