<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>3d-page-scroll</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  /* tilted card: 640x540 at (320,90). The tilt is CSS-only and static; GSAP never touches this element.
     tiltY negative (left-leaning) => shadow X offset positive. */
  .tilt-card { position: absolute; left: 320px; top: 90px; width: 640px; height: 540px; border-radius: 24px;
    background: #fffdf8; border: 2px solid #1d1c1a; overflow: hidden; transform-style: preserve-3d;
    transform: perspective(1200px) rotateY(-9deg) rotateX(3deg);
    box-shadow: 40px 30px 80px rgba(29, 28, 26, 0.28); }
  .page-content { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
  .page-content section { padding: 40px 44px; border-bottom: 2px solid #e3ded2; }
  .page-hero { height: 300px; }
  .page-features { height: 360px; }
  .page-target { height: 300px; }
  .page-cta { height: 300px; border-bottom: none; }
  .h { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 22px; }
  .bar { height: 18px; border-radius: 9px; background: #e3ded2; margin-bottom: 14px; }
  .bar.w1 { width: 92%; } .bar.w2 { width: 70%; } .bar.w3 { width: 84%; } .bar.w4 { width: 48%; }
  .tiles { display: flex; gap: 20px; margin-top: 6px; }
  .tile { flex: 1; height: 160px; border-radius: 16px; background: #f6f3ec; border: 2px solid #e3ded2; padding: 18px; }
  .tile .dot { width: 36px; height: 36px; border-radius: 50%; background: #e3ded2; margin-bottom: 18px; }
  .tile .bar { height: 12px; margin-bottom: 10px; }
  .btn { width: 200px; height: 60px; border-radius: 14px; background: #f2c200; color: #1d1c1a; font-size: 22px; font-weight: 700;
    display: grid; place-items: center; margin-top: 10px; }
  .spotlight { position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse 70% 32% at 50% 50%, rgba(29, 28, 26, 0) 50%, rgba(29, 28, 26, 0.55) 100%); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="tilt-card" id="tilt-card">
      <div class="page-content" id="page-content" data-layout-allow-overflow>
        <section class="page-hero"><div class="h">Every frame is code</div><div class="bar w1"></div><div class="bar w2"></div><div class="bar w3"></div></section>
        <section class="page-features" id="features-section"><div class="h">What you get</div><div class="tiles"><div class="tile"><div class="dot"></div><div class="bar w1"></div><div class="bar w4"></div></div><div class="tile"><div class="dot"></div><div class="bar w1"></div><div class="bar w4"></div></div><div class="tile"><div class="dot"></div><div class="bar w1"></div><div class="bar w4"></div></div></div></section>
        <section class="page-target" id="target-section"><div class="h">Invite your team</div><div class="bar w3"></div><div class="bar w4"></div><div class="btn">Continue</div></section>
        <section class="page-cta"><div class="h">Ship it today</div><div class="bar w2"></div><div class="bar w1"></div><div class="bar w4"></div></section>
      </div>
      <div class="spotlight" id="spotlight"></div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const CARD_H = 540, SCROLL_DUR = 0.9;
  // scroll distances measured from the real layout: section vertical centre minus half the card height
  const centreOf = (id) => { const s = document.getElementById(id); return s.offsetTop + s.offsetHeight / 2; };
  const DIST_A = Math.round(centreOf("features-section") - CARD_H / 2);
  const DIST_B = Math.round(centreOf("target-section") - CARD_H / 2);
  const SCROLL_AT_A = 0.2, SCROLL_AT_B = 1.4;                       // non-overlapping windows, one ease for both
  const SPOTLIGHT_AT = SCROLL_AT_B + SCROLL_DUR - 0.2, SPOTLIGHT_FADE_DUR = 0.5;
  tl.fromTo("#page-content", { y: 0 }, { y: -DIST_A, duration: SCROLL_DUR, ease: "power3.out" }, SCROLL_AT_A);
  tl.fromTo("#page-content", { y: -DIST_A }, { y: -DIST_B, duration: SCROLL_DUR, ease: "power3.out", immediateRender: false }, SCROLL_AT_B);
  tl.fromTo("#spotlight", { opacity: 0 }, { opacity: 1, duration: SPOTLIGHT_FADE_DUR, ease: "power1.inOut" }, SPOTLIGHT_AT);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
