<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-time-compression</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #card { position: absolute; left: 204px; top: 100px; width: 760px; height: 380px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  #card .lab { position: absolute; left: 56px; top: 44px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #card h1 { position: absolute; left: 56px; top: 76px; font-size: 40px; font-weight: 700; line-height: 48px; white-space: nowrap; }
  #clock { position: absolute; left: 56px; top: 150px; font-size: 64px; font-weight: 700; line-height: 72px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
  #count { position: absolute; left: 56px; top: 228px; font-size: 20px; color: #6d6a63; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #track { position: absolute; left: 56px; top: 290px; width: 648px; height: 22px; border-radius: 11px; border: 2px solid #1d1c1a; background: #ece7da; overflow: hidden; }
  #fill { position: absolute; left: 0; top: 0; width: 644px; height: 18px; background: #1d1c1a; transform-origin: 0 50%; will-change: transform; }
  #dots { position: absolute; left: 56px; top: 322px; width: 648px; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: .3em; color: #6d6a63; line-height: 30px; }
  #badge { position: absolute; left: 592px; top: 40px; width: 112px; height: 56px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 28px; font-weight: 700; line-height: 52px; text-align: center; will-change: transform, opacity; }
  #done { position: absolute; left: 500px; top: 150px; width: 204px; height: 72px; border-radius: 36px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 28px; font-weight: 700; line-height: 68px; text-align: center; will-change: transform, opacity; }
  #done svg { position: absolute; left: 20px; top: 20px; width: 28px; height: 28px; }
  #done span { position: absolute; left: 58px; top: 0; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="card">
        <div class="lab">Orbit</div>
        <h1>Uploading 12,480 invites</h1>
        <div id="clock">0:00</div>
        <div id="count">0 of 12,480 sent</div>
        <div id="track"><div id="fill"></div></div>
        <div id="dots" data-layout-allow-overlap>· · ·</div>
        <div id="badge" data-layout-allow-overlap>×8</div>
        <div id="done" data-layout-allow-overlap><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 15l6 6 12-13" fill="none" stroke="#1d1c1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Done</span></div>
      </div>
    </div>
    <div id="label"><span class="l-name">Time compression</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // Real time runs 0 to 0.7 s at 1x (bar 0 to 8%, clock 0:00 to 0:04); from 0.7 to 1.9 s the same bar runs at 8x
  // (8% to 100%, clock 0:04 to 2:52) under the ×8 badge and the ellipsis marker; at 1.9 s the result lands.
  const T1 = 0.7, T2 = 1.9, TOTAL_S = 172, TOTAL_N = 12480;
  const clock = document.getElementById("clock"), count = document.getElementById("count");
  function progress(t) {
    if (t <= T1) return 0.08 * (t / T1);
    if (t >= T2) return 1;
    return 0.08 + 0.92 * ((t - T1) / (T2 - T1));
  }
  function renderAt(t) {
    const p = Math.max(0, Math.min(1, progress(t)));
    const s = Math.round(p * TOTAL_S), m = Math.floor(s / 60), ss = s % 60;
    clock.textContent = m + ":" + (ss < 10 ? "0" : "") + ss;
    const n = Math.round(p * TOTAL_N);
    count.textContent = n.toLocaleString("en-US") + " of 12,480 sent";
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  // The bar at 1x, then at 8x (both linear, so the jump in speed is the whole effect).
  tl.fromTo("#fill", { scaleX: 0 }, { scaleX: 0.08, duration: T1, ease: "none" }, 0);
  tl.fromTo("#fill", { scaleX: 0.08 }, { scaleX: 1, duration: T2 - T1, ease: "none", immediateRender: false }, T1);
  // Speed marker: in over 150 ms, held through the compressed stretch, out over 150 ms.
  tl.fromTo("#badge", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power2.out" }, T1);
  tl.to("#badge", { opacity: 0, duration: 0.15, ease: "none" }, T2);
  tl.fromTo("#dots", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, T1);
  tl.fromTo("#dots", { x: -8 }, { x: 8, duration: 0.2, ease: "none", repeat: 5, yoyo: true }, T1);
  tl.to("#dots", { opacity: 0, duration: 0.15, ease: "none" }, T2);
  // The result lands and holds, with a quiet pulse so the second half keeps moving.
  tl.fromTo("#done", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, T2);
  tl.fromTo("#fill", { backgroundColor: "#1d1c1a" }, { backgroundColor: "#f2c200", duration: 0.3, ease: "none", immediateRender: false }, T2);
  tl.fromTo("#done", { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.5);
  tl.fromTo("#clock", { scale: 1 }, { scale: 1.04, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.35);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
