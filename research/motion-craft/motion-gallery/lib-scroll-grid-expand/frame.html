<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-scroll-grid-expand</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #grid { position: absolute; left: 144px; top: 40px; width: 880px; height: 300px; will-change: transform; }
  .col { position: absolute; top: 0; width: 280px; height: 300px; will-change: transform, opacity; }
  .fr { position: absolute; left: 0; width: 280px; height: 140px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 16px; overflow: hidden; will-change: opacity; }
  .fr .bar { position: absolute; left: 0; top: 0; width: 276px; height: 26px; border-bottom: 2px solid #e3ded2; }
  .fr .dot { position: absolute; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: #e3ded2; }
  .fr .ttl { position: absolute; left: 18px; top: 40px; font-size: 18px; font-weight: 700; }
  .fr .ln { position: absolute; left: 18px; height: 8px; border-radius: 4px; background: #e3ded2; }
  .fr .btn { position: absolute; left: 18px; top: 100px; width: 72px; height: 24px; border-radius: 6px; background: #ece7da; border: 2px solid #1d1c1a; }
  .fr.key .btn { background: #f2c200; }
  #cap { position: absolute; left: 0; top: 430px; width: 1168px; text-align: center; font-size: 40px; font-weight: 700; letter-spacing: -0.01em; will-change: transform, opacity; }
  #sub { position: absolute; left: 0; top: 488px; width: 1168px; text-align: center; font-size: 20px; color: #6d6a63; will-change: transform, opacity; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="grid">
        <div class="col" id="c0" style="left:0">
          <div class="fr" style="top:0"><div class="bar"><div class="dot" style="left:10px"></div><div class="dot" style="left:24px"></div><div class="dot" style="left:38px"></div></div><div class="ttl">Capture</div><div class="ln" style="top:70px;width:180px"></div><div class="ln" style="top:84px;width:120px"></div><div class="btn"></div></div>
          <div class="fr" style="top:160px"><div class="bar"><div class="dot" style="left:10px"></div><div class="dot" style="left:24px"></div><div class="dot" style="left:38px"></div></div><div class="ttl">Review</div><div class="ln" style="top:70px;width:150px"></div><div class="ln" style="top:84px;width:200px"></div><div class="btn"></div></div>
        </div>
        <div class="col" id="c1" style="left:300px">
          <div class="fr key" id="key" style="top:0"><div class="bar"><div class="dot" style="left:10px"></div><div class="dot" style="left:24px"></div><div class="dot" style="left:38px"></div></div><div class="ttl">Record</div><div class="ln" style="top:70px;width:200px"></div><div class="ln" style="top:84px;width:140px"></div><div class="btn"></div></div>
          <div class="fr" style="top:160px"><div class="bar"><div class="dot" style="left:10px"></div><div class="dot" style="left:24px"></div><div class="dot" style="left:38px"></div></div><div class="ttl">Edit</div><div class="ln" style="top:70px;width:170px"></div><div class="ln" style="top:84px;width:110px"></div><div class="btn"></div></div>
        </div>
        <div class="col" id="c2" style="left:600px">
          <div class="fr" style="top:0"><div class="bar"><div class="dot" style="left:10px"></div><div class="dot" style="left:24px"></div><div class="dot" style="left:38px"></div></div><div class="ttl">Ship</div><div class="ln" style="top:70px;width:160px"></div><div class="ln" style="top:84px;width:190px"></div><div class="btn"></div></div>
          <div class="fr" style="top:160px"><div class="bar"><div class="dot" style="left:10px"></div><div class="dot" style="left:24px"></div><div class="dot" style="left:38px"></div></div><div class="ttl">Share</div><div class="ln" style="top:70px;width:140px"></div><div class="ln" style="top:84px;width:180px"></div><div class="btn"></div></div>
        </div>
      </div>
      <div id="cap">Record · Edit · Ship</div>
      <div id="sub">Six frames, one key scene</div>
    </div>
    <div id="label"><span class="l-name">Scroll grid expansion</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.6 } });
  // Params: columns enter over 0.6 s with an 80 ms stagger, the grid expands to 1.3 over 0.8 s, the caption reveals after; power2.out throughout.
  ["#c0", "#c1", "#c2"].forEach((sel, i) => {
    tl.fromTo(sel, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.15 + i * 0.08);
  });
  tl.fromTo("#grid", { scale: 1, transformOrigin: "50% 45%" }, { scale: 1.3, duration: 0.8, ease: "power2.out" }, 0.9);
  tl.fromTo("#cap", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 1.6);
  tl.fromTo("#sub", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 1.75);
  // Second beat: the collection recedes and the key frame stays, moving attention to one scene.
  tl.fromTo(".fr:not(.key)", { opacity: 1 }, { opacity: 0.35, duration: 0.5, ease: "power2.inOut" }, 2.3);
  tl.fromTo("#key", { scale: 1 }, { scale: 1.06, duration: 0.5, ease: "power2.out" }, 2.3);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
