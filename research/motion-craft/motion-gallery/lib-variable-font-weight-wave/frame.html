<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-variable-font-weight-wave</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #word { position: absolute; left: 0; top: 190px; width: 1168px; height: 150px; display: flex; justify-content: center; align-items: center;
    font-size: 108px; line-height: 150px; white-space: nowrap; }
  #word span { display: block; text-align: center; font-weight: 300; will-change: transform; }
  #hint { position: absolute; left: 0; top: 370px; width: 1168px; height: 24px; text-align: center;
    font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; line-height: 24px; white-space: nowrap; }
  #track { position: absolute; left: 284px; top: 420px; width: 600px; height: 2px; background: #e3ded2; }
  #crest { position: absolute; left: 272px; top: 409px; width: 24px; height: 24px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; will-change: transform; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="word"></div>
      <div id="hint">Weight 300 to 800 · slant 0 to -10 · crest six glyphs wide</div>
      <div id="track"></div><div id="crest" data-layout-allow-overlap></div>
    </div>
    <div id="label"><span class="l-name">Variable font weight wave</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // Per-glyph blocks with slot widths fixed at the heaviest weight so the line never reflows; a crest six glyphs wide
  // sweeps the line twice (one pass per 1.45 s), raising font-weight 300 -> 800 and skewing -10 deg on the glyphs it touches.
  const host = document.getElementById("word");
  const glyphs = [];
  for (const ch of "Every frame is code.") {
    const s = document.createElement("span");
    s.innerHTML = ch === " " ? "&nbsp;" : ch;
    host.appendChild(s); glyphs.push(s);
  }
  glyphs.forEach(s => { s.style.fontWeight = "800"; });
  glyphs.forEach(s => { s.style.width = Math.ceil(s.getBoundingClientRect().width) + "px"; s.style.fontWeight = "300"; });
  const N = glyphs.length, L = 6, PERIOD = 1.45;
  const clamp = v => Math.max(0, Math.min(1, v));
  function renderAt(t) {
    const u = (t - 0.05) / PERIOD;                      // two passes fit in 3 s
    const p = u < 0 ? 0 : (u >= 2 ? 1 : u % 1);
    const centre = p * (N + L) - L / 2;
    glyphs.forEach((s, i) => {
      const d = Math.abs(i - centre);
      const k0 = Math.max(0, 1 - d / (L / 2));
      const k = Math.min(1, k0 * 1.6);                      // broad flat crest with short shoulders
      s.style.fontWeight = String(Math.round(300 + 500 * k));
      gsap.set(s, { skewX: -10 * k, transformOrigin: "50% 100%" });
    });
    gsap.set("#crest", { x: 600 * clamp((centre + L / 2) / (N + L)) });
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "sine.inOut", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
