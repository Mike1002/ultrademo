<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-split-panel-handoff</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .half { position: absolute; left: 0; top: 220px; width: 1168px; height: 140px; text-align: center; font-size: 120px; font-weight: 700; line-height: 140px;
    letter-spacing: -.02em; white-space: nowrap; will-change: transform; }
  #top { clip-path: inset(0 0 50% 0); }
  #bot { clip-path: inset(50% 0 0 0); }
  #panel { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; background: #f2c200; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, opacity; }
  #panel .lab { position: absolute; left: 96px; top: 96px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #1d1c1a; opacity: .7; }
  #panel .num { position: absolute; left: 92px; top: 130px; font-size: 160px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #panel .cap { position: absolute; left: 100px; top: 304px; font-size: 26px; font-weight: 700; }
  #panel .row { position: absolute; left: 96px; width: 520px; height: 56px; border-top: 2px solid #1d1c1a; font-size: 22px; line-height: 54px; padding-left: 30px; will-change: transform, opacity; }
  #panel .row .dot { position: absolute; left: 0; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: #1d1c1a; }
  #panel .row.r1 { top: 370px; } #panel .row.r2 { top: 428px; } #panel .row.r3 { top: 486px; }
  #panel .disc { position: absolute; left: 790px; top: 150px; width: 280px; height: 280px; border-radius: 50%; background: #fffdf8; border: 2px solid #1d1c1a; text-align: center; will-change: transform, opacity; }
  #panel .disc .pct { position: absolute; left: 0; width: 276px; top: 86px; font-size: 72px; font-weight: 700; line-height: 1; }
  #panel .disc .pl { position: absolute; left: 0; width: 276px; top: 166px; font-size: 18px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="panel" data-layout-allow-overlap>
        <div class="lab">This month</div>
        <div class="num">12,480</div>
        <div class="cap">invites sent</div>
        <div class="row r1"><span class="dot"></span>Jamie Dalton</div>
        <div class="row r2"><span class="dot"></span>Sam Kim</div>
        <div class="row r3"><span class="dot"></span>Morgan Lee</div>
        <div class="disc"><div class="pct">98%</div><div class="pl">accepted</div></div>
      </div>
      <div class="half" id="top" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow>Launch day.</div>
      <div class="half" id="bot" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow>Launch day.</div>
    </div>
    <div id="label"><span class="l-name">Split panel handoff</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.inOut", duration: 0.6 } });
  const T0 = 0.45, SPLIT = 1.1, PANEL_AT = T0 + 0.4, GROW = 0.8;
  // The title is two clones clipped to its top and bottom halves; the halves move +-300 px apart over 1.1 s (power3.inOut).
  tl.fromTo("#top", { y: 0 }, { y: -300, duration: SPLIT, ease: "power3.inOut" }, T0);
  tl.fromTo("#bot", { y: 0 }, { y: 300, duration: SPLIT, ease: "power3.inOut" }, T0);
  // The panel grows from the opening (scale 0 about the centre) 0.4 s after the title starts to part, staying inside the opening until it takes the whole stage.
  tl.fromTo("#panel", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { opacity: 1, duration: 0.05, ease: "none" }, PANEL_AT);
  tl.to("#panel", { scale: 1, duration: GROW, ease: "power3.out" }, PANEL_AT);
  // The halves fade once they are off the panel so the handoff is complete.
  tl.to("#top, #bot", { opacity: 0, duration: 0.2, ease: "none" }, T0 + SPLIT - 0.1);
  const ROWS_AT = 1.85;
  // Second beat: the panel's rows and disc settle in.
  tl.fromTo("#panel .row.r1", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, ROWS_AT);
  tl.fromTo("#panel .row.r2", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, ROWS_AT + 0.1);
  tl.fromTo("#panel .row.r3", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, ROWS_AT + 0.2);
  tl.fromTo("#panel .disc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, ROWS_AT + 0.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
