<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-aggregate-split-merge</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #cap { position: absolute; left: 160px; top: 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .axis { stroke: #1d1c1a; stroke-width: 2; }
  .seg { stroke: #1d1c1a; stroke-width: 2; }
  .pale { fill: #ece7da; }
  .acc { fill: #f2c200; }
  .name { font-size: 22px; font-weight: 700; fill: #1d1c1a; }
  .val { font-size: 20px; fill: #6d6a63; font-variant-numeric: tabular-nums; }
  .total { font-size: 26px; font-weight: 700; fill: #1d1c1a; font-variant-numeric: tabular-nums; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="cap">Invites sent this quarter</div>
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <line class="axis" x1="160" y1="60" x2="160" y2="560"/>
        <g id="segs">
          <rect class="seg acc" id="s0" x="160" y="90" width="400" height="90" rx="6"/>
          <rect class="seg pale" id="s1" x="560" y="90" width="308" height="90" rx="6"/>
          <rect class="seg pale" id="s2" x="868" y="90" width="212" height="90" rx="6"/>
        </g>
        <text class="total" id="total" x="1080" y="222" text-anchor="end">12,480 invites</text>
        <g id="names">
          <text class="name" id="n0" x="580" y="326">Jamie Dalton</text>
          <text class="val" id="v0" x="580" y="354">5,420</text>
          <text class="name" id="n1" x="488" y="436">Sam Kim</text>
          <text class="val" id="v1" x="488" y="464">4,180</text>
          <text class="name" id="n2" x="392" y="546">Morgan Lee</text>
          <text class="val" id="v2" x="392" y="574">2,880</text>
        </g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Aggregate split and merge</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 1 } });
  // Merged state: three segments sit end to end inside one 920 px bar; their widths add up to the total (area preserved).
  const merged = [{ x: 160, y: 90 }, { x: 560, y: 90 }, { x: 868, y: 90 }];
  // Split state: each segment keeps its width and slides onto its own row, left-aligned on the axis.
  const split = [{ x: 160, y: 280 }, { x: 160, y: 390 }, { x: 160, y: 500 }];
  const S1 = 0.3, S2 = 1.9;
  // Split: the aggregate bar comes apart into three named bars; the total label gives way to the names.
  ["#s0", "#s1", "#s2"].forEach((s, i) => {
    tl.fromTo(s, { attr: merged[i] }, { attr: split[i], duration: 1 }, S1 + i * 0.06);
  });
  tl.fromTo("#total", { opacity: 1 }, { opacity: 0, duration: 0.3 }, S1);
  tl.fromTo("#names", { opacity: 0 }, { opacity: 1, duration: 0.35 }, S1 + 0.75);
  // Merge: the bars fold back into one aggregate, the names fade and the total returns.
  tl.fromTo("#names", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, S2);
  ["#s0", "#s1", "#s2"].forEach((s, i) => {
    tl.fromTo(s, { attr: split[i] }, { attr: merged[i], duration: 0.9, immediateRender: false }, S2 + (2 - i) * 0.05);
  });
  tl.fromTo("#total", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, S2 + 0.7);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
