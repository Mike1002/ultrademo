<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-flow-field</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #171a21; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #171a21; color: #ece8df;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #cv { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #a7adbb; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #ece8df; font-weight: 700; }
  #label .l-sep { color: #6d7380; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage"><canvas id="cv" width="1168" height="580"></canvas></div>
    <div id="label"><span class="l-name">Flow field</span><span class="l-sep">·</span><span>Generative</span><span class="l-sep">·</span><span>calm</span></div>
  </section>
</div>
<script>
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const W = 1168, H = 580, INK = "#ece8df", ACC = "#f2c200", MUTED = "#a7adbb";
  const SANS = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  const rng = rand(303);
  function circle(x, y, r, color, alpha) { ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  // A periodic, divergence-free field keeps the seeded density spread across the stage.
  function velocity(x, y, t) {
    const u = x / W * Math.PI * 2, v = y / H * Math.PI * 2;
    return [1.25 + 1.35 * Math.sin(u + t * 0.18) * Math.cos(v) + 0.55 * Math.cos(2 * v - t * 0.24),
      -1.35 * H / W * Math.cos(u + t * 0.18) * Math.sin(v) + 0.5 * Math.sin(u - t * 0.16)];
  }
  // 600 trajectories precomputed at load with a fixed step; renderAt draws up to the step for t, so seeking is exact.
  const STEPS = 300;
  const tracks = Array.from({ length: 600 }, () => {
    let x = rng() * W, y = rng() * H; const points = [[x, y]];
    for (let f = 1; f <= STEPS; f++) {
      const t = f / 60, [vx, vy] = velocity(x, y, t), [mx, my] = velocity(x + vx * 0.5, y + vy * 0.5, t);
      x = (x + mx + W) % W; y = (y + my + H) % H; points.push([x, y]);
    }
    return points;
  });
  function renderAt(t) {
    ctx.clearRect(0, 0, W, H); ctx.globalAlpha = 1;
    ctx.fillStyle = INK; ctx.font = "24px " + SANS; ctx.textAlign = "left"; ctx.fillText("The invisible flow", 104, 95);
    ctx.fillStyle = MUTED; ctx.font = "18px " + SANS; ctx.fillText("Every point follows the same field", 104, 540);
    // The source's 5 s run is played in 3 s: 100 steps per second, each point trailing its last 24 steps.
    const frame = Math.min(STEPS, Math.floor(t * 100));
    ctx.save(); ctx.lineWidth = 1.15;
    for (const points of tracks) {
      ctx.strokeStyle = INK; ctx.globalAlpha = 0.28; ctx.beginPath();
      const f0 = Math.max(0, frame - 24);
      for (let f = f0; f <= frame; f++) {
        const [x, y] = points[f];
        if (f === f0 || Math.abs(x - points[f - 1][0]) > W / 2 || Math.abs(y - points[f - 1][1]) > H / 2) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      const [x, y] = points[frame]; circle(x, y, 1.6, INK, 0.6);
    }
    ctx.restore();
    circle(1010, 83, 9, ACC, 1);
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
