<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-unit-aggregate-transition</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .unit { fill: #fffdf8; stroke: #1d1c1a; stroke-width: 2; }
  .outline { fill: none; stroke: #1d1c1a; stroke-width: 3; }
  .fill { fill: #f2c200; stroke: #1d1c1a; stroke-width: 3; }
  .axis { stroke: #1d1c1a; stroke-width: 2; }
  .title { font-size: 34px; font-weight: 700; fill: #1d1c1a; }
  .lab { font-size: 13px; letter-spacing: .06em; fill: #6d6a63; }
  .cat { font-size: 18px; fill: #6d6a63; text-anchor: middle; }
  .cnt { font-size: 26px; font-weight: 700; fill: #1d1c1a; text-anchor: middle; font-variant-numeric: tabular-nums; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <text class="title" x="60" y="56">Individual → total</text>
        <text class="lab" x="60" y="84">36 INVITES · GROUPED BY TEAM</text>
        <g id="units"></g>
        <g id="agg"></g>
        <line class="axis" id="base" x1="240" y1="490" x2="928" y2="490"/>
        <g id="labels"></g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Unit-to-aggregate transition</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const SVGNS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, cls) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (cls) e.setAttribute("class", cls); return e; };
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const teams = ["Design", "Sales", "Support", "Growth"], counts = [12, 10, 8, 6];
  const U = 30, CELL = 34, BASE = 490, BX = [280, 450, 620, 790];       // bins are two units wide, stacked from the baseline
  const r = rand(21);
  const units = [], uG = document.getElementById("units"), aG = document.getElementById("agg"), lG = document.getElementById("labels");
  let idx = 0;
  teams.forEach((t, b) => { for (let k = 0; k < counts[b]; k++) {
    const col = k % 2, row = Math.floor(k / 2);
    const to = { x: BX[b] + col * CELL, y: BASE - (row + 1) * CELL + (CELL - U) / 2 };
    const from = { x: 80 + r() * 1000, y: 120 + r() * 340 };
    const e = el("rect", { x: from.x, y: from.y, width: U, height: U, rx: 5 }, "unit"); uG.appendChild(e);
    units.push({ e, from, to, i: idx++ }); } });
  const bars = teams.map((t, b) => { const h = (counts[b] / 2) * CELL, x = BX[b] - 2, y = BASE - h, w = 2 * CELL - 4 + 4;
    const o = el("rect", { x, y, width: w, height: h, rx: 6 }, "outline"); const f = el("rect", { x, y, width: w, height: h, rx: 6 }, "fill");
    aG.appendChild(f); aG.appendChild(o);
    const c = el("text", { x: x + w / 2, y: y - 14 }, "cnt"); c.textContent = counts[b]; const n = el("text", { x: x + w / 2, y: BASE + 30 }, "cat"); n.textContent = t;
    lG.appendChild(c); lG.appendChild(n); return { o, f, c, n }; });

  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 0.9 } });
  // Units travel from their scattered positions into their bins over 900 ms, 10 ms apart; the baseline and names settle under them.
  units.forEach(u => tl.fromTo(u.e, { attr: { x: u.from.x, y: u.from.y } }, { attr: { x: u.to.x, y: u.to.y }, duration: 0.9 }, 0.3 + u.i * 0.01));
  tl.fromTo("#base", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.8);
  bars.forEach(b => tl.fromTo(b.n, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.8));
  // The aggregate outline is revealed 400 ms after the last unit lands, then the bars fill and the counts rise in.
  bars.forEach(b => { tl.fromTo(b.o, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 1.6);
    tl.fromTo(b.f, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 2.1);
    tl.fromTo(b.c, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.4); });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
