<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-zoom-callout</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .heading { position: absolute; left: 80px; top: 52px; font-size: 34px; font-weight: 700; }
  .small { position: absolute; left: 80px; top: 155px; width: 510px; height: 300px; border-top: 2px solid #1d1c1a; border-bottom: 1px solid #e3ded2; }
  .small .lab { position: absolute; left: 20px; top: 20px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .small .question { position: absolute; left: 20px; top: 58px; font-size: 21px; color: #6d6a63; }
  .row { position: absolute; left: 20px; width: 450px; height: 50px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e3ded2; font-size: 23px; }
  .row span:last-child { font-variant-numeric: tabular-nums; }
  .a { top: 130px; } .b { top: 182px; color: #a19d93; } .c { top: 234px; color: #a19d93; }
  .source { position: absolute; left: 441px; top: 280px; width: 90px; height: 62px; border: 1.5px solid #a19d93; border-radius: 50%; opacity: 0; }
  .lens { position: absolute; left: 750px; top: 137px; width: 330px; height: 330px; border: 3px solid #f2c200; border-radius: 50%; background: #fffdf8; overflow: hidden; opacity: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; will-change: transform; }
  .lens .word { font-size: 36px; font-weight: 700; }
  .lens .value { font-size: 104px; line-height: 1; font-weight: 700; color: #1d1c1a; font-variant-numeric: tabular-nums; }
  .connector { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .connector path { stroke: #a19d93; stroke-width: 1.5; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="heading">Invite your team</div>
      <div class="small">
        <div class="lab">Team · accepted</div>
        <div class="question">Who has joined so far?</div>
        <div class="row a"><span>Jamie Dalton</span><span>98%</span></div>
        <div class="row b"><span>Sam Kim</span><span>21%</span></div>
        <div class="row c"><span>Morgan Lee</span><span>9%</span></div>
      </div>
      <div class="source" id="source" data-layout-allow-overlap></div>
      <svg class="connector" data-layout-allow-overlap viewBox="0 0 1168 580"><path id="link" d="M531 311 L750 302" pathLength="1"/></svg>
      <div class="lens" id="lens" data-layout-allow-overlap><div class="word">Jamie Dalton</div><div class="value">98%</div></div>
    </div>
    <div id="label"><span class="l-name">Zoom callout</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // A faint ring marks the small value, a hairline draws across, then the circular callout grows in from the ring, 4.5x the size.
  tl.fromTo("#source", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3);
  tl.fromTo("#link", { strokeDashoffset: 1 }, { strokeDashoffset: 0, autoRound: false, duration: 0.65, ease: "power2.out" }, 0.6);
  tl.fromTo("#lens", { x: -120, scale: 0.25, opacity: 0, transformOrigin: "50% 50%" }, { x: 0, scale: 1, opacity: 1, duration: 0.85, ease: "power3.out" }, 0.65);
  // Idle: the callout hovers a few pixels so the hold still breathes.
  tl.fromTo("#lens", { y: 0 }, { y: -8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.0);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
