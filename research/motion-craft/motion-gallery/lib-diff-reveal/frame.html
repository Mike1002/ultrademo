<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-diff-reveal</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .card { position: absolute; left: 184px; top: 50px; width: 800px; height: 480px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; overflow: hidden; }
  .head { position: absolute; left: 0; top: 0; width: 796px; height: 64px; border-bottom: 2px solid #e3ded2; }
  .head .fn { position: absolute; left: 32px; top: 18px; font-size: 22px; font-weight: 700; }
  .head .meta { position: absolute; left: 200px; top: 21px; font-size: 18px; color: #6d6a63; }
  #pill { position: absolute; right: 28px; top: 16px; height: 32px; padding: 0 14px; border-radius: 16px; background: #f2c200; border: 2px solid #1d1c1a; font-size: 16px; font-weight: 700; line-height: 28px; will-change: transform, opacity; }
  .ln { position: absolute; left: 0; width: 796px; height: 44px; font-family: ui-monospace, Menlo, Monaco, "Courier New", monospace; font-size: 22px; line-height: 44px; white-space: pre; will-change: transform, opacity; }
  .ln .no { position: absolute; left: 24px; width: 32px; text-align: right; color: #a19d93; font-size: 16px; }
  .ln .mk { position: absolute; left: 76px; width: 24px; text-align: center; font-weight: 700; }
  .ln .tx { position: absolute; left: 112px; }
  .ln .tx b { font-weight: 700; }
  .ln.ctx .tx { color: #6d6a63; }
  .ln.del { background: rgba(214, 69, 69, 0.18); }
  .ln.add { background: rgba(31, 157, 85, 0.18); }
  .ln .strike { position: absolute; left: 112px; top: 21px; height: 3px; background: #1d1c1a; will-change: transform; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="card">
        <div class="head"><div class="fn">orbit.config</div><div class="meta">Invite your team · settings</div><div id="pill">+2 −2</div></div>
        <div class="ln ctx" style="top:80px"><span class="no">1</span><span class="tx">team: orbit</span></div>
        <div class="ln ctx" style="top:124px"><span class="no">2</span><span class="tx">seats: 3</span></div>
        <div class="ln del" id="d1" style="top:168px" data-layout-allow-occlusion><span class="no">3</span><span class="mk">−</span><span class="tx" data-layout-allow-occlusion>invites: <b data-layout-allow-occlusion>manual</b></span><div class="strike" id="s1" style="width:200px" data-layout-allow-overlap data-layout-allow-occlusion></div></div>
        <div class="ln add" id="a1" style="top:212px"><span class="no">4</span><span class="mk">+</span><span class="tx">invites: <b>auto</b></span></div>
        <div class="ln ctx" style="top:256px"><span class="no">5</span><span class="tx">members: jamie, sam, morgan</span></div>
        <div class="ln del" id="d2" style="top:300px" data-layout-allow-occlusion><span class="no">6</span><span class="mk">−</span><span class="tx" data-layout-allow-occlusion>notify: <b data-layout-allow-occlusion>off</b></span><div class="strike" id="s2" style="width:146px" data-layout-allow-overlap data-layout-allow-occlusion></div></div>
        <div class="ln add" id="a2" style="top:344px"><span class="no">7</span><span class="mk">+</span><span class="tx">notify: <b>on-join</b></span></div>
        <div class="ln ctx" style="top:388px"><span class="no">8</span><span class="tx">region: eu-west</span></div>
      </div>
    </div>
    <div id="label"><span class="l-name">Diff reveal</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.6 } });
  // Params: each line fades over 0.25 s; removed first, strikethrough drawn with scaleX, added line enters 0.25 s later from x -12.
  gsap.set(["#d1", "#d2", "#a1", "#a2"], { opacity: 0 });
  gsap.set(["#s1", "#s2"], { scaleX: 0, transformOrigin: "0 50%" });
  gsap.set("#pill", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" });
  function change(del, strike, add, at) {
    tl.fromTo(del, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at);
    tl.fromTo(strike, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, at + 0.25);
    tl.fromTo(add, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, at + 0.5);
  }
  change("#d1", "#s1", "#a1", 0.3);    // first change: removed, struck, added (complete by 1.05 s)
  change("#d2", "#s2", "#a2", 1.45);   // second change
  // Settle: the change count pops in.
  tl.fromTo("#pill", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 2.45);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
