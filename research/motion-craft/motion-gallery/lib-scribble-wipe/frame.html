<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-scribble-wipe</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .panel { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .art { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .art.a { background: #ece7da; }
  .art.b { background: #f6f3ec; }
  .card { position: absolute; left: 204px; top: 100px; width: 760px; height: 380px; background: #fffdf8;
    border: 2px solid #1d1c1a; border-radius: 24px; }
  .card .eyebrow { position: absolute; left: 56px; top: 44px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card .h1 { position: absolute; left: 56px; top: 84px; font-size: 56px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 164px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 254px; width: 200px; height: 60px; background: #f2c200; border: 2px solid #1d1c1a;
    border-radius: 14px; font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; color: #1d1c1a; }
  .card .av { position: absolute; top: 44px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #1d1c1a; background: #ece7da;
    font-size: 20px; font-weight: 700; line-height: 60px; text-align: center; }
  .card .av.v1 { left: 540px; } .card .av.v2 { left: 592px; } .card .av.v3 { left: 644px; }
  .art.b .num { position: absolute; left: 92px; top: 86px; font-size: 136px; font-weight: 700; line-height: 1; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .art.b .cap { position: absolute; left: 100px; top: 236px; font-size: 22px; color: #6d6a63; }
  .art.b .row { position: absolute; left: 96px; width: 520px; height: 60px; border-top: 2px solid #e3ded2; font-size: 22px; line-height: 58px;
    padding-left: 30px; will-change: transform; }
  .art.b .row .dot { position: absolute; left: 0; top: 24px; width: 12px; height: 12px; border-radius: 50%; background: #f2c200; }
  .art.b .row.r1 { top: 320px; } .art.b .row.r2 { top: 384px; } .art.b .row.r3 { top: 448px; }
  .art.b .disc { will-change: transform; position: absolute; left: 780px; top: 150px; width: 280px; height: 280px; border-radius: 50%; background: #f2c200;
    border: 2px solid #1d1c1a; text-align: center; color: #1d1c1a; }
  .art.b .disc .pct { position: absolute; left: 0; width: 276px; top: 86px; font-size: 72px; font-weight: 700; line-height: 1; }
  .art.b .disc .pl { position: absolute; left: 0; width: 276px; top: 166px; font-size: 18px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
  #scribble { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #scribble path { fill: none; stroke: #1d1c1a; stroke-width: 54px; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="panel" id="B"></div>
      <div class="panel" id="A" data-layout-allow-overlap></div>
      <svg id="scribble" viewBox="0 0 1168 580" data-layout-allow-overlap></svg>
    </div>
    <div id="label"><span class="l-name">Scribble wipe</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  const A_HTML = "<div class=\"art a\" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class=\"card\"><div class=\"eyebrow\" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div><div class=\"h1\" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div><div class=\"sub\" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left</div><div class=\"btn\" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div><div class=\"av v1\" data-layout-allow-overlap data-layout-allow-occlusion>JD</div><div class=\"av v2\" data-layout-allow-overlap data-layout-allow-occlusion>SK</div><div class=\"av v3\" data-layout-allow-overlap data-layout-allow-occlusion>ML</div></div></div>";
  const B_HTML = "<div class=\"art b\" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class=\"num\" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div><div class=\"cap\" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div><div class=\"row r1\" data-layout-allow-overlap data-layout-allow-occlusion><span class=\"dot\"></span>Jamie Dalton</div><div class=\"row r2\" data-layout-allow-overlap data-layout-allow-occlusion><span class=\"dot\"></span>Sam Kim</div><div class=\"row r3\" data-layout-allow-overlap data-layout-allow-occlusion><span class=\"dot\"></span>Morgan Lee</div><div class=\"disc\" data-layout-allow-overlap data-layout-allow-occlusion><div class=\"pct\" data-layout-allow-overlap data-layout-allow-occlusion>98%</div><div class=\"pl\" data-layout-allow-overlap data-layout-allow-occlusion>accepted</div></div></div>";
  document.getElementById("A").innerHTML = A_HTML;
  document.getElementById("B").innerHTML = B_HTML;
  // Ten horizontal scribble strokes, 58 px apart, zigzagging across the stage from a fixed seeded table (mulberry32, seed 31).
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = rand(31);
  const N = 10, svg = document.getElementById("scribble");
  let d = "";
  for (let i = 0; i < N; i++) {
    const cy = 29 + i * 58, ltr = i % 2 === 0;
    const pts = [];
    for (let x = -70; x <= 1240; x += 90) pts.push([x + (rnd() - 0.5) * 30, cy + (rnd() - 0.5) * 44]);
    if (!ltr) pts.reverse();
    d += '<path id="s' + i + '" d="M' + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + '"/>';
  }
  svg.innerHTML = d;
  const paths = [];
  for (let i = 0; i < N; i++) paths.push(document.getElementById("s" + i));
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Dash boundary parked mid-gap so no round-cap dot shows before a stroke starts: dasharray "L L+40", offset L+20 (hidden) -> 0 (drawn) -> -(L+20) (erased from the start).
  const T0 = 0.5, DRAW = 0.3, GAP = 0.03;
  paths.forEach((p, i) => {
    const L = p.getTotalLength();
    gsap.set(p, { strokeDasharray: L + " " + (L + 40) });
    tl.fromTo(p, { strokeDashoffset: L + 20 }, { strokeDashoffset: 0, duration: DRAW, ease: "power2.out" }, T0 + i * GAP);
    tl.to(p, { strokeDashoffset: -(L + 20), duration: DRAW, ease: "power2.in" }, 1.15 + i * GAP);
  });
  // At the covered moment the scene swaps underneath in one frame.
  tl.fromTo("#A", { opacity: 1 }, { opacity: 0, duration: 0.034, ease: "none" }, 1.08);
  const ROWS_AT = 1.75;
  // Second beat: the three rows and the disc of the new scene settle in as the last strokes wipe off.
  tl.fromTo(".art.b .row.r1", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT);
  tl.fromTo(".art.b .row.r2", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT + 0.1);
  tl.fromTo(".art.b .row.r3", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT + 0.2);
  tl.fromTo(".art.b .disc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, ROWS_AT + 0.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
