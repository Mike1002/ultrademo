<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-gantt-progress</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .cap { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; fill: #6d6a63; }
  .day { font-size: 18px; fill: #6d6a63; }
  .grid { stroke: #e3ded2; stroke-width: 2; }
  .task { font-size: 24px; font-weight: 700; fill: #1d1c1a; }
  .plan { fill: #fffdf8; stroke: #1d1c1a; stroke-width: 2; }
  .done { fill: #f2c200; }
  .pct { font-size: 18px; font-weight: 700; fill: #1d1c1a; font-variant-numeric: tabular-nums; }
  #cursor line { stroke: #1d1c1a; stroke-width: 3; }
  #cursor rect { fill: #1d1c1a; }
  #cursor text { font-size: 14px; font-weight: 700; letter-spacing: .06em; fill: #f6f3ec; }
  #cursor { will-change: transform; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <text class="cap" x="60" y="36">Launch video · this week</text>
        <g id="days"></g>
        <g id="rows"></g>
        <g id="cursor"><line x1="300" y1="70" x2="300" y2="540"/><rect x="266" y="44" width="68" height="26" rx="13"/><text x="300" y="62" text-anchor="middle">NOW</text></g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Gantt progress</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const X0 = 300, AX = 800, Y0 = 110, RH = 100, BH = 56;        // time axis 800 px wide, four rows
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri"];
  const daysG = document.getElementById("days");
  days.forEach((d, i) => {
    mk("line", { class: "grid", x1: X0 + i * 160, y1: 70, x2: X0 + i * 160, y2: 540 }, daysG);
    const t = mk("text", { class: "day", x: X0 + i * 160 + 80, y: 96, "text-anchor": "middle" }, daysG); t.textContent = d;
  });
  mk("line", { class: "grid", x1: X0 + 800, y1: 70, x2: X0 + 800, y2: 540 }, daysG);
  // Tasks: scheduled window as a fraction of the week, and how much of the work actually gets done inside that window.
  const tasks = [
    { name: "Record", start: 0.0, end: 0.3, done: 1.0 },
    { name: "Edit", start: 0.2, end: 0.55, done: 1.0 },
    { name: "Review", start: 0.5, end: 0.8, done: 0.65 },   // behind schedule: elapsed time passes it before the work is done
    { name: "Ship", start: 0.75, end: 1.0, done: 1.0 }
  ];
  const rowsG = document.getElementById("rows");
  const fills = tasks.map((t, i) => {
    const y = Y0 + i * RH + 20;
    const lab = mk("text", { class: "task", x: 60, y: y + 36 }, rowsG); lab.textContent = t.name;
    mk("rect", { class: "plan", x: X0 + t.start * AX, y, width: (t.end - t.start) * AX, height: BH, rx: 10 }, rowsG);
    const f = mk("rect", { class: "done", x: X0 + t.start * AX + 2, y: y + 2, width: 0, height: BH - 4, rx: 8 }, rowsG);
    const p = mk("text", { class: "pct", x: X0 + t.end * AX + 16, y: y + 36, opacity: 0 }, rowsG); p.textContent = Math.round(t.done * 100) + "%";
    return { f, p, t };
  });
  const T0 = 0.2, DUR = 2.4;                                      // the cursor crosses the week from 0.2 s to 2.6 s, linear
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none" } });
  tl.fromTo("#cursor", { x: 0 }, { x: AX, duration: DUR, ease: "none" }, T0);
  // Each bar's completed portion grows behind the cursor while its window is open; a behind-schedule task stops short of full.
  fills.forEach(({ f, p, t }) => {
    const w = (t.end - t.start) * AX - 4;
    tl.fromTo(f, { attr: { width: 0 } }, { attr: { width: w * t.done }, duration: (t.end - t.start) * DUR, ease: "none" }, T0 + t.start * DUR);
    tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, T0 + t.end * DUR);
  });
  // Settle: the cursor tag breathes once at the end of the week.
  tl.fromTo("#cursor rect", { attr: { width: 68, x: 266 } }, { attr: { width: 80, x: 260 }, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 2.62);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
