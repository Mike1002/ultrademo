<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-pie-donut-update</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #chart text { font-size: 22px; fill: #1d1c1a; font-variant-numeric: tabular-nums; }
  #chart .small { font-size: 16px; fill: #6d6a63; }
  #chart .big { font-size: 84px; font-weight: 700; fill: #1d1c1a; }
  #chart .lead { font-size: 13px; letter-spacing: .06em; fill: #6d6a63; }
  .heading { position: absolute; left: 32px; top: 26px; font-size: 34px; font-weight: 700; }
  .sub { position: absolute; left: 34px; top: 72px; font-size: 16px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="heading">Shares shift</div>
      <div class="sub">Same colours, same order; only the angles change</div>
      <svg id="chart" viewBox="0 0 1168 580" xmlns="http://www.w3.org/2000/svg">
        <path id="slice0" fill="#f2c200" stroke="#f6f3ec" stroke-width="4"/>
        <path id="slice1" fill="#1d1c1a" stroke="#f6f3ec" stroke-width="4"/>
        <path id="slice2" fill="#a19d93" stroke="#f6f3ec" stroke-width="4"/>
        <text id="share" class="big" x="380" y="350" text-anchor="middle">62%</text>
        <text class="small" x="380" y="386" text-anchor="middle">Invite</text>
        <text class="lead" x="740" y="246">NEXT ACTION · SHARE OF SESSIONS</text>
        <circle cx="751" cy="302" r="8" fill="#f2c200" stroke="#1d1c1a" stroke-width="2"/><text id="legend0" x="777" y="310">Invite 62%</text>
        <circle cx="751" cy="355" r="8" fill="#1d1c1a"/><text id="legend1" x="777" y="363">Share 21%</text>
        <circle cx="751" cy="408" r="8" fill="#a19d93"/><text id="legend2" x="777" y="416">Other 17%</text>
        <text class="small" x="740" y="493">Each moment sums to 100%</text>
      </svg>
    </div>
    <div id="label"><span class="l-name">Pie and donut update</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Three share states; slice start and end angles interpolate between them (power2.inOut), order and colour fixed.
  const states = [[62, 21, 17], [75, 15, 10], [68, 22, 10]];
  const names = ["Invite", "Share", "Other"];
  const slices = [0, 1, 2].map(i => document.querySelector("#slice" + i));
  const legends = [0, 1, 2].map(i => document.querySelector("#legend" + i));
  const shareEl = document.querySelector("#share");
  const inOut = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  function point(a, r) { return (380 + Math.cos(a) * r) + "," + (330 + Math.sin(a) * r); }
  function arc(a, b) {
    const o = point(a, 190), q = point(b, 190), u = point(b, 117), v = point(a, 117), large = b - a > Math.PI ? 1 : 0;
    return `M${o} A190,190 0 ${large} 1 ${q} L${u} A117,117 0 ${large} 0 ${v} Z`;
  }
  function valuesAt(t) {
    // 0.5..1.6 s: state 0 -> 1; 2.0..2.9 s: state 1 -> 2.
    const p1 = inOut(Math.max(0, Math.min(1, (t - 0.5) / 1.1)));
    const p2 = inOut(Math.max(0, Math.min(1, (t - 2.0) / 0.9)));
    return states[0].map((v, i) => { const m = v + (states[1][i] - v) * p1; return m + (states[2][i] - m) * p2; });
  }
  function renderAt(t) {
    let a = -Math.PI / 2;
    const values = valuesAt(t);
    values.forEach((v, i) => {
      const b = a + v / 100 * Math.PI * 2;
      slices[i].setAttribute("d", arc(a, b));
      legends[i].textContent = names[i] + " " + Math.round(v) + "%";
      a = b;
    });
    shareEl.textContent = Math.round(values[0]) + "%";
  }
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
