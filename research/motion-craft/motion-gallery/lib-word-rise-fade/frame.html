<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-word-rise-fade</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #line1 { position: absolute; left: 0; top: 170px; width: 1168px; height: 140px; display: flex; justify-content: center; gap: 30px; align-items: center;
    font-size: 96px; font-weight: 700; line-height: 140px; letter-spacing: -0.02em; white-space: nowrap; }
  #line1 span { display: block; will-change: transform, opacity, filter; }
  #line2 { position: absolute; left: 0; top: 340px; width: 1168px; height: 40px; display: flex; justify-content: center; gap: 10px; align-items: center;
    font-size: 26px; color: #6d6a63; line-height: 40px; white-space: nowrap; }
  #line2 span { display: block; will-change: transform, opacity, filter; }
  #mark { position: absolute; left: 544px; top: 420px; width: 80px; height: 6px; border-radius: 3px; background: #f2c200; will-change: transform; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="line1"><span>Your</span><span>product,</span><span>in</span><span>motion.</span></div>
      <div id="line2"><span>Orbit</span><span>·</span><span>Invite</span><span>your</span><span>team</span><span>·</span><span>3</span><span>seats</span><span>left</span></div>
      <div id="mark"></div>
    </div>
    <div id="label"><span class="l-name">Word rise fade</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>calm</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.5 } });
  // Each word rises 24 px while shedding an 8 px blur and fading in, 0.12 s apart; the caption below repeats the recipe smaller.
  const w1 = document.querySelectorAll("#line1 span"), w2 = document.querySelectorAll("#line2 span");
  w1.forEach((s, i) => {
    tl.fromTo(s, { y: 24, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 0.2 + i * 0.12);
  });
  tl.fromTo("#mark", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.0);
  w2.forEach((s, i) => {
    tl.fromTo(s, { y: 14, opacity: 0, filter: "blur(6px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, 1.5 + i * 0.08);
  });
  // Soft second settle: the headline eases up two pixels and back in the last beat.
  w1.forEach((s, i) => {
    tl.fromTo(s, { y: 0 }, { y: -3, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.3 + i * 0.06);
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
