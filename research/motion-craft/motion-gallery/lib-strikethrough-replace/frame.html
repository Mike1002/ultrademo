<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-strikethrough-replace</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #card { position: absolute; left: 134px; top: 70px; width: 900px; height: 440px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  .pair { position: absolute; left: 60px; width: 780px; height: 170px; }
  .pair.a { top: 44px; } .pair.b { top: 240px; }
  .pair .lab { position: absolute; left: 0; top: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .old { position: absolute; left: 0; top: 24px; height: 72px; line-height: 72px; font-size: 56px; font-weight: 700; white-space: nowrap; color: #1d1c1a; }
  .strike { position: absolute; top: 58px; left: 0; height: 6px; background: #1d1c1a; border-radius: 3px; will-change: transform; }
  .new { position: absolute; left: 0; top: 100px; height: 72px; line-height: 72px; font-size: 64px; font-weight: 700; white-space: nowrap; color: #1d1c1a; will-change: transform; }
  .new em { font-style: normal; background: #f2c200; padding: 0 14px; border-radius: 12px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="card">
        <div class="pair a">
          <div class="lab">Seats on the Orbit plan</div>
          <div class="old" id="oa">12 seats left</div>
          <div class="strike" id="sa" data-layout-allow-overlap></div>
          <div class="new" id="na"><em>3 seats left</em></div>
        </div>
        <div class="pair b">
          <div class="lab">Invites sent</div>
          <div class="old" id="ob">1,284</div>
          <div class="strike" id="sb" data-layout-allow-overlap></div>
          <div class="new" id="nb"><em>12,480</em></div>
        </div>
      </div>
    </div>
    <div id="label"><span class="l-name">Strikethrough replace</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.25 } });
  // Strike left to right in 0.35 s, rest 0.1 s, dim the old value to 0.45, then the new value rises in from 12 px below in 0.25 s.
  function replace(strike, oldEl, newEl, at) {
    document.querySelector(strike).style.width = document.querySelector(oldEl).offsetWidth + "px"; // sized once at build to the old text
    tl.fromTo(strike, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, at);
    tl.fromTo(oldEl, { opacity: 1 }, { opacity: 0.45, duration: 0.2, immediateRender: false }, at + 0.35);
    tl.fromTo(newEl, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, at + 0.45);
  }
  replace("#sa", "#oa", "#na", 0.4);
  replace("#sb", "#ob", "#nb", 1.8);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
