<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-cross-cutting</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .panel { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; will-change: opacity; }
  #pb { background: #ece7da; }
  .card { position: absolute; left: 164px; top: 70px; width: 840px; height: 440px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  .av { position: absolute; left: 48px; top: 44px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid #1d1c1a; background: #ece7da;
    font-size: 20px; font-weight: 700; line-height: 52px; text-align: center; }
  .name { position: absolute; left: 124px; top: 42px; font-size: 28px; font-weight: 700; line-height: 32px; white-space: nowrap; }
  .status { position: absolute; left: 124px; top: 76px; font-size: 18px; color: #6d6a63; white-space: nowrap; }
  .rule { position: absolute; left: 48px; top: 128px; width: 744px; height: 2px; background: #e3ded2; }
  .lab { position: absolute; left: 48px; top: 170px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .field { position: absolute; left: 48px; top: 200px; width: 500px; height: 60px; border: 2px solid #1d1c1a; border-radius: 14px; font-size: 22px; line-height: 56px; padding-left: 20px; }
  .btn { position: absolute; left: 572px; top: 200px; width: 220px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; will-change: transform; }
  .sent { position: absolute; left: 48px; top: 300px; height: 44px; padding: 0 20px; border-radius: 22px; background: #1d1c1a; color: #fffdf8;
    font-size: 18px; font-weight: 700; line-height: 44px; white-space: nowrap; will-change: transform, opacity; }
  .foot { position: absolute; left: 48px; top: 372px; font-size: 18px; color: #6d6a63; }
  .row { position: absolute; left: 48px; width: 744px; height: 64px; border-bottom: 2px solid #e3ded2; font-size: 20px; line-height: 62px; padding-left: 28px; white-space: nowrap; will-change: transform, opacity; }
  .row .dot { position: absolute; left: 0; top: 26px; width: 12px; height: 12px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; }
  .row .when { position: absolute; right: 0; top: 0; font-size: 16px; color: #6d6a63; }
  .row.new { font-weight: 700; }
  .cursor { position: absolute; left: 0; top: 0; width: 28px; height: 38px; pointer-events: none; will-change: transform; }
  .cursor svg { width: 28px; height: 38px; display: block; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage"></div>
    <div id="label"><span class="l-name">Cross cutting</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  const AT = ' data-layout-allow-overlap data-layout-allow-occlusion';
  const CUR = '<svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg>';
  // Place A: Jamie sends an invite. Place B: Sam's inbox receives it.
  let html = '';
  html += '<div class="panel" id="pa"' + AT + '><div class="card"' + AT + '>'
    + '<div class="av"' + AT + '>JD</div><div class="name"' + AT + '>Jamie Dalton</div><div class="status"' + AT + '>Sending invite</div><div class="rule"' + AT + '></div>'
    + '<div class="lab"' + AT + '>Email</div><div class="field"' + AT + '>sam@orbit.co</div><div class="btn" id="send"' + AT + '>Send invite</div>'
    + '<div class="sent" id="sent"' + AT + '>Invite sent</div><div class="foot"' + AT + '>3 seats left on this plan</div>'
    + '</div><div class="cursor" id="cur"' + AT + '>' + CUR + '</div></div>';
  html += '<div class="panel" id="pb"' + AT + '><div class="card"' + AT + '>'
    + '<div class="av"' + AT + '>SK</div><div class="name"' + AT + '>Sam Kim</div><div class="status"' + AT + '>Inbox</div><div class="rule"' + AT + '></div>'
    + '<div class="row new" id="r0" style="top:150px"' + AT + '><span class="dot"' + AT + '></span>Jamie Dalton invited you to Orbit<span class="when"' + AT + '>now</span></div>'
    + '<div class="row" id="r1" style="top:150px"' + AT + '>Morgan Lee shared a board<span class="when"' + AT + '>2 h</span></div>'
    + '<div class="row" id="r2" style="top:214px"' + AT + '>Weekly digest<span class="when"' + AT + '>1 d</span></div>'
    + '<div class="row" id="r3" style="top:278px"' + AT + '>Billing updated<span class="when"' + AT + '>3 d</span></div>'
    + '</div></div>';
  document.getElementById("stage").innerHTML = html;

  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.6 } });
  // Hard cuts between the two places; each gap shorter than the last: A 0.85, B 0.65, A 0.5, B 0.4, A to the end.
  const CUTS = [0.85, 1.5, 2.0, 2.4];
  tl.fromTo("#pa", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
  tl.fromTo("#pb", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  CUTS.forEach((t, i) => {
    const toB = i % 2 === 0;
    tl.to("#pa", { opacity: toB ? 0 : 1, duration: 0.034, ease: "none" }, t);
    tl.to("#pb", { opacity: toB ? 1 : 0, duration: 0.034, ease: "none" }, t);
  });
  // Place A keeps its own time: the cursor travels to the button, presses it on the second visit, and the receipt lands on the third.
  const BX = 164 + 572 + 110, BY = 70 + 200 + 30;   // button centre in stage coordinates
  tl.fromTo("#cur", { x: 760, y: 470, scale: 1 }, { x: BX, y: BY, duration: 1.3, ease: "power2.inOut" }, 0.2);
  tl.to("#cur", { scale: 0.85, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, 1.62);
  tl.fromTo("#send", { scale: 1, transformOrigin: "50% 50%" }, { scale: 0.95, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, 1.62);
  tl.to("#cur", { x: BX + 40, y: BY + 36, duration: 0.5, ease: "power2.inOut" }, 1.85);
  tl.fromTo("#sent", { opacity: 0, scale: 0.8, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 2.5);
  // Place B keeps its own time: the inbox rows settle on the first visit; the new row drops in on the second and pushes the rest down.
  tl.fromTo("#r1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.9);
  tl.fromTo("#r2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.0);
  tl.fromTo("#r3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.1);
  tl.fromTo("#r0", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.05);
  tl.to(["#r1", "#r2", "#r3"], { y: 64, duration: 0.3, ease: "power2.out" }, 2.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
