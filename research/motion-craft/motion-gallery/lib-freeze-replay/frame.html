<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-freeze-replay</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .cap { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; fill: #6d6a63; }
  .tick { font-size: 18px; fill: #6d6a63; }
  .grid { stroke: #e3ded2; stroke-width: 2; }
  .axis { stroke: #1d1c1a; stroke-width: 2; }
  #line { fill: none; stroke: #1d1c1a; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  #head { fill: #f2c200; stroke: #1d1c1a; stroke-width: 3; }
  #cpline { stroke: #a19d93; stroke-width: 2; stroke-dasharray: 6 8; }
  #note rect { fill: #f2c200; stroke: #1d1c1a; stroke-width: 2; }
  #note text { font-size: 24px; font-weight: 700; fill: #1d1c1a; }
  #badge rect { fill: #1d1c1a; }
  #badge text { font-size: 15px; font-weight: 700; letter-spacing: .06em; fill: #f6f3ec; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <defs><clipPath id="reveal"><rect id="revealRect" x="160" y="60" width="0" height="480"/></clipPath></defs>
        <text class="cap" x="160" y="36">Seats used · Orbit</text>
        <line class="grid" x1="160" y1="120" x2="1080" y2="120"/>
        <line class="grid" x1="160" y1="300" x2="1080" y2="300"/>
        <line class="axis" x1="160" y1="480" x2="1080" y2="480"/>
        <line class="axis" x1="160" y1="60" x2="160" y2="480"/>
        <text class="tick" x="140" y="126" text-anchor="end">12</text>
        <text class="tick" x="140" y="306" text-anchor="end">6</text>
        <text class="tick" x="140" y="486" text-anchor="end">0</text>
        <text class="tick" x="160" y="514" text-anchor="middle">Day 1</text>
        <text class="tick" x="620" y="514" text-anchor="middle">Day 8</text>
        <text class="tick" x="1080" y="514" text-anchor="middle">Day 15</text>
        <line id="cpline" x1="0" y1="60" x2="0" y2="480" opacity="0"/>
        <g clip-path="url(#reveal)"><polyline id="line" points=""/></g>
        <circle id="head" cx="160" cy="480" r="12"/>
        <g id="note" opacity="0"><rect x="0" y="0" width="200" height="48" rx="12"/><text x="100" y="32" text-anchor="middle">3 seats left</text></g>
        <g id="badge" opacity="0"><rect x="930" y="20" width="150" height="34" rx="17"/><text x="1005" y="42" text-anchor="middle">REPLAY · ½ speed</text></g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Freeze and replay</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // Seats used per day (0-12). The checkpoint is the day the count reaches 9: three seats left.
  const vals = [0, 1, 1, 2, 3, 3, 4, 5, 6, 6, 7, 8, 9, 9, 10, 11, 12];
  const X0 = 160, W = 920, y = v => 480 - v * 30;
  const xAt = p => X0 + W * p;
  const yAt = p => { const f = p * (vals.length - 1), i = Math.min(vals.length - 2, Math.floor(f)), q = f - i; return y(vals[i] + (vals[i + 1] - vals[i]) * q); };
  document.getElementById("line").setAttribute("points", vals.map((v, i) => xAt(i / (vals.length - 1)) + "," + y(v)).join(" "));
  const CP = 12 / 16, RW = 8 / 16;                 // checkpoint at day 13 (p = 0.75); the replay restarts at day 9 (p = 0.5)
  const T_PLAY = 1.0, T_HOLD = 1.8, T_REPLAY_END = 2.75;
  const el = id => document.getElementById(id);
  // Progress is a pure function of time: play to the checkpoint, freeze, jump back and replay the last interval at half speed, freeze again.
  function progressAt(t) {
    if (t < T_PLAY) return CP * Math.max(0, t - 0.1) / (T_PLAY - 0.1);
    if (t < T_HOLD) return CP;
    if (t < T_REPLAY_END) return RW + (CP - RW) * (t - T_HOLD) / (T_REPLAY_END - T_HOLD);
    return CP;
  }
  function renderAt(t) {
    const p = Math.min(CP, progressAt(t));
    el("revealRect").setAttribute("width", W * p);
    el("head").setAttribute("cx", xAt(p)); el("head").setAttribute("cy", yAt(p));
    const frozen = (t >= T_PLAY && t < T_HOLD) || t >= T_REPLAY_END;
    const noteIn = t >= T_PLAY ? Math.min(1, (t - T_PLAY) / 0.25) : 0;
    const noteOp = t < T_HOLD ? noteIn : (t < T_REPLAY_END ? 0.35 : Math.min(1, 0.35 + (t - T_REPLAY_END) / 0.2));
    el("note").setAttribute("opacity", noteOp.toFixed(3));
    el("note").setAttribute("transform", "translate(" + (xAt(CP) - 224) + " " + (yAt(CP) - 80) + ")");
    el("cpline").setAttribute("x1", xAt(CP)); el("cpline").setAttribute("x2", xAt(CP));
    el("cpline").setAttribute("opacity", t >= T_PLAY ? 1 : 0);
    el("badge").setAttribute("opacity", t >= T_HOLD && t < T_REPLAY_END ? 1 : 0);
    el("head").setAttribute("r", frozen ? 12 + 4 * Math.abs(Math.sin(t * 6)) : 12);   // the head breathes while frozen
  }
  renderAt(0);
  const tl = gsap.timeline({ paused: true });
  tl.fromTo({ k: 0 }, { k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
