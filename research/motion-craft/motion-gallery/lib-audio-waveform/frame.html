<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-audio-waveform</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #title { position: absolute; left: 104px; top: 40px; font-size: 34px; font-weight: 700; color: #1d1c1a; }
  #clock { position: absolute; left: 104px; top: 86px; font-size: 22px; color: #6d6a63; font-variant-numeric: tabular-nums; }
  #pos { position: absolute; left: 584px; top: 466px; width: 120px; margin-left: -60px; text-align: center; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  #played { fill: none; stroke: #1d1c1a; stroke-width: 2.5; stroke-linejoin: round; }
  #ahead { fill: none; stroke: #a19d93; stroke-width: 2.5; stroke-linejoin: round; }
  #mid { stroke: #e3ded2; stroke-width: 2; }
  #head { stroke: #f2c200; stroke-width: 6; stroke-linecap: round; }
  #headdot { fill: #f2c200; stroke: #1d1c1a; stroke-width: 3; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="title">Orbit launch · 0:12</div>
      <div id="clock">0:12.0 / 0:48</div>
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <defs>
          <clipPath id="cpL"><rect x="104" y="150" width="480" height="300"/></clipPath>
          <clipPath id="cpR"><rect x="584" y="150" width="480" height="300"/></clipPath>
        </defs>
        <line id="mid" x1="104" y1="300" x2="1064" y2="300"/>
        <polyline id="played" clip-path="url(#cpL)" points=""/>
        <polyline id="ahead" clip-path="url(#cpR)" points=""/>
        <line id="head" x1="584" y1="170" x2="584" y2="430"/>
        <circle id="headdot" cx="584" cy="170" r="9"/>
      </svg>
      <div id="pos">Playhead</div>
    </div>
    <div id="label"><span class="l-name">Audio waveform</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // Baked, normalised samples standing in for pre-analysed audio: 1024 samples, a seeded signal under a speech-like envelope.
  const N = 1024, r = rand(12);
  const env = k => { const u = k / 96; return 0.12 + 0.88 * Math.pow(0.5 + 0.5 * Math.sin(u * 2.1) * Math.sin(u * 0.7 + 1.3), 1.6); };
  const samples = [];
  let v = 0;
  for (let k = 0; k < N; k++) { v = v * 0.55 + (r() - 0.5) * 0.9; samples.push(Math.max(-1, Math.min(1, v * 1.6 + 0.5 * Math.sin(k * 0.9)) ) * env(k)); }
  // The window shows 256 samples across 960 px; the signal scrolls at 128 samples per second under the fixed playhead at x = 584.
  const WIN = 256, X0 = 104, STEP = 960 / (WIN - 1), AMP = 120, MIDY = 300;
  const played = document.getElementById("played"), ahead = document.getElementById("ahead"), clock = document.getElementById("clock");
  function renderAt(t) {
    const off = t * 128, i0 = Math.floor(off), frac = off - i0;
    let pts = "";
    for (let k = -1; k <= WIN + 1; k++) {
      const idx = Math.max(0, Math.min(N - 1, i0 + k));
      pts += (X0 + (k - frac) * STEP).toFixed(1) + "," + (MIDY - samples[idx] * AMP).toFixed(1) + " ";
    }
    played.setAttribute("points", pts); ahead.setAttribute("points", pts);
    const s = 12 + t; clock.textContent = "0:" + Math.floor(s) + "." + Math.floor((s % 1) * 10) + " / 0:48";
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 3 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  // The playhead dot pulses on the loud passages so the marker itself is alive, not just the scroll.
  tl.fromTo("#headdot", { attr: { r: 9 } }, { attr: { r: 13 }, duration: 0.3, ease: "power2.inOut", yoyo: true, repeat: 7 }, 0.3);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
