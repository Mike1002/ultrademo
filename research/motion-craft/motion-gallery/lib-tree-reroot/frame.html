<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-tree-reroot</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .link { stroke: #1d1c1a; stroke-width: 2.5; fill: none; }
  .lvl { stroke: #e3ded2; stroke-width: 2; stroke-dasharray: 6 8; }
  .shape { stroke: #1d1c1a; stroke-width: 2.5; }
  .ring { fill: none; stroke: #f2c200; stroke-width: 5; }
  .nm { font-size: 20px; font-weight: 700; fill: #1d1c1a; text-anchor: middle; }
  .ini { font-size: 17px; font-weight: 700; fill: #1d1c1a; text-anchor: middle; }
  .title { font-size: 34px; font-weight: 700; fill: #1d1c1a; }
  .lab { font-size: 13px; letter-spacing: .06em; fill: #6d6a63; }
  .node { will-change: transform; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <text class="title" x="60" y="56">Re-root on Sam Kim</text>
        <text class="lab" x="60" y="84">SAME LINKS · NEW CENTRE</text>
        <g id="levels"></g>
        <g id="links"></g>
        <g id="nodes"></g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Tree re-rooting</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const SVGNS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, cls) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (cls) e.setAttribute("class", cls); return e; };
  // Every node has a position in layout A (root Jamie) and layout B (root Sam). Links are the same six edges in both.
  const N = {
    jamie:  { name: "Jamie Dalton", pill: true, a: [584, 150], b: [840, 270] },
    sam:    { name: "Sam Kim",      pill: true, a: [390, 270], b: [584, 150] },
    morgan: { name: "Morgan Lee",   pill: true, a: [778, 270], b: [840, 390] },
    ar: { name: "AR", a: [300, 390], b: [300, 270] }, pt: { name: "PT", a: [480, 390], b: [470, 270] },
    ln: { name: "LN", a: [688, 390], b: [750, 510] }, ko: { name: "KO", a: [868, 390], b: [930, 510] }
  };
  const E = [["jamie","sam"],["jamie","morgan"],["sam","ar"],["sam","pt"],["morgan","ln"],["morgan","ko"]];
  const levels = document.getElementById("levels"), linksG = document.getElementById("links"), nodesG = document.getElementById("nodes");
  [150, 270, 390, 510].forEach((y, i) => { levels.appendChild(el("line", { x1: 60, y1: y, x2: 1108, y2: y }, "lvl")); const t = el("text", { x: 1108, y: y - 10 }, "lab"); t.setAttribute("text-anchor", "end"); t.textContent = i === 0 ? "ROOT" : "LEVEL " + i; levels.appendChild(t); });
  const lines = E.map(([u, v]) => { const l = el("line", { x1: N[u].a[0], y1: N[u].a[1], x2: N[v].a[0], y2: N[v].a[1] }, "link"); linksG.appendChild(l); return l; });
  const shapes = {}, groups = {};
  for (const id in N) { const n = N[id], [x, y] = n.a, g = el("g", {}, "node");
    const s = n.pill ? el("rect", { x: x - 78, y: y - 26, width: 156, height: 52, rx: 26 }, "shape") : el("circle", { cx: x, cy: y, r: 26 }, "shape");
    s.style.fill = id === "jamie" ? "#f2c200" : "#fffdf8"; g.appendChild(s);
    const t = el("text", { x, y: y + (n.pill ? 7 : 6) }, n.pill ? "nm" : "ini"); t.textContent = n.name; g.appendChild(t);
    nodesG.appendChild(g); shapes[id] = s; groups[id] = g; }
  const ring = el("rect", { x: N.sam.a[0] - 86, y: N.sam.a[1] - 34, width: 172, height: 68, rx: 34 }, "ring"); groups.sam.insertBefore(ring, groups.sam.firstChild);
  ring.setAttribute("data-layout-allow-overlap", "");

  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 0.9 } });
  const D = 0.9, FADE = 0.25;
  // Selection ring appears on Sam at 0.2 s.
  tl.fromTo(ring, { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: FADE, ease: "power2.out" }, 0.2);
  // Re-root at 0.5 s: every node and link endpoint glides to layout B; the root colour hands over midway.
  for (const id in N) tl.fromTo(groups[id], { x: 0, y: 0 }, { x: N[id].b[0] - N[id].a[0], y: N[id].b[1] - N[id].a[1], duration: D }, 0.5);
  E.forEach(([u, v], i) => tl.fromTo(lines[i], { attr: { x1: N[u].a[0], y1: N[u].a[1], x2: N[v].a[0], y2: N[v].a[1] } }, { attr: { x1: N[u].b[0], y1: N[u].b[1], x2: N[v].b[0], y2: N[v].b[1] }, duration: D }, 0.5));
  tl.fromTo(shapes.jamie, { fill: "#f2c200" }, { fill: "#fffdf8", duration: 0.3, ease: "none" }, 0.8);
  tl.fromTo(shapes.sam, { fill: "#fffdf8" }, { fill: "#f2c200", duration: 0.3, ease: "none" }, 0.8);
  tl.to(ring, { opacity: 0, duration: FADE, ease: "none" }, 1.1);
  // Second beat at 2.2 s: re-root back on Jamie so the pair reads both ways.
  for (const id in N) tl.to(groups[id], { x: 0, y: 0, duration: 0.8 }, 2.2);
  E.forEach(([u, v], i) => tl.to(lines[i], { attr: { x1: N[u].a[0], y1: N[u].a[1], x2: N[v].a[0], y2: N[v].a[1] }, duration: 0.8 }, 2.2));
  tl.to(shapes.jamie, { fill: "#f2c200", duration: 0.3, ease: "none" }, 2.45);
  tl.to(shapes.sam, { fill: "#fffdf8", duration: 0.3, ease: "none" }, 2.45);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
