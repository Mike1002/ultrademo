<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-chart-filter-fade</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #cap { position: absolute; left: 160px; top: 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .grid { stroke: #e3ded2; stroke-width: 2; }
  .axis { stroke: #1d1c1a; stroke-width: 2; }
  .tx { font-size: 16px; fill: #6d6a63; }
  .ax { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; fill: #6d6a63; }
  .dot { fill: #ece7da; stroke: #1d1c1a; stroke-width: 2; }
  .dot.ok { fill: #1d1c1a; }
  #chips rect.frame { fill: #fffdf8; stroke: #1d1c1a; stroke-width: 2; }
  #active { fill: #f2c200; stroke: #1d1c1a; stroke-width: 2; }
  #chips text { font-size: 18px; font-weight: 700; fill: #1d1c1a; }
  #count { font-size: 34px; font-weight: 700; fill: #1d1c1a; font-variant-numeric: tabular-nums; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="cap">Invited · Accepted</div>
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <g id="chips">
          <rect class="frame" x="160" y="36" width="440" height="48" rx="24"/>
          <rect id="active" x="164" y="40" width="140" height="40" rx="20"/>
          <text x="234" y="67" text-anchor="middle">All</text>
          <text x="380" y="67" text-anchor="middle">Accepted</text>
          <text x="526" y="67" text-anchor="middle">This week</text>
        </g>
        <text id="c0" class="count" x="1080" y="72" text-anchor="end" font-size="34" font-weight="700" fill="#1d1c1a">30 invites</text>
        <text id="c1" class="count" x="1080" y="72" text-anchor="end" font-size="34" font-weight="700" fill="#1d1c1a" opacity="0">18 accepted</text>
        <text id="c2" class="count" x="1080" y="72" text-anchor="end" font-size="34" font-weight="700" fill="#1d1c1a" opacity="0">11 this week</text>
        <g id="grid"></g>
        <line class="axis" x1="160" y1="120" x2="160" y2="520"/>
        <line class="axis" x1="160" y1="520" x2="1080" y2="520"/>
        <text class="ax" x="620" y="556" text-anchor="middle">Days since invite</text>
        <text class="ax" x="166" y="112">Seats used</text>
        <g id="dots"></g>
      </svg>
    </div>
    <div id="label"><span class="l-name">Chart filter fade</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const SVG = "http://www.w3.org/2000/svg";
  const X = d => 160 + d * (920 / 30), Y = s => 520 - s * 40;
  const grid = document.getElementById("grid"), dotsG = document.getElementById("dots");
  const mk = (tag, cls, a, parent) => { const e = document.createElementNS(SVG, tag); if (cls) e.setAttribute("class", cls); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
  [2, 4, 6, 8, 10].forEach(s => { mk("line", "grid", { x1: 160, x2: 1080, y1: Y(s), y2: Y(s) }, grid); const t = mk("text", "tx", { x: 140, y: Y(s) + 5, "text-anchor": "end" }, grid); t.textContent = s; });
  [0, 10, 20, 30].forEach(d => { const t = mk("text", "tx", { x: X(d), y: 544, "text-anchor": "middle" }, grid); t.textContent = d; });
  // 30 invites with seeded positions and two baked conditions: accepted (18) and sent this week (11; days < 7).
  const r = rand(30), dots = [];
  for (let i = 0; i < 30; i++) {
    const days = i < 11 ? r() * 6.5 + 0.3 : 7.5 + r() * 22, seats = 0.4 + r() * 9.4;
    const accepted = i % 5 !== 1 && i % 7 !== 3;   // 18 of 30
    const el = mk("circle", "dot" + (accepted ? " ok" : ""), { cx: X(days), cy: Y(seats), r: 11 }, dotsG);
    dots.push({ el, accepted, week: days < 7 });
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.35 } });
  const F1 = 0.5, F2 = 1.8, OUT = 0.08;
  // Filter 1 ("Accepted"): marks outside the condition fade to a trace; the chart's axes and positions never move.
  dots.forEach(d => tl.fromTo(d.el, { opacity: 1 }, { opacity: d.accepted ? 1 : OUT, duration: 0.35 }, F1));
  tl.fromTo("#active", { x: 0 }, { x: 146, duration: 0.3, ease: "power2.inOut" }, F1 - 0.1);
  tl.fromTo("#c0", { opacity: 1 }, { opacity: 0, duration: 0.2 }, F1);
  tl.fromTo("#c1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, F1 + 0.15);
  // Filter 2 ("This week"): a different condition, so some faded marks come back and some visible ones fade out.
  dots.forEach(d => tl.fromTo(d.el, { opacity: d.accepted ? 1 : OUT }, { opacity: d.week ? 1 : OUT, duration: 0.35, immediateRender: false }, F2));
  tl.fromTo("#active", { x: 146 }, { x: 292, duration: 0.3, ease: "power2.inOut", immediateRender: false }, F2 - 0.1);
  tl.fromTo("#c1", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, F2);
  tl.fromTo("#c2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, F2 + 0.15);
  // Settle: the kept marks swell once so the final state is not a freeze.
  dots.forEach(d => { if (d.week) tl.fromTo(d.el, { attr: { r: 11 } }, { attr: { r: 14 }, duration: 0.25, ease: "power2.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.4); });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
