<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>split-tilt-cards</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  /* perspective lives on the scene root (REQUIRED); preserve-3d on the stage and both cards */
  #scene { display: grid; place-items: center; perspective: 1400px; }
  .split-stage { display: flex; gap: 70px; transform-style: preserve-3d; }
  .card { width: 440px; height: 340px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; padding: 40px 36px;
    transform-style: preserve-3d; will-change: transform; }
  /* shadow falls with the facing direction: left card faces right -> shadow right, mirrored on the right card */
  .card-left { box-shadow: 28px 24px 60px rgba(29, 28, 26, 0.22); }
  .card-right { box-shadow: -28px 24px 60px rgba(29, 28, 26, 0.22); }
  .card-eyebrow { display: inline-block; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6d6a63;
    padding: 6px 14px; border-radius: 999px; border: 2px solid #e3ded2; margin-bottom: 26px; }
  .card-right .card-eyebrow { background: #f2c200; color: #1d1c1a; border-color: #1d1c1a; }
  .card-headline { font-size: 60px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin-bottom: 22px; }
  .card-body { font-size: 22px; color: #6d6a63; line-height: 1.35; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="split-stage">
      <div class="card card-left" id="card-left">
        <div class="card-eyebrow">Before</div>
        <div class="card-headline">4 hours</div>
        <div class="card-body">One demo, cut by hand, stale by the next release.</div>
      </div>
      <div class="card card-right" id="card-right">
        <div class="card-eyebrow">After</div>
        <div class="card-headline">4 minutes</div>
        <div class="card-body">Every frame is code. Re-run when the UI ships.</div>
      </div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const TILT = 14, TILT_OVERSHOOT = 8, ENTRY_SLIDE_DIST = 240, ENTRY_DUR = 0.9, LEFT_AT = 0.1, RIGHT_AT = 0.25;
  const FLOAT_AMP = 6, FLOAT_DURATION = 2.4, IDLE_START = 1.2, COPY_REVEAL_AT = 0.55, COPY_RISE = 18, COPY_STAGGER = 0.08, COPY_DUR = 0.5;
  // entry: from outside, opposing tilts settle with a small pivot
  tl.fromTo("#card-left", { x: -ENTRY_SLIDE_DIST, rotateY: TILT + TILT_OVERSHOOT, opacity: 0 },
    { x: 0, rotateY: TILT, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" }, LEFT_AT);
  tl.fromTo("#card-right", { x: ENTRY_SLIDE_DIST, rotateY: -TILT - TILT_OVERSHOOT, opacity: 0 },
    { x: 0, rotateY: -TILT, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" }, RIGHT_AT);
  // counter-phase idle bob: opposite signs at the same position
  tl.to("#card-left", { y: -FLOAT_AMP, duration: FLOAT_DURATION / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, IDLE_START);
  tl.to("#card-right", { y: FLOAT_AMP, duration: FLOAT_DURATION / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, IDLE_START);
  // copy fades up during the settle, not after
  tl.fromTo(".card-eyebrow, .card-headline, .card-body", { opacity: 0, y: COPY_RISE },
    { opacity: 1, y: 0, stagger: COPY_STAGGER, duration: COPY_DUR, ease: "power2.out" }, COPY_REVEAL_AT);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
