<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>viewport-change</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  /* background on the scene, never on the world */
  .clip { position: absolute; inset: 0; overflow: hidden; background: #f6f3ec; }
  .world { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#d9d3c4 2px, transparent 2.5px); background-size: 64px 64px; background-position: 32px 32px; }
  .card { position: absolute; left: 120px; top: 120px; width: 1040px; height: 480px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  .hero { position: absolute; left: 56px; top: 56px; font-size: 60px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .tag { position: absolute; left: 56px; top: 140px; font-size: 22px; color: #6d6a63; }
  .num { position: absolute; left: 56px; top: 200px; font-size: 128px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .hair { position: absolute; left: 56px; top: 356px; width: 928px; height: 2px; background: #e3ded2; }
  .cta-row { position: absolute; left: 56px; top: 384px; font-size: 22px; color: #6d6a63; line-height: 60px; }
  .cta { position: absolute; left: 784px; top: 384px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; color: #1d1c1a;
    font-size: 22px; font-weight: 700; display: grid; place-items: center; will-change: transform; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="world" id="world">
      <div class="dots"></div>
      <div class="card" id="card">
        <div class="hero">Every frame is code</div>
        <div class="tag">Re-run the video when the UI ships</div>
        <div class="num">1,284</div>
        <div class="hair"></div>
        <div class="cta-row">Ready when you are</div>
        <div class="cta" id="cta">Continue</div>
      </div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const world = document.getElementById("world");
  const VIEWPORT_WIDTH = 1280, VIEWPORT_HEIGHT = 720;
  // Camera state: the single source of truth, written in ONE place.
  const cam = { scale: 1, x: 0, y: 0 };
  function applyCamera() { world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`; }
  applyCamera(); // seed frame 0
  // Measure the target's offset from viewport centre at neutral camera (single-scene, build time).
  const r = document.getElementById("cta").getBoundingClientRect();
  const TARGET_OFFSET_X = r.left + r.width / 2 - VIEWPORT_WIDTH / 2;
  const TARGET_OFFSET_Y = r.top + r.height / 2 - VIEWPORT_HEIGHT / 2;
  const TARGET_SCALE = 2.0, ZOOM_START = 0.45, ZOOM_DUR = 1.3;
  // Single-wrapper composite transform: T = -offset x S.
  const counterX = -TARGET_OFFSET_X * TARGET_SCALE;
  const counterY = -TARGET_OFFSET_Y * TARGET_SCALE;
  tl.fromTo(cam, { scale: 1, x: 0, y: 0 }, { scale: TARGET_SCALE, x: counterX, y: counterY, duration: ZOOM_DUR, ease: "power3.inOut", onUpdate: applyCamera }, ZOOM_START);
  // Dwell beat on the focal point (not a camera move): the button presses once.
  tl.fromTo("#cta", { scale: 1 }, { scale: 0.94, duration: 0.12, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, 2.25);
  // Seek safety: re-apply the camera after every render so seeks without ticks land the same pose.
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); applyCamera(); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
