<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-cursor-follow</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #card { position: absolute; left: 164px; top: 40px; width: 840px; height: 500px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  #card .lab { position: absolute; left: 48px; top: 40px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #card h1 { position: absolute; left: 48px; top: 66px; font-size: 44px; font-weight: 700; line-height: 52px; white-space: nowrap; }
  #card .sub { position: absolute; left: 48px; top: 128px; font-size: 20px; color: #6d6a63; white-space: nowrap; }
  .row { position: absolute; left: 48px; width: 744px; height: 64px; border-top: 2px solid #e3ded2; }
  .row .av { position: absolute; left: 0; top: 14px; width: 36px; height: 36px; border-radius: 50%; background: #ece7da; border: 2px solid #1d1c1a; }
  .row .nm { position: absolute; left: 54px; top: 18px; font-size: 20px; font-weight: 600; white-space: nowrap; }
  .row .rl { position: absolute; right: 0; top: 20px; font-size: 16px; color: #6d6a63; white-space: nowrap; }
  #btn { position: absolute; left: 592px; top: 396px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  /* follower: a yellow ring centred on the pointer tip plus a name tag; lags the pointer by 150 ms with an overshoot */
  #fol { position: absolute; left: -20px; top: -20px; width: 220px; height: 44px; will-change: transform; pointer-events: none; }
  #ring { position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; background: rgba(242,194,0,0.35); border: 3px solid #f2c200; }
  #tag { position: absolute; left: 46px; top: 6px; height: 30px; line-height: 26px; padding: 0 12px; border-radius: 15px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 15px; font-weight: 700; white-space: nowrap; }
  /* cursor: 28x38 arrow, tip at (0,0) of the box; GSAP x/y move it. */
  .cursor { position: absolute; left: 0; top: 0; width: 28px; height: 38px; z-index: 10; pointer-events: none;
    transform-origin: 2px 2px; will-change: transform; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
  .cursor svg { width: 28px; height: 38px; display: block; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="card">
        <div class="lab" data-layout-allow-occlusion>Orbit</div>
        <h1 data-layout-allow-occlusion>Invite your team</h1>
        <div class="sub" data-layout-allow-occlusion>3 seats left on this plan</div>
        <div class="row" style="top:184px"><div class="av"></div><div class="nm" data-layout-allow-occlusion>Jamie Dalton</div><div class="rl" data-layout-allow-occlusion>Owner</div></div>
        <div class="row" style="top:248px"><div class="av"></div><div class="nm" data-layout-allow-occlusion>Sam Kim</div><div class="rl" data-layout-allow-occlusion>Admin</div></div>
        <div class="row" style="top:312px"><div class="av"></div><div class="nm" data-layout-allow-occlusion>Morgan Lee</div><div class="rl" data-layout-allow-occlusion>Member</div></div>
        <div id="btn" data-layout-allow-occlusion>Continue</div>
      </div>
      <div id="fol" data-layout-allow-overlap data-layout-allow-overflow>
        <div id="ring" data-layout-allow-overlap></div>
        <div id="tag" data-layout-allow-overlap>Jamie Dalton</div>
      </div>
      <div class="cursor" id="cur" data-layout-allow-overlap>
        <svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="label"><span class="l-name">Cursor follow</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.5 } });
  // Params: follower lag 150 ms, power2.out on the pointer; the follower uses a back ease so it overshoots at each turn.
  const P = [[150, 120], [760, 170], [560, 420], [900, 400], [930, 420]];
  const AT = [0.3, 1.0, 1.8, 2.65];           // start of each pointer move
  const DUR = [0.5, 0.5, 0.55, 0.3];
  const LAG = 0.15;
  tl.fromTo("#cur", { x: P[0][0], y: P[0][1] }, { x: P[0][0], y: P[0][1], duration: 0.01, ease: "none" }, 0);
  tl.fromTo("#fol", { x: P[0][0], y: P[0][1] }, { x: P[0][0], y: P[0][1], duration: 0.01, ease: "none" }, 0);
  for (let i = 0; i < AT.length; i++) {
    tl.to("#cur", { x: P[i + 1][0], y: P[i + 1][1], duration: DUR[i], ease: "power2.out" }, AT[i]);
    tl.to("#fol", { x: P[i + 1][0], y: P[i + 1][1], duration: DUR[i] + 0.1, ease: "back.out(1.7)" }, AT[i] + LAG);
  }
  window.__timelines["main"] = tl;
</script>
</body>
</html>
