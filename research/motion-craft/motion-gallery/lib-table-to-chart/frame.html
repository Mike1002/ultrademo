<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-table-to-chart</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #chart text { font-size: 24px; fill: #1d1c1a; font-variant-numeric: tabular-nums; }
  #chart .small { font-size: 13px; fill: #6d6a63; letter-spacing: .06em; }
  #chart .val { font-weight: 700; }
  #chart .grid { stroke: #e3ded2; stroke-width: 2; }
  #chart .axis { stroke: #1d1c1a; stroke-width: 2; }
  .heading { position: absolute; left: 32px; top: 26px; font-size: 34px; font-weight: 700; }
  .sub { position: absolute; left: 34px; top: 72px; font-size: 16px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="heading">The difference shows before the numbers do</div>
      <div class="sub">Next action · share of 12,480 sessions</div>
      <svg id="chart" viewBox="0 0 1168 580" xmlns="http://www.w3.org/2000/svg">
        <text class="small" x="110" y="175">ACTION</text>
        <text id="col" class="small" x="380" y="175">SHARE</text>
        <line class="axis" x1="100" y1="195" x2="1000" y2="195"/>
        <line class="grid rule" x1="100" y1="278" x2="1000" y2="278"/>
        <text x="110" y="253">Invite</text><rect id="hl0" x="366" y="226" width="78" height="38" rx="6" fill="#fbf3cf"/>
        <rect id="mark0" x="370" y="228" width="0" height="34" rx="4" fill="#f2c200" stroke="#1d1c1a" stroke-width="2"/><text id="value0" class="val" x="380" y="253">62%</text>
        <line class="grid rule" x1="100" y1="350" x2="1000" y2="350"/>
        <text x="110" y="325">Share</text><rect id="mark1" x="370" y="300" width="0" height="34" rx="4" fill="#1d1c1a"/><text id="value1" class="val" x="380" y="325">21%</text>
        <line class="grid rule" x1="100" y1="422" x2="1000" y2="422"/>
        <text x="110" y="397">Export</text><rect id="mark2" x="370" y="372" width="0" height="34" rx="4" fill="#1d1c1a"/><text id="value2" class="val" x="380" y="397">9%</text>
        <line class="grid rule" x1="100" y1="494" x2="1000" y2="494"/>
        <text x="110" y="469">Search</text><rect id="mark3" x="370" y="444" width="0" height="34" rx="4" fill="#1d1c1a"/><text id="value3" class="val" x="380" y="469">8%</text>
        <line id="baseline" class="axis" x1="300" y1="500" x2="900" y2="500" pathLength="1"/>
      </svg>
    </div>
    <div id="label"><span class="l-name">Table-to-chart transition</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  const values = [62, 21, 9, 8];
  // 1. The leading value is highlighted. 2. A small mark grows beside each value. 3. Marks stretch to bar length and the numbers ride to the tips.
  tl.fromTo("#hl0", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.25);
  values.forEach((v, i) => {
    tl.fromTo("#mark" + i, { attr: { width: 0 } }, { attr: { width: 32 }, duration: 0.45 }, 0.5 + i * 0.06);
    tl.to("#mark" + i, { attr: { x: 300, width: v * 9 }, duration: 0.85, ease: "power2.inOut" }, 1.15);
    tl.fromTo("#value" + i, { attr: { x: 380 } }, { attr: { x: 314 + v * 9 }, duration: 0.85, ease: "power2.inOut" }, 1.15);
  });
  tl.to("#hl0", { opacity: 0, duration: 0.3 }, 1.15);
  tl.fromTo(".rule", { opacity: 1 }, { opacity: 0.35, duration: 0.5 }, 1.15);
  tl.fromTo("#col", { attr: { x: 380 } }, { attr: { x: 300 }, duration: 0.85, ease: "power2.inOut" }, 1.15);
  // Second beat: a chart baseline draws in under the new bars.
  tl.fromTo("#baseline", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, autoRound: false, duration: 0.6, ease: "power2.out" }, 2.1);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
