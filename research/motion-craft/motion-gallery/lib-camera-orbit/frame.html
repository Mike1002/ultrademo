<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-camera-orbit</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #171a21; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #171a21; color: #ece8df;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #cam { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; perspective: 1200px; perspective-origin: 50% 45%; }
  #tilt { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; transform-style: preserve-3d; transform-origin: 584px 300px; transform: rotateX(20deg); }
  #orbit { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; transform-style: preserve-3d; transform-origin: 584px 300px; will-change: transform; }
  #floor { position: absolute; left: -216px; top: -370px; width: 1600px; height: 1600px; transform-origin: 50% 50%; transform: translateY(330px) rotateX(90deg);
    background-image: linear-gradient(#2a2f3a 1px, transparent 1px), linear-gradient(90deg, #2a2f3a 1px, transparent 1px); background-size: 80px 80px; background-position: 40px 40px; }
  .card { position: absolute; left: 304px; top: 120px; width: 560px; height: 330px; background: #1f232c; border: 2px solid #ece8df; border-radius: 22px; transform-style: preserve-3d; }
  .card.back { background: #0f1218; border-color: #6d7380; transform: translateZ(-28px); }
  .card .lab { position: absolute; left: 44px; top: 38px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #a7adbb; white-space: nowrap; }
  .card h1 { position: absolute; left: 44px; top: 66px; font-size: 54px; font-weight: 700; line-height: 62px; white-space: nowrap; }
  .card .sub { position: absolute; left: 44px; top: 142px; font-size: 22px; color: #a7adbb; white-space: nowrap; }
  .card .btn { position: absolute; left: 44px; top: 222px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a; color: #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  .dot { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #6d7380; }
  .dot.v { background: #f2c200; border: 2px solid #ece8df; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #a7adbb; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #ece8df; font-weight: 700; }
  #label .l-sep { color: #6d7380; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="cam" data-layout-allow-overflow><div id="tilt" data-layout-allow-overflow data-layout-allow-overlap><div id="orbit" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="floor" data-layout-allow-overlap data-layout-allow-overflow></div>
        <div class="dot" style="left:120px;top:80px;transform:translateZ(-420px)" data-layout-allow-overlap></div>
        <div class="dot v" style="left:980px;top:60px;transform:translateZ(-520px)" data-layout-allow-overlap></div>
        <div class="dot" style="left:1040px;top:300px;transform:translateZ(-300px)" data-layout-allow-overlap></div>
        <div class="dot" style="left:60px;top:330px;transform:translateZ(-240px)" data-layout-allow-overlap></div>
        <div class="dot v" style="left:560px;top:30px;transform:translateZ(-640px)" data-layout-allow-overlap></div>
        <div class="dot" style="left:880px;top:480px;transform:translateZ(160px)" data-layout-allow-overlap></div>
        <div class="card back" data-layout-allow-overlap></div>
        <div class="card" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div>
          <h1 data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</h1>
          <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left on this plan</div>
          <div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div>
        </div>
      </div></div></div>
    </div>
    <div id="label"><span class="l-name">Camera orbit</span><span class="l-sep">·</span><span>Camera</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 0.6 } });
  // The camera sits 20 degrees above the floor (a static tilt wrapper) and orbits 60 degrees around the card (rotationY on the preserve-3d world),
  // holds on the three-quarter view, then swings back. Dots at different depths change their relationship to the card as it turns.
  tl.fromTo("#orbit", { rotationY: 0 }, { rotationY: -60, duration: 1.4, ease: "power2.inOut" }, 0.15);
  tl.to("#orbit", { rotationY: 0, duration: 1.1, ease: "power2.inOut" }, 1.85);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
