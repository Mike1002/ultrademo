<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-letter-anagram-shift</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #word { position: absolute; left: 0; top: 56px; width: 1168px; height: 128px; display: flex; justify-content: center; font-size: 128px; line-height: 128px; font-weight: 700; letter-spacing: 0.04em; }
  #word .g { display: block; height: 128px; line-height: 128px; will-change: transform; }
  #list { position: absolute; left: 460px; top: 236px; }
  .row { position: relative; height: 64px; font-size: 44px; line-height: 44px; font-weight: 700; white-space: nowrap; display: flex; }
  .row .ini { display: block; height: 44px; line-height: 44px; opacity: 0; }
  .row .rest { display: block; height: 44px; line-height: 44px; will-change: transform; }
  #hl { position: absolute; left: 460px; top: 473px; width: 128px; height: 10px; background: #f2c200; border-radius: 6px; will-change: transform; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="hl" data-layout-allow-overlap></div>
      <div id="word" data-layout-allow-overlap>
        <div class="g" id="g0" data-layout-allow-overlap>O</div><div class="g" id="g1" data-layout-allow-overlap>R</div><div class="g" id="g2" data-layout-allow-overlap>B</div><div class="g" id="g3" data-layout-allow-overlap>I</div><div class="g" id="g4" data-layout-allow-overlap>T</div>
      </div>
      <div id="list">
        <div class="row"><div class="ini" id="i0">O</div><div class="rest" id="r0">nboard</div></div>
        <div class="row"><div class="ini" id="i1">R</div><div class="rest" id="r1">eview</div></div>
        <div class="row"><div class="ini" id="i2">B</div><div class="rest" id="r2">uild</div></div>
        <div class="row"><div class="ini" id="i3">I</div><div class="rest" id="r3">nvite</div></div>
        <div class="row"><div class="ini" id="i4">T</div><div class="rest" id="r4">rack</div></div>
      </div>
    </div>
    <div id="label"><span class="l-name">Letter anagram shift</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // Params: travel 0.8 s power3.inOut, 40 ms apart, 0.35 s wait after arrival, then the rest of each word fades in.
  // Start and end boxes are measured once at build time and baked into fromTo tweens (x, y and a 128 -> 44 px scale about the top-left).
  const SCALE = 44 / 128;
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.inOut", duration: 0.8 } });
  for (let i = 0; i < 5; i++) {
    const g = document.getElementById("g" + i), d = document.getElementById("i" + i);
    const a = g.getBoundingClientRect(), b = d.getBoundingClientRect();
    tl.fromTo(g, { x: 0, y: 0, scale: 1, transformOrigin: "0% 0%" },
      { x: b.left - a.left, y: b.top - a.top, scale: SCALE, duration: 0.8, ease: "power3.inOut" }, 0.2 + i * 0.04);
    tl.fromTo("#r" + i, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 1.55 + i * 0.07);
  }
  // second beat: the list is a list now; a yellow bar underlines one item
  tl.fromTo("#hl", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 2.35);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
