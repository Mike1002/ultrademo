<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-edge-trace-transition</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #paper { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; background: #fffdf8; will-change: opacity; }
  .card { position: absolute; left: 264px; top: 110px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, opacity; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card .h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  .card.b .h1 { font-size: 96px; line-height: 104px; top: 74px; font-variant-numeric: tabular-nums; }
  .card.b .sub { top: 190px; }
  /* the edge-trace copy: surfaces gone, only 1.5 px ink lines remain */
  .card.edge { background: transparent; border-width: 1.5px; }
  .card.edge .lab, .card.edge .h1, .card.edge .sub, .card.edge .btn { color: #fffdf8; -webkit-text-stroke: 1.2px #1d1c1a; }
  .card.edge .lab, .card.edge .sub { -webkit-text-stroke: 0.8px #1d1c1a; }
  .card.edge .btn { background: transparent; border-width: 1.5px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="paper" data-layout-allow-overlap></div>
      <div class="card" id="a" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div>
        <div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left on this plan</div>
        <div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div>
      </div>
      <div class="card edge" id="ae" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div>
        <div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left on this plan</div>
        <div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div>
      </div>
      <div class="card b edge" id="be" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>This month</div>
        <div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div>
      </div>
      <div class="card b" id="b" data-layout-allow-overlap>
        <div class="lab" data-layout-allow-overlap data-layout-allow-occlusion>This month</div>
        <div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div>
        <div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div>
      </div>
    </div>
    <div id="label"><span class="l-name">Edge trace transition</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>calm</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut", duration: 0.6 } });
  // Rest: A filled; the line-drawing copies and B hidden; paper ground hidden.
  tl.fromTo("#a", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
  tl.fromTo("#ae", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#be", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#b", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#paper", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  // Trace: from 0.3 s the surfaces of A fade away over 0.8 s and only its edges remain, on white paper.
  tl.to("#ae", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 0.3);
  tl.to("#a", { opacity: 0, duration: 0.8, ease: "power2.inOut" }, 0.3);
  tl.to("#paper", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 0.3);
  // Hold the drawing for 0.6 s, then the lines redraw as the next scene's skeleton...
  tl.to("#ae", { opacity: 0, duration: 0.25, ease: "power1.inOut" }, 1.7);
  tl.to("#be", { opacity: 1, duration: 0.25, ease: "power1.inOut" }, 1.7);
  // ...and B fills back in over 0.8 s as the paper gives way to the ground.
  tl.to("#b", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 2.0);
  tl.to("#be", { opacity: 0, duration: 0.8, ease: "power2.inOut" }, 2.0);
  tl.to("#paper", { opacity: 0, duration: 0.8, ease: "power2.inOut" }, 2.0);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
