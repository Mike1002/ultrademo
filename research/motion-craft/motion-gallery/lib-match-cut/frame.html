<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-match-cut</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; will-change: transform; }
  .shot.a { background: #f6f3ec; }
  .shot.b { background: #ece7da; }
  .card { position: absolute; left: 324px; top: 120px; width: 520px; height: 330px; background: #fffdf8;
    border: 2px solid #1d1c1a; border-radius: 22px; }
  .card .h { position: absolute; left: 44px; top: 46px; font-size: 44px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .card .s { position: absolute; left: 44px; top: 112px; font-size: 20px; color: #6d6a63; white-space: nowrap; }
  .card .btn { position: absolute; left: 44px; top: 204px; width: 200px; height: 60px; background: #f2c200;
    border: 2px solid #1d1c1a; border-radius: 14px; font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; }
  .big { position: absolute; left: 0; width: 1168px; top: 150px; text-align: center; font-size: 132px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; will-change: transform; }
  .big-l { position: absolute; left: 0; width: 1168px; top: 300px; text-align: center; font-size: 22px; color: #6d6a63; }
  .names { position: absolute; left: 0; width: 1168px; top: 372px; height: 56px; display: flex; justify-content: center; gap: 24px; }
  .name { width: 190px; height: 50px; line-height: 46px; text-align: center; border: 2px solid #1d1c1a; border-radius: 999px;
    font-size: 20px; background: #fffdf8; will-change: transform; }
  .lab { position: absolute; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
  .sent { position: absolute; left: 0; top: 290px; width: 536px; text-align: right; font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  .foot { left: 100px; top: 470px; }
  .focus { position: absolute; left: 544px; top: 298px; width: 48px; height: 48px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; will-change: transform; }
  #B { opacity: 0; background: #f6f3ec; }
  .chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .chart path { fill: none; stroke: #1d1c1a; stroke-width: 3; }
  .chart line { stroke: #e3ded2; stroke-width: 2; }
  .chart circle { fill: #a19d93; }
  .title { position: absolute; left: 100px; top: 70px; font-size: 56px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .value { position: absolute; left: 620px; top: 300px; font-size: 22px; color: #6d6a63; white-space: nowrap; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <section id="A" class="shot a"><div class="lab" style="left:100px;top:70px">Invite your team</div><div class="sent">3 seats left</div><div class="focus" id="period" data-layout-allow-overlap></div><div class="lab foot">Jamie Dalton · Sam Kim · Morgan Lee</div></section>
      <section id="B" class="shot b" data-layout-allow-overlap><div class="title">12,480 invites sent</div>
        <svg class="chart" viewBox="0 0 1168 580"><line x1="100" y1="470" x2="1068" y2="470"/><path id="line" d="M170 430 L370 380 L568 322 L780 240 L980 170"/><circle cx="170" cy="430" r="7"/><circle cx="370" cy="380" r="7"/><circle cx="780" cy="240" r="7"/><circle cx="980" cy="170" r="7"/></svg>
        <div class="focus" id="chartDot" data-layout-allow-overlap></div><div class="value" id="value">Sam Kim · 98%</div><div class="lab foot">invites by teammate</div></section>
    </div>
    <div id="label"><span class="l-name">Match cut</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // The sentence's yellow full stop grows to 48 px, then a hard cut: scene B's chart dot sits at the same centre and size.
  tl.fromTo("#period", { scale: 0.25 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 0.35);
  tl.set("#A", { opacity: 0 }, 1.15);
  tl.set("#B", { opacity: 1 }, 1.15);
  // After the cut the chart line draws from the dot outward and the readout appears.
  const len = document.getElementById("line").getTotalLength();
  tl.fromTo("#line", { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 1.15);
  tl.fromTo("#value", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4 }, 1.7);
  // Quiet second beat: the dot pulses once.
  tl.fromTo("#chartDot", { scale: 1 }, { scale: 1.14, duration: 0.3, ease: "sine.inOut" }, 2.3);
  tl.to("#chartDot", { scale: 1, duration: 0.4, ease: "sine.inOut" }, 2.6);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
