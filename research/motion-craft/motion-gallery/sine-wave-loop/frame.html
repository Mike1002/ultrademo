<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>sine-wave-loop</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  /* hero card 640x340 centred at (320,190); GSAP owns its transform (entry + idle via one writer) */
  .hero { position: absolute; left: 320px; top: 190px; width: 640px; height: 340px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform; }
  .line { position: absolute; left: 48px; top: 64px; font-size: 52px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .sub { position: absolute; left: 48px; top: 140px; font-size: 20px; color: #6d6a63; }
  .btn { position: absolute; left: 48px; top: 220px; width: 200px; height: 60px; border-radius: 14px; background: #e3ded2; color: #1d1c1a;
    font-size: 22px; font-weight: 700; display: grid; place-items: center; }
  /* badge: 64x64 yellow dot pinned to the card's top-right corner (its centre at (-8,-8) inside the card box) */
  .badge { position: absolute; left: 560px; top: -24px; width: 64px; height: 64px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a;
    display: grid; place-items: center; font-size: 22px; font-weight: 800; will-change: transform; }
  .caption { position: absolute; left: 0; top: 580px; width: 1280px; text-align: center; font-size: 20px; color: #6d6a63; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="hero" id="hero">
      <div class="line">Every frame is code</div>
      <div class="sub">Settled, then kept gently alive</div>
      <div class="btn">Continue</div>
      <div class="badge" id="badge">3</div>
    </div>
    <div class="caption">A held element breathes on a bounded sine, never a CSS loop</div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const hero = document.getElementById("hero"), badge = document.getElementById("badge");
  // Entry: a quick settle (0 -> 0.6 s). Idle begins after the settle, at phase 0 (sin(0)=0: no jump).
  const ENTRY_DUR = 0.6, IDLE_START_TIME = 0.7, TOTAL_DURATION = 3;
  const IDLE_DUR = TOTAL_DURATION - IDLE_START_TIME, PERIOD = 2.0, CYCLES = IDLE_DUR / PERIOD;
  // Amplitudes at the gated upper range (isolated hero, scene < 6 s) so the idle is visible in a 3 s preview.
  const Y_AMP_PX = 5, SCALE_AMP = 0.02, DOT_SCALE_AMP = 0.10;
  const entryEase = gsap.parseEase("back.out(1.4)");
  const entry = { k: 0 }, phase = { p: 0 };
  // One writer composes entry state + idle offset: idle ADDS to the resting transform, never replaces it.
  function write() {
    const e = entry.k; // 0 -> 1 across the entry
    const restY = (1 - e) * 40, restS = 0.96 + e * 0.04;
    const s = Math.sin(phase.p);
    hero.style.transform = `translateY(${restY + s * Y_AMP_PX}px) scale(${restS * (1 + s * SCALE_AMP)})`;
    badge.style.transform = `scale(${1 + Math.sin(phase.p + Math.PI / 2) * DOT_SCALE_AMP})`;
    hero.style.opacity = String(Math.min(1, e * 1.5));
  }
  write();
  tl.fromTo(entry, { k: 0 }, { k: 1, duration: ENTRY_DUR, ease: "back.out(1.4)", onUpdate: write }, 0.05);
  // onUpdate form: a linear phase tween; sine is the curve. One long tween fills the hold.
  tl.fromTo(phase, { p: 0 }, { p: Math.PI * 2 * CYCLES, duration: IDLE_DUR, ease: "none", onUpdate: write }, IDLE_START_TIME);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); write(); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
