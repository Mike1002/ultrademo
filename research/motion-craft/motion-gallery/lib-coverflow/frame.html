<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-coverflow</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #171a21; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #171a21; color: #ece8df;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #a7adbb; white-space: nowrap; }
  .num { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .t-xl { font-size: 84px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .t-l { font-size: 56px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .t-m { font-size: 34px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .t-body { font-size: 22px; line-height: 1.4; }
  .hair { height: 1px; background: #2a2f3a; }
  .dot { border-radius: 50%; background: #ece8df; }
  .dot.v { background: #f2c200; border: 2px solid #ece8df; }

  .space { position: absolute; inset: 0; perspective: 900px; }
  .card { position: absolute; left: 434px; top: 90px; width: 300px; height: 370px; background: #1f232c; border: 2px solid #ece8df; border-radius: 20px; padding: 25px; backface-visibility: hidden; will-change: transform; }
  .card .num { font-size: 150px; margin-top: 42px; }
  .card .t-m { position: absolute; left: 25px; bottom: 30px; }
  .mark { position: absolute; right: 25px; top: 25px; width: 22px; height: 22px; }
  .hint { position: absolute; left: 0; width: 1168px; top: 500px; text-align: center; }

  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #a7adbb; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #ece8df; font-weight: 700; }
  #label .l-sep { color: #6d7380; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">

      <div class="space"><section class="card" data-layout-allow-overlap data-layout-allow-occlusion><span class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Step 01</span><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>01</div><div class="t-m" data-layout-allow-overlap data-layout-allow-occlusion>Invite</div></section><section class="card" data-layout-allow-overlap data-layout-allow-occlusion><span class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Step 02</span><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>02</div><div class="t-m" data-layout-allow-overlap data-layout-allow-occlusion>Review</div></section><section class="card" data-layout-allow-overlap data-layout-allow-occlusion><span class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Step 03</span><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>03</div><div class="t-m" data-layout-allow-overlap data-layout-allow-occlusion>Seats</div></section><section class="card" data-layout-allow-overlap data-layout-allow-occlusion><span class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Step 04</span><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>04</div><div class="t-m" data-layout-allow-overlap data-layout-allow-occlusion>Launch day</div><div class="dot v mark"></div></section><section class="card" data-layout-allow-overlap data-layout-allow-occlusion><span class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Step 05</span><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>05</div><div class="t-m" data-layout-allow-overlap data-layout-allow-occlusion>Done</div></section></div>
      <div class="lab hint">The centre card faces front</div>

    </div>
    <div id="label"><span class="l-name">Coverflow</span><span class="l-sep">·</span><span>3D & Depth</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });

  // Coverflow: each card's pose is a function of its distance d from the focus: x d*285, z -|d|*155, yaw -sign(d)*45, scale down 0.1 per step.
  // The focus steps 1 -> 2 -> 3 -> 4 and every card tweens to its new pose.
  const cards = [...document.querySelectorAll(".card")];
  const pose = d => ({ x: d * 285, z: -Math.abs(d) * 155, rotationY: -Math.sign(d) * 45, scale: 1 - Math.min(0.3, Math.abs(d) * 0.1), zIndex: 10 - Math.abs(d) });
  cards.forEach((c, i) => gsap.set(c, pose(i - 1)));
  [2, 3, 4].forEach((focus, k) => cards.forEach((c, i) => {
    tl.fromTo(c, pose(i - focus + 1), { ...pose(i - focus), duration: 0.6, ease: "power2.inOut" }, 0.45 + k * 0.95);
  }));

  window.__timelines["main"] = tl;
</script>
</body>
</html>
