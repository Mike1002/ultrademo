<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-progressive-disclosure</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .heading { position: absolute; left: 90px; top: 60px; }
  .step { position: absolute; top: 145px; width: 270px; }
  .step .lab { margin-bottom: 28px; }
  .step .name { font-size: 72px; line-height: 80px; font-weight: 700; }
  .step .detail { margin-top: 30px; border-top: 1px solid #e3ded2; padding-top: 22px; font-size: 26px; line-height: 34px; }
  .arrow { position: absolute; top: 258px; width: 94px; height: 2px; background: #a19d93; transform-origin: 0 50%; will-change: transform; }
  .arrow .tip { position: absolute; right: 0; top: -5px; width: 10px; height: 10px; border-top: 2px solid #a19d93; border-right: 2px solid #a19d93; transform: rotate(45deg); }
  .ul { position: absolute; top: 240px; width: 150px; height: 6px; background: #f2c200; border-radius: 3px; transform-origin: 0 50%; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="lab heading">One stage at a time</div>
      <div class="step" id="input" style="left:90px"><div class="lab">01</div><div class="name">Draft</div><div class="detail">Invite your team</div></div>
      <div class="arrow" id="a1" style="left:325px"><div class="tip"></div></div>
      <div class="step" id="model" style="left:450px"><div class="lab">02</div><div class="name">Review</div><div class="detail">Sam Kim approves</div></div>
      <div class="arrow" id="a2" style="left:685px"><div class="tip"></div></div>
      <div class="step" id="output" style="left:810px"><div class="lab">03</div><div class="name">Live</div><div class="detail" id="od">3 seats filled</div></div>
      <div class="ul" id="ul" style="left:810px"></div>
    </div>
    <div id="label"><span class="l-name">Progressive disclosure</span><span class="l-sep">·</span><span>Explainer</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // All three stages start nearly invisible; each lights up in turn and the previous one dims to 0.25.
  tl.set(["#input", "#model", "#output"], { opacity: 0.12 }, 0);
  tl.set("#od", { opacity: 0 }, 0);
  tl.fromTo("#input", { opacity: 0.12 }, { opacity: 1, duration: 0.3 }, 0.3);
  tl.fromTo("#a1", { scaleX: 0 }, { scaleX: 1, duration: 0.3 }, 0.7);
  tl.to("#input", { opacity: 0.25, duration: 0.3 }, 1.0);
  tl.fromTo("#model", { opacity: 0.12 }, { opacity: 1, duration: 0.3 }, 1.0);
  tl.fromTo("#a2", { scaleX: 0 }, { scaleX: 1, duration: 0.3 }, 1.4);
  tl.to("#model", { opacity: 0.25, duration: 0.3 }, 1.7);
  tl.fromTo("#output", { opacity: 0.12 }, { opacity: 1, duration: 0.35 }, 1.7);
  // The active output gets the accent: a yellow underline draws, then its detail line appears.
  tl.fromTo("#ul", { scaleX: 0 }, { scaleX: 1, duration: 0.4 }, 2.05);
  tl.fromTo("#od", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 }, 2.3);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
