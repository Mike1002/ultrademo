<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>coordinate-target-zoom</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; overflow: hidden; }
  /* outer scales around its centre; inner translates. Both 1280x720, positioned with left/top only. */
  .zoom-outer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 50% 50%; will-change: transform; }
  .zoom-inner { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; will-change: transform; }
  .card { position: absolute; width: 340px; height: 300px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 22px; }
  .card .line { position: absolute; left: 32px; top: 36px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .card .num { position: absolute; left: 32px; top: 84px; font-size: 72px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .card .sub { position: absolute; left: 32px; top: 170px; font-size: 18px; color: #6d6a63; }
  .card .btn { position: absolute; left: 32px; top: 212px; width: 200px; height: 60px; border-radius: 14px; background: #e3ded2;
    color: #1d1c1a; font-size: 22px; font-weight: 700; display: grid; place-items: center; }
  .card.target .btn { background: #f2c200; }
  .ring { position: absolute; left: -12px; top: -12px; width: 364px; height: 324px; border-radius: 30px; border: 4px solid #f2c200; opacity: 0; will-change: transform; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="zoom-outer" id="zoom-outer">
      <div class="zoom-inner" id="zoom-inner">
        <div class="card" style="left: 80px; top: 150px;">
          <div class="line">Every frame is code</div>
          <div class="num">1,284</div>
          <div class="sub">renders this week</div>
          <div class="btn">Continue</div>
        </div>
        <div class="card" style="left: 470px; top: 300px;">
          <div class="line">Every frame is code</div>
          <div class="num">98%</div>
          <div class="sub">in sync with the UI</div>
          <div class="btn">Continue</div>
        </div>
        <div class="card target" id="target-card" style="left: 860px; top: 110px;">
          <div class="ring" id="ring"></div>
          <div class="line">Every frame is code</div>
          <div class="num">3 s</div>
          <div class="sub">per preview</div>
          <div class="btn">Continue</div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const W = 1280, H = 720;
  // Measure the target's real laid-out centre once at setup (single-scene composition, no fonts to wait for).
  const r = document.getElementById("target-card").getBoundingClientRect();
  const TARGET_OFFSET_X = r.left + r.width / 2 - W / 2;
  const TARGET_OFFSET_Y = r.top + r.height / 2 - H / 2;
  // Headroom budget: target <= 88% of the canvas at peak.
  const maxScale = Math.min((0.88 * W) / r.width, (0.88 * H) / r.height);
  const ZOOM_SCALE = Math.min(2.2, maxScale);
  const ZOOM_AT = 0.5, ZOOM_DUR = 1.2, EASE = "power3.inOut";
  // Nested-wrapper formula: counter-translate = -offset (independent of scale).
  const counterX = -TARGET_OFFSET_X, counterY = -TARGET_OFFSET_Y;
  tl.fromTo("#zoom-outer", { scale: 1 }, { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: EASE }, ZOOM_AT);
  tl.fromTo("#zoom-inner", { x: 0, y: 0 }, { x: counterX, y: counterY, duration: ZOOM_DUR, ease: EASE }, ZOOM_AT);
  // Dwell beat: a yellow ring confirms the landed target so the clip is not still after the zoom settles.
  tl.fromTo("#ring", { scale: 1.08, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, ZOOM_AT + ZOOM_DUR + 0.1);
  tl.to("#ring", { opacity: 0, duration: 0.5, ease: "power1.in" }, 2.45);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
