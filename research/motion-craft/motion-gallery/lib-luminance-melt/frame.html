<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-luminance-melt</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .panel { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .art { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .art.a { background: #ece7da; }
  .art.b { background: #f6f3ec; }
  .card { position: absolute; left: 204px; top: 100px; width: 760px; height: 380px; background: #fffdf8;
    border: 2px solid #1d1c1a; border-radius: 24px; }
  .card .eyebrow { position: absolute; left: 56px; top: 44px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card .h1 { position: absolute; left: 56px; top: 84px; font-size: 56px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 164px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 254px; width: 200px; height: 60px; background: #f2c200; border: 2px solid #1d1c1a;
    border-radius: 14px; font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; color: #1d1c1a; }
  .card .av { position: absolute; top: 44px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #1d1c1a; background: #ece7da;
    font-size: 20px; font-weight: 700; line-height: 60px; text-align: center; }
  .card .av.v1 { left: 540px; } .card .av.v2 { left: 592px; } .card .av.v3 { left: 644px; }
  .art.b .num { position: absolute; left: 92px; top: 86px; font-size: 136px; font-weight: 700; line-height: 1; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .art.b .cap { position: absolute; left: 100px; top: 236px; font-size: 22px; color: #6d6a63; }
  .art.b .row { position: absolute; left: 96px; width: 520px; height: 60px; border-top: 2px solid #e3ded2; font-size: 22px; line-height: 58px;
    padding-left: 30px; will-change: transform; }
  .art.b .row .dot { position: absolute; left: 0; top: 24px; width: 12px; height: 12px; border-radius: 50%; background: #f2c200; }
  .art.b .row.r1 { top: 320px; } .art.b .row.r2 { top: 384px; } .art.b .row.r3 { top: 448px; }
  .art.b .disc { will-change: transform; position: absolute; left: 780px; top: 150px; width: 280px; height: 280px; border-radius: 50%; background: #f2c200;
    border: 2px solid #1d1c1a; text-align: center; color: #1d1c1a; }
  .art.b .disc .pct { position: absolute; left: 0; width: 276px; top: 86px; font-size: 72px; font-weight: 700; line-height: 1; }
  .art.b .disc .pl { position: absolute; left: 0; width: 276px; top: 166px; font-size: 18px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }

  .strip { will-change: transform; transform-origin: 50% 0%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="panel" id="B">
<div class="art b" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div><div class="cap" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div><div class="row r1" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Jamie Dalton</div><div class="row r2" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Sam Kim</div><div class="row r3" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Morgan Lee</div><div class="disc" data-layout-allow-overlap data-layout-allow-occlusion><div class="pct" data-layout-allow-overlap data-layout-allow-occlusion>98%</div><div class="pl" data-layout-allow-overlap data-layout-allow-occlusion>accepted</div></div></div>
      </div>
      <template id="tplA"><div class="art a" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class="card"><div class="eyebrow" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div><div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div><div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left</div><div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div><div class="av v1" data-layout-allow-overlap data-layout-allow-occlusion>JD</div><div class="av v2" data-layout-allow-overlap data-layout-allow-occlusion>SK</div><div class="av v3" data-layout-allow-overlap data-layout-allow-occlusion>ML</div></div></div></template>
      <div id="strips"></div>
    </div>
    <div id="label"><span class="l-name">Luminance melt</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  // 24 vertical strips, each a full copy of scene A clipped to its column; bright columns melt first, dark ones (headline, button) last.
  const A_HTML = document.getElementById("tplA").innerHTML;
  const N = 24, SW = 1168 / N;
  function inR(x, y, l, t, w, h) { return x >= l && x <= l + w && y >= t && y <= t + h; }
  function lumaAt(x, y) {
    let v = 0.90;
    if (inR(x, y, 204, 100, 760, 380)) v = 0.99;
    if (inR(x, y, 744, 144, 168, 64)) v = 0.84;
    if (inR(x, y, 260, 264, 140, 28)) v = 0.80;
    if (inR(x, y, 260, 354, 200, 60)) v = 0.70;
    if (inR(x, y, 260, 184, 456, 62)) v = 0.42;
    return v;
  }
  const host = document.getElementById("strips");
  const strips = [];
  for (let i = 0; i < N; i++) {
    const l = (i * SW).toFixed(2), r = (1168 - (i + 1) * SW).toFixed(2);
    host.insertAdjacentHTML("beforeend", '<div class="panel strip" id="s' + i + '" data-layout-allow-overlap data-layout-allow-overflow style="clip-path:inset(0 ' + r + 'px 0 ' + l + 'px)">' + A_HTML + '</div>');
    let s = 0;
    for (let k = 0; k < 24; k++) s += lumaAt(i * SW + SW / 2, (k + 0.5) * 580 / 24);
    strips.push({ i, luma: s / 24 });
  }
  // Low-frequency noise across x (two sines, fixed phase) so the melt front is uneven, then order by brightness.
  const noise = i => 0.5 + 0.5 * Math.sin(i * 0.9 + 1.3) * 0.6 + 0.5 * Math.sin(i * 0.37 + 0.4) * 0.4;
  const order = strips.slice().sort((p, q) => q.luma - p.luma);
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  const T0 = 0.3, SPREAD = 0.85, DUR = 0.95;
  order.forEach((s, rank) => {
    const at = T0 + SPREAD * (rank / (N - 1)) * 0.75 + noise(s.i) * 0.3;
    // Melt: the strip slides down off the stage while stretching from its top edge (scaleY 1 to 1.45), accelerating.
    tl.fromTo("#s" + s.i, { y: 0, scaleY: 1 }, { y: 640, scaleY: 1.45, duration: DUR, ease: "power2.in" }, at);
  });
  const ROWS_AT = 2.05;
  // Second beat: the three rows of the new scene settle in so the clip keeps moving.
  tl.fromTo(".art.b .row.r1", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT);
  tl.fromTo(".art.b .row.r2", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT + 0.1);
  tl.fromTo(".art.b .row.r3", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT + 0.2);
  tl.fromTo(".art.b .disc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, ROWS_AT + 0.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
