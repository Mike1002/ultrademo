<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-hypothetical-outcome-cycle</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .cap { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; fill: #6d6a63; }
  .ttl { font-size: 34px; font-weight: 700; fill: #1d1c1a; font-variant-numeric: tabular-nums; }
  .tick { font-size: 18px; fill: #6d6a63; }
  .grid { stroke: #e3ded2; stroke-width: 2; }
  .axis { stroke: #1d1c1a; stroke-width: 2; }
  #mean { fill: none; stroke: #a19d93; stroke-width: 3; stroke-dasharray: 8 10; }
  #outcome { fill: none; stroke: #1d1c1a; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  #end { fill: #f2c200; stroke: #1d1c1a; stroke-width: 3; }
  .pip { fill: #ece7da; stroke: #a19d93; stroke-width: 2; }
  .lg { font-size: 16px; fill: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <svg id="chart" viewBox="0 0 1168 580" width="1168" height="580">
        <text class="cap" x="160" y="36">Possible outcomes · invites next quarter</text>
        <text class="ttl" id="ttl" x="1080" y="44" text-anchor="end">Outcome 1 of 6</text>
        <line class="grid" x1="160" y1="150" x2="1080" y2="150"/>
        <line class="grid" x1="160" y1="260" x2="1080" y2="260"/>
        <line class="grid" x1="160" y1="370" x2="1080" y2="370"/>
        <line class="axis" x1="160" y1="480" x2="1080" y2="480"/>
        <line class="axis" x1="160" y1="60" x2="160" y2="480"/>
        <text class="tick" x="140" y="156" text-anchor="end">15k</text>
        <text class="tick" x="140" y="266" text-anchor="end">10k</text>
        <text class="tick" x="140" y="376" text-anchor="end">5k</text>
        <text class="tick" x="140" y="486" text-anchor="end">0</text>
        <text class="tick" x="160" y="514" text-anchor="middle">Week 1</text>
        <text class="tick" x="620" y="514" text-anchor="middle">Week 7</text>
        <text class="tick" x="1080" y="514" text-anchor="middle">Week 13</text>
        <polyline id="mean" points=""/>
        <polyline id="outcome" points=""/>
        <circle id="end" cx="0" cy="0" r="12"/>
        <g id="pips"></g>
        <text class="lg" x="160" y="562">Dashed: the average of all six · solid: one sampled outcome at a time</text>
      </svg>
    </div>
    <div id="label"><span class="l-name">Hypothetical outcome cycle</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const NS = "http://www.w3.org/2000/svg";
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = rand(23);
  // Six baked outcomes over 13 weeks: each is a random walk around a rising mean, spread growing to the right. Fixed seed, fixed axes.
  const NW = 13, mean = []; for (let w = 0; w < NW; w++) mean.push(3 + 0.7 * w);
  const outcomes = []; for (let k = 0; k < 6; k++) { let drift = 0; const o = []; for (let w = 0; w < NW; w++) { drift += (rnd() - 0.5) * 1.6; o.push(Math.max(0.5, mean[w] + drift * (0.3 + w / NW))); } outcomes.push(o); }
  const xs = w => 160 + w * (920 / (NW - 1)), y = v => 480 - v * 22;
  const pts = arr => arr.map((v, w) => xs(w) + "," + y(v)).join(" ");
  document.getElementById("mean").setAttribute("points", pts(mean));
  const pipsG = document.getElementById("pips");
  const pips = outcomes.map((o, k) => { const r = document.createElementNS(NS, "rect"); r.setAttribute("class", "pip"); r.setAttribute("x", 760 + k * 54); r.setAttribute("y", 56); r.setAttribute("width", 42); r.setAttribute("height", 10); r.setAttribute("rx", 5); pipsG.appendChild(r); return r; });
  const STEP = 0.4, T0 = 0.1;                                    // one outcome every 400 ms, hard replacement, no tween between frames
  const el = id => document.getElementById(id);
  function renderAt(t) {
    const k = Math.max(0, Math.floor((t - T0) / STEP)) % 6;
    el("outcome").setAttribute("points", pts(outcomes[k]));
    el("end").setAttribute("cx", xs(NW - 1)); el("end").setAttribute("cy", y(outcomes[k][NW - 1]));
    el("ttl").textContent = "Outcome " + (k + 1) + " of 6";
    pips.forEach((p, i) => p.setAttribute("fill", i === k ? "#f2c200" : "#ece7da"));
  }
  renderAt(0);
  const tl = gsap.timeline({ paused: true });
  tl.fromTo({ k: 0 }, { k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
