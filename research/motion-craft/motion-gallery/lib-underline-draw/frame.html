<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-underline-draw</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px;  }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .kicker { position: absolute; left: 0; right: 0; top: 150px; text-align: center; }
  .sentence { position: absolute; left: 0; right: 0; top: 206px; text-align: center; white-space: nowrap; line-height: 110px; font-size: 84px; font-weight: 700; }
  .key { display: inline-block; position: relative; }
  .underline { position: absolute; left: -8px; bottom: -22px; width: calc(100% + 16px); height: 40px; overflow: visible; }
  .underline path { fill: none; stroke: #f2c200; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .caption { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 18px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <span class="lab kicker">One stroke · 1.35 s</span>
      <div class="sentence">Every frame <span class="key">is code<svg class="underline" viewBox="0 0 270 40" preserveAspectRatio="none" data-layout-allow-overlap>
        <path id="u1" pathLength="1" d="M 5 16 C 72 7 172 9 264 13"/>
        <path id="u2" pathLength="1" d="M 60 30 C 120 24 190 26 236 28"/>
      </svg></span>.</div>
      <div class="caption">A hand-pointed emphasis beneath the key phrase.</div>
    </div>
    <div id="label"><span class="l-name">Underline draw</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  tl.fromTo("#u1", { strokeDashoffset: 1 }, { strokeDashoffset: 0, autoRound: false, duration: 1.35, ease: "none" }, 0.3);
  tl.fromTo("#u2", { strokeDashoffset: 1 }, { strokeDashoffset: 0, autoRound: false, duration: 0.7, ease: "none" }, 2.0);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
