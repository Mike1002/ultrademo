<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-shape-split-merge</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .kicker { position: absolute; left: 64px; top: 40px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  svg.canvas { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .part { will-change: transform; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="kicker">One whole, three parts</div>
      <svg class="canvas" viewBox="0 0 1168 580"><g id="parts"></g></svg>
    </div>
    <div id="label"><span class="l-name">Shape split and merge</span><span class="l-sep">·</span><span>Shape &amp; Path</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // A disc cut into three equal sectors: the sectors slide 48 px outward along their bisectors over 1 s, hold, then slide back into one shape.
  const group = document.getElementById("parts");
  const CX = 584, CY = 272, R = 144;
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / 3, b = a + 2 * Math.PI / 3;
    const x1 = CX + R * Math.cos(a), y1 = CY + R * Math.sin(a), x2 = CX + R * Math.cos(b), y2 = CY + R * Math.sin(b);
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M" + CX + " " + CY + " L" + x1 + " " + y1 + " A" + R + " " + R + " 0 0 1 " + x2 + " " + y2 + " Z");
    p.setAttribute("fill", i === 0 ? "#f2c200" : "#1d1c1a");
    p.setAttribute("class", "part");
    p.setAttribute("id", "part" + i);
    group.appendChild(p);
    const mid = (a + b) / 2, x = 48 * Math.cos(mid), y = 48 * Math.sin(mid);
    tl.fromTo(p, { x: 0, y: 0 }, { x, y, duration: 1.0, ease: "power3.inOut" }, 0.3);
    tl.fromTo(p, { x, y }, { x: 0, y: 0, duration: 1.0, ease: "power3.inOut", immediateRender: false }, 1.9);
  }
  window.__timelines["main"] = tl;
</script>
</body>
</html>
