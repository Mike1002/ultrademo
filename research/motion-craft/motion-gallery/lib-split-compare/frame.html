<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-split-compare</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .layer { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .big { position: absolute; left: 234px; top: 110px; width: 700px; height: 250px; line-height: 250px; text-align: center; font-size: 210px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .text { position: absolute; left: 235px; top: 386px; width: 698px; height: 60px; line-height: 60px; text-align: center; font-size: 46px; font-weight: 700; white-space: nowrap; }
  #before .big, #before .text { color: #a19d93; filter: blur(3px); opacity: .55; }
  .v { background: #f2c200; padding: 0 10px; border-radius: 10px; }
  #divider { position: absolute; left: 583px; top: 90px; width: 2px; height: 410px; background: #1d1c1a; will-change: transform; }
  #handle { position: absolute; left: -9px; top: 193px; width: 20px; height: 26px; border-top: 2px solid #1d1c1a; border-bottom: 2px solid #1d1c1a; background: #f6f3ec; }
  .lab { position: absolute; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #baseline { position: absolute; left: 120px; width: 928px; top: 469px; height: 1px; background: #e3ded2; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="baseline"></div>
      <div class="layer" id="before" data-layout-allow-overlap><div class="big" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div><div class="text" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div></div>
      <div class="layer" id="after" data-layout-allow-overlap><div class="big" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div><div class="text" data-layout-allow-overlap data-layout-allow-occlusion>Invite your <span class="v">team</span></div></div>
      <div class="lab" style="left:120px;top:60px">Before · blurred</div>
      <div class="lab" style="left:950px;top:60px">After · sharp</div>
      <div id="divider" data-layout-allow-overlap><div id="handle"></div></div>
      <div class="lab" style="left:120px;top:528px">Same subject · same coordinates</div>
    </div>
    <div id="label"><span class="l-name">Split compare</span><span class="l-sep">·</span><span>Explainer</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Both layers sit at identical coordinates; complementary clip-path insets reveal each side of the divider.
  tl.set("#before", { clipPath: "inset(0% 50% 0% 0%)" }, 0);
  tl.set("#after", { clipPath: "inset(0% 0% 0% 50%)" }, 0);
  tl.set("#divider", { x: 0 }, 0);
  const stops = [35, 65, 50], starts = [0.3, 0.9, 1.55], durations = [0.6, 0.65, 0.65];
  stops.forEach((p, i) => {
    const vars = { duration: durations[i], ease: "power2.inOut" };
    tl.to("#before", { clipPath: `inset(0% ${100 - p}% 0% 0%)`, ...vars }, starts[i]);
    tl.to("#after", { clipPath: `inset(0% 0% 0% ${p}%)`, ...vars }, starts[i]);
    tl.to("#divider", { x: 1168 * (p / 100 - 0.5), ...vars }, starts[i]);
  });
  // Centre hold with a small handle pulse so the clip keeps breathing.
  tl.fromTo("#handle", { scale: 1 }, { scale: 1.3, duration: 0.3, ease: "sine.inOut" }, 2.35);
  tl.to("#handle", { scale: 1, duration: 0.3, ease: "sine.inOut" }, 2.65);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
