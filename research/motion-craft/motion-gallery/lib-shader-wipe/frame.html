    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }

  #cv { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }

</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <canvas id="cv" width="1168" height="580" data-layout-allow-overlap></canvas>
    </div>
    <div id="label"><span class="l-name">Shader directional warp wipe</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  const W = 1168, H = 580, S2 = Math.SQRT1_2;
  const FONT = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  function plate() { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; }
  // Plate A: the light card scene, drawn once.
  const PA = plate(); { const o = PA.getContext("2d");
    o.fillStyle = "#ece7da"; o.fillRect(0, 0, W, H);
    o.fillStyle = "#fffdf8"; o.strokeStyle = "#1d1c1a"; o.lineWidth = 2; o.beginPath(); o.roundRect(205, 101, 758, 378, 24); o.fill(); o.stroke();
    o.fillStyle = "#6d6a63"; o.font = "13px " + FONT; o.fillText("O R B I T", 260, 156);
    o.fillStyle = "#1d1c1a"; o.font = "700 56px " + FONT; o.fillText("Invite your team", 258, 236);
    o.fillStyle = "#6d6a63"; o.font = "22px " + FONT; o.fillText("3 seats left", 260, 288);
    o.fillStyle = "#f2c200"; o.beginPath(); o.roundRect(261, 356, 200, 60, 14); o.fill(); o.stroke();
    o.fillStyle = "#1d1c1a"; o.font = "700 20px " + FONT; o.textAlign = "center"; o.fillText("Continue", 361, 393);
    o.fillStyle = "#ece7da"; [744, 796, 848].forEach(x => { o.beginPath(); o.arc(x + 32, 177, 31, 0, Math.PI * 2); o.fill(); o.stroke(); });
    o.fillStyle = "#1d1c1a"; ["JD", "SK", "ML"].forEach((s, i) => o.fillText(s, 776 + i * 52, 184)); o.textAlign = "left"; }
  // Plate B: the dark number scene, drawn per frame (the number counts up during the hold).
  const PB = plate(); const ob = PB.getContext("2d");
  function drawB(n) {
    ob.fillStyle = "#1d1c1a"; ob.fillRect(0, 0, W, H);
    ob.fillStyle = "#a19d93"; ob.font = "13px " + FONT; ob.fillText("I N V I T E S", 100, 92);
    ob.fillStyle = "#f2c200"; ob.font = "700 220px " + FONT; ob.fillText(n.toLocaleString("en-US"), 92, 330);
    ob.fillStyle = "#f6f3ec"; ob.font = "700 44px " + FONT; ob.fillText("invites sent", 100, 420);
    ob.fillStyle = "rgba(246,243,236,0.18)"; ob.fillRect(100, 468, 968, 2);
    ob.fillStyle = "#a19d93"; ob.font = "22px " + FONT; ob.fillText("Jamie Dalton   ·   Sam Kim   ·   Morgan Lee", 100, 516);
  }
  // Rotated coordinates: u along the 45-degree travel direction, v across it.
  const LO = 0, HI = (W + H) * S2;
  const VMIN = -W * S2, VMAX = H * S2;
  const toXY = (u, v) => [(u - v) * S2, (u + v) * S2];
  function edgeU(v, p) {
    const t = v / H;
    const bend = (0.08 * Math.sin(t * 2.2 + 1.3) + 0.03 * Math.sin(t * 6.1 + p * 4)) * (HI - LO);
    return LO + (-0.16 + 1.32 * p) * (HI - LO) + bend;
  }
  function region(p, uMinOff, uMaxOff) {
    // polygon between u = edge + uMinOff and u = edge + uMaxOff (null = unbounded)
    ctx.beginPath();
    const N = 40;
    for (let i = 0; i <= N; i++) { const v = VMIN + (VMAX - VMIN) * i / N; const u = uMaxOff === null ? 4000 : edgeU(v, p) + uMaxOff; const q = toXY(u, v); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
    for (let i = N; i >= 0; i--) { const v = VMIN + (VMAX - VMIN) * i / N; const u = uMinOff === null ? -4000 : edgeU(v, p) + uMinOff; const q = toXY(u, v); ctx.lineTo(q[0], q[1]); }
    ctx.closePath();
  }
  const DX = 7 * S2, DY = 7 * S2, BAND = 72;
  function draw(p, n) {
    drawB(n);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.drawImage(PB, 0, 0);
    // B smears forward inside the edge band
    ctx.save(); region(p, -BAND, BAND); ctx.clip(); ctx.globalAlpha = 0.1;
    for (let i = 1; i <= 8; i++) ctx.drawImage(PB, DX * i, DY * i); ctx.restore();
    // A (ahead of the edge, u > edge) with a feathered edge
    [[14, 1], [0, 0.5], [-14, 0.25]].forEach(([off, a]) => { ctx.save(); region(p, off, null); ctx.clip(); ctx.globalAlpha = a; ctx.drawImage(PA, 0, 0); ctx.restore(); });
    // A smears backward inside the edge band
    ctx.save(); region(p, -BAND, BAND); ctx.clip(); ctx.globalAlpha = 0.1;
    for (let i = 1; i <= 8; i++) ctx.drawImage(PA, -DX * i, -DY * i); ctx.restore();
    // a soft shadow along the edge
    ctx.save(); region(p, -22, 22); ctx.clip(); ctx.globalAlpha = 1; ctx.fillStyle = "rgba(29,28,26,0.14)"; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  const T0 = 0.25, DUR = 1.7, easeP = gsap.parseEase("sine.inOut"), easeN = gsap.parseEase("power2.out");
  let last = "";
  function renderAt(t) {
    const p = easeP(Math.max(0, Math.min(1, (t - T0) / DUR)));
    const n = Math.round(12480 * easeN(Math.max(0, Math.min(1, (t - 1.0) / 1.7))));
    const key = p + ":" + n; if (key === last) return; last = key; draw(p, n);
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
