<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>camera-cursor-tracking</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  .caption { position: absolute; left: 120px; top: 232px; font-size: 20px; color: #6d6a63; }
  /* viewport clips the world; padding-left is the Phase-1 anchor X (matches VIEWPORT_PAD_LEFT) */
  .viewport { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: flex-start; padding-left: 120px; }
  .world { display: flex; align-items: center; white-space: nowrap; will-change: transform; }
  .search-bar { display: flex; align-items: center; height: 120px; padding: 0 40px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 60px;
    font-size: 52px; font-weight: 700; letter-spacing: -0.01em; }
  .search-bar .icon { width: 36px; height: 36px; margin-right: 24px; flex: none; }
  .search-bar .text { display: inline-block; overflow: hidden; vertical-align: bottom; }
  .search-bar .cursor { display: inline-block; width: 6px; margin-left: 4px; background: #f2c200; height: 0.95em; vertical-align: bottom; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="viewport" id="viewport">
      <div class="world" id="world">
        <div class="search-bar" id="search-bar">
          <svg class="icon" viewBox="0 0 36 36"><circle cx="15" cy="15" r="11" fill="none" stroke="#1d1c1a" stroke-width="4"/><path d="M23 23 L33 33" stroke="#1d1c1a" stroke-width="4" stroke-linecap="round"/></svg>
          <span class="text" id="reveal-text">Every frame is code, and every demo stays current</span><span class="cursor" id="cursor"></span>
        </div>
      </div>
    </div>
    <div class="caption">The camera holds, then follows the typing once it crosses the mark</div>
  </section>
</div>
<script>
  // Built synchronously: no fonts.ready gate (parallel render workers would otherwise race the timeline).
  const tl = gsap.timeline({ paused: true });
  const VIEWPORT_WIDTH = 1280, VIEWPORT_PAD_LEFT = 120, CURSOR_TARGET_FRACTION = 0.62;
  const REVEAL_START = 0.2, REVEAL_DUR = 2.2, TRACK_START = 1.0, TRACK_DUR = 1.4, SCENE_DURATION = 3, BLINK_HALF_PERIOD = 0.3;
  const textEl = document.getElementById("reveal-text");
  const BAR_LEAD = 40 + 36 + 24; // search-bar padding + icon + gap before the text starts
  const fullWidth = textEl.scrollWidth; // measured, never chars x font-size
  const targetCursorScreenX = CURSOR_TARGET_FRACTION * VIEWPORT_WIDTH;
  const trackingDelta = Math.max(0, VIEWPORT_PAD_LEFT + BAR_LEAD + fullWidth - targetCursorScreenX);
  // Phase 1: text reveals at a linear typing rate; the camera holds at its anchor.
  tl.fromTo("#reveal-text", { maxWidth: 0 }, { maxWidth: fullWidth, duration: REVEAL_DUR, ease: "none" }, REVEAL_START);
  // Phase 2: the world pans left so the cursor stays pinned at the target screen X; overlaps the reveal.
  tl.fromTo("#world", { x: 0 }, { x: -trackingDelta, duration: TRACK_DUR, ease: "power2.inOut" }, TRACK_START);
  // Cursor blink: finite GSAP yoyo with steps(1), never CSS keyframes.
  const blinkRepeats = Math.ceil(SCENE_DURATION / BLINK_HALF_PERIOD) - 1;
  tl.fromTo("#cursor", { opacity: 1 }, { opacity: 0, duration: BLINK_HALF_PERIOD, ease: "steps(1)", yoyo: true, repeat: blinkRepeats }, 0);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
