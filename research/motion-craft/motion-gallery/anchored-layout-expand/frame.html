<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>anchored-layout-expand</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  /* layout authored at its EXPANDED end state; the collapsed look is transforms only */
  .stack { position: absolute; left: 340px; top: 120px; width: 600px; }
  .expander-head { position: relative; z-index: 2; height: 76px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 20px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 26px; font-weight: 700; }
  .chev { width: 28px; height: 28px; display: block; will-change: transform; }
  .expand-mask { height: 192px; overflow: hidden; }                 /* BODY_H, never tweened */
  .expand-sheet { height: 192px; background: #fffdf8; border: 2px solid #1d1c1a; border-top: none; border-radius: 0 0 20px 20px;
    will-change: transform; }
  .expand-row { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 28px; border-top: 2px solid #e3ded2; font-size: 22px; }
  .expand-row:first-child { border-top: none; }
  .av { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #1d1c1a; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .expand-row .bar { margin-left: auto; width: 120px; height: 12px; border-radius: 6px; background: #e3ded2; }
  .below { margin-top: 24px; will-change: transform; }
  .below .card { background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 20px; padding: 28px; display: flex; align-items: center; justify-content: space-between; }
  .below .line { font-size: 26px; font-weight: 700; }
  .btn { width: 200px; height: 60px; border-radius: 14px; background: #f2c200; font-size: 22px; font-weight: 700; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="stack">
      <div class="expander">
        <div class="expander-head"><span>Invite your team</span>
          <svg class="chev" id="chev" viewBox="0 0 28 28"><path d="M6 10 L14 18 L22 10" fill="none" stroke="#1d1c1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="expand-mask" id="expand-mask" data-layout-allow-overflow>
          <div class="expand-sheet" id="expand-sheet">
            <div class="expand-row" id="row-a" data-layout-allow-occlusion><div class="av">JD</div><span>Jamie Dalton</span><div class="bar"></div></div>
            <div class="expand-row" id="row-b" data-layout-allow-occlusion><div class="av">SK</div><span>Sam Kim</span><div class="bar"></div></div>
            <div class="expand-row" id="row-c" data-layout-allow-occlusion><div class="av">ML</div><span>Morgan Lee</span><div class="bar"></div></div>
          </div>
        </div>
      </div>
      <div class="below" id="below">
        <div class="card"><div class="line">Every frame is code</div><div class="btn">Continue</div></div>
      </div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  const BODY_H = document.querySelector("#expand-mask").offsetHeight;   // single-scene measure, equals the CSS height
  const GROW_AT = 0.4, GROW_DUR = 0.5, GROW_EASE = "power3.out", ROW_FADE_DUR = 0.25, ROW_STAGGER = 0.06, COLLAPSE_AT = 2.2, COLLAPSE_DUR = 0.3;
  // the cause: the chevron turns
  tl.fromTo("#chev", { rotation: 0 }, { rotation: 180, duration: 0.35, ease: "power2.out" }, GROW_AT - 0.05);
  // the grow: ONE tween drives both sides of the seam
  tl.fromTo(["#expand-sheet", "#below"], { y: -BODY_H }, { y: 0, duration: GROW_DUR, ease: GROW_EASE }, GROW_AT);
  tl.fromTo(".expand-row", { opacity: 0 }, { opacity: 1, duration: ROW_FADE_DUR, stagger: ROW_STAGGER, ease: "power2.out" }, GROW_AT + GROW_DUR * 0.25);
  // the collapse: same machinery back, faster
  tl.fromTo("#chev", { rotation: 180 }, { rotation: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, COLLAPSE_AT);
  tl.fromTo(["#expand-sheet", "#below"], { y: 0 }, { y: -BODY_H, duration: COLLAPSE_DUR, ease: "power3.in", immediateRender: false }, COLLAPSE_AT);
  tl.fromTo(".expand-row", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, COLLAPSE_AT);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
