<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-char-stagger</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px;  }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .kicker { position: absolute; left: 60px; top: 150px; }
  .text { position: absolute; left: 60px; top: 200px; white-space: pre; letter-spacing: -.01em; line-height: 1.3; font-size: 84px; font-weight: 700; }
  .text .char { display: inline-block; will-change: transform; }
  .text2 { position: absolute; left: 60px; top: 330px; white-space: pre; line-height: 1.3; font-size: 34px; font-weight: 700; color: #6d6a63; }
  .text2 .char { display: inline-block; will-change: transform; }
  .baseline { position: absolute; left: 60px; right: 60px; top: 420px; height: 1px; background: #e3ded2; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <span class="lab kicker">Bottom to top · one character at a time</span>
      <div class="text" id="text"></div>
      <div class="text2" id="text2"></div>
      <div class="baseline"></div>
    </div>
    <div id="label"><span class="l-name">Per-character rise</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  function split(id, str) {
    const host = document.getElementById(id);
    Array.from(str).forEach((c, i) => { const s = document.createElement("span"); s.className = "char"; s.id = id + "c" + i; s.textContent = c; host.appendChild(s); });
  }
  split("text", "Every frame is code.");
  split("text2", "Your product, in motion.");
  tl.fromTo("#text .char", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 0.62, stagger: 0.035, ease: "power3.out" }, 0.3);
  tl.fromTo("#text2 .char", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.025, ease: "power3.out" }, 1.75);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
