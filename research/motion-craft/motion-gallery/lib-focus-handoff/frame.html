<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-focus-handoff</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px;  }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .kicker { position: absolute; left: 64px; top: 40px; }
  .connector { position: absolute; top: 219px; left: 190px; width: 840px; height: 2px; background: #e3ded2; }
  .item { position: absolute; top: 190px; width: 240px; text-align: center; color: #a19d93; will-change: transform; }
  .item .dot { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 30px; background: #a19d93; }
  .item .t-m { font-size: 40px; font-weight: 700; }
  .i1 { left: 70px; } .i2 { left: 350px; } .i3 { left: 630px; } .i4 { left: 910px; }
  .caption { position: absolute; left: 64px; top: 500px; font-size: 18px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <span class="lab kicker">Invite your team · four steps</span>
      <div class="connector"></div>
      <div class="item i1" id="i1" data-layout-allow-overlap><div class="dot" id="d1"></div><div class="t-m">Invite</div></div>
      <div class="item i2" id="i2" data-layout-allow-overlap><div class="dot" id="d2"></div><div class="t-m">Accept</div></div>
      <div class="item i3" id="i3" data-layout-allow-overlap><div class="dot" id="d3"></div><div class="t-m">Set up</div></div>
      <div class="item i4" id="i4" data-layout-allow-overlap><div class="dot" id="d4"></div><div class="t-m">Launch</div></div>
      <div class="caption">The layout stays; only the focus moves, in order.</div>
    </div>
    <div id="label"><span class="l-name">Focus handoff</span><span class="l-sep">·</span><span>Emphasis</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  const FAINT = "#a19d93", INK = "#1d1c1a", YEL = "#f2c200";
  const items = ["#i1", "#i2", "#i3", "#i4"];
  items.forEach((s, i) => {
    const t = 0.25 + i * 0.7; // hold ~550 ms, handoff 150 ms
    tl.fromTo(s, { color: FAINT, scale: 1 }, { color: INK, scale: 1.04, duration: 0.15, ease: "power2.inOut" }, t);
    tl.fromTo("#d" + (i + 1), { backgroundColor: FAINT }, { backgroundColor: YEL, duration: 0.15, ease: "power2.inOut" }, t);
    if (i < items.length - 1) {
      tl.to(s, { color: FAINT, scale: 1, duration: 0.15, ease: "power2.inOut" }, t + 0.7);
      tl.to("#d" + (i + 1), { backgroundColor: FAINT, duration: 0.15, ease: "power2.inOut" }, t + 0.7);
    }
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
