<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-freeze-cut</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; will-change: transform, opacity, filter; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
  .card { position: absolute; left: 264px; top: 110px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, filter, opacity; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  .card h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; white-space: nowrap; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a; color: #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; will-change: transform; }
  .card.b h1 { font-size: 96px; line-height: 104px; top: 74px; font-variant-numeric: tabular-nums; }
  .card.b .sub { top: 190px; }
  .card.b .bar { position: absolute; left: 56px; top: 250px; width: 300px; height: 14px; border-radius: 7px; background: #f2c200; border: 2px solid #1d1c1a; transform-origin: 0 50%; will-change: transform; }
  .cursor { position: absolute; width: 28px; height: 38px; z-index: 10; pointer-events: none; transform-origin: 2px 2px; will-change: transform; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
  .cursor svg { width: 28px; height: 38px; display: block; }

  #shotA { transform-origin: 50% 50%; }
  #vig { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(29,28,26,0) 38%, rgba(29,28,26,0.55) 100%); }
  #hold { position: absolute; left: 904px; top: 92px; width: 92px; height: 30px; border-radius: 999px; background: #1d1c1a; color: #f6f3ec;
    font-size: 13px; letter-spacing: .06em; text-transform: uppercase; line-height: 30px; text-align: center; opacity: 0; will-change: transform; }
  #b { opacity: 0; }

</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">

      <div class="shot" id="shotA">
        <div class="card a " id="a" data-layout-allow-overlap ><div class="lab">Orbit</div><h1>Invite your team</h1><div class="sub">3 seats left on this plan</div><div class="btn">Continue</div></div>
        <div class="cursor" id="cur" style="left:420px;top:380px" data-layout-allow-overlap ><svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg></div>
      </div>
      <div id="vig" data-layout-allow-overlap></div>
      <div id="hold" data-layout-allow-overlap>Hold</div>
      <div class="card b " id="b" data-layout-allow-overlap ><div class="lab">This month</div><h1>12,480</h1><div class="sub">invites sent</div><div class="bar"></div></div>

    </div>
    <div id="label"><span class="l-name">Freeze cut</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>

  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.6 } });
  // Rest: A running, B hidden, vignette clear.
  tl.fromTo("#shotA", { opacity: 1, scale: 1, filter: "saturate(1)" }, { scale: 1, duration: 0.01 }, 0);
  tl.fromTo("#b", { opacity: 0, scale: 1 }, { scale: 1, duration: 0.01 }, 0);
  tl.fromTo("#b .bar", { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
  tl.fromTo("#vig", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  // The action: the cursor crosses the card toward Continue, and is still moving when the freeze hits at 0.9 s.
  tl.fromTo("#cur", { x: 470, y: 150 }, { x: 120, y: 48, duration: 0.8, ease: "power1.out" }, 0.1);
  // Freeze at 0.9 s: the picture stops, saturation drops to 0.6, a vignette closes in, and the still creeps from 1.0 to 1.04 for 0.5 s.
  tl.to("#shotA", { filter: "saturate(0.6)", duration: 0.08, ease: "none" }, 0.9);
  tl.to("#vig", { opacity: 1, duration: 0.12, ease: "power2.out" }, 0.9);
  tl.to("#shotA", { scale: 1.04, duration: 0.5, ease: "none" }, 0.9);
  tl.fromTo("#hold", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.6)" }, 0.92);
  // Hard cut at 1.4 s: no fade, A and vignette off, B on in the same frame.
  tl.set("#shotA", { opacity: 0 }, 1.4);
  tl.set("#vig", { opacity: 0 }, 1.4);
  tl.set("#hold", { opacity: 0 }, 1.4);
  tl.set("#b", { opacity: 1 }, 1.4);
  // B keeps living after the cut: the bar fills, the number breathes.
  tl.to("#b .bar", { scaleX: 1, duration: 0.8, ease: "power3.out" }, 1.55);
  tl.fromTo("#b h1", { scale: 1 }, { scale: 1.03, duration: 0.7, ease: "sine.inOut", transformOrigin: "0% 50%" }, 2.3);
  // Reset A quietly while invisible so a loop restarts clean.
  tl.to("#shotA", { scale: 1, filter: "saturate(1)", duration: 0.02, ease: "none" }, 1.6);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
