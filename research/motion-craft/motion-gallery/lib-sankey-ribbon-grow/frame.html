<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-sankey-ribbon-grow</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #chart text { font-size: 22px; fill: #1d1c1a; font-weight: 600; }
  #chart .small { font-size: 16px; fill: #6d6a63; font-weight: 400; }
  .heading { position: absolute; left: 32px; top: 26px; font-size: 34px; font-weight: 700; }
  .sub { position: absolute; left: 34px; top: 72px; font-size: 16px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="heading">Where the invites go</div>
      <div class="sub">Splits and merges keep the same flow</div>
      <svg id="chart" viewBox="0 0 1168 580" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="leftClip"><rect id="leftReveal" x="170" y="160" width="0" height="370"/></clipPath>
          <clipPath id="rightClip"><rect id="rightReveal" x="590" y="160" width="0" height="370"/></clipPath>
        </defs>
        <g clip-path="url(#leftClip)">
          <path d="M190 220 C390 220 390 200 580 200 L580 320 C390 320 390 340 190 340Z" fill="#1d1c1a" opacity=".8"/>
          <path d="M190 340 C390 340 390 410 580 410 L580 490 C390 490 390 420 190 420Z" fill="#f2c200" opacity=".9"/>
        </g>
        <g clip-path="url(#rightClip)">
          <path d="M604 200 C790 200 790 220 978 220 L978 340 C790 340 790 320 604 320Z" fill="#1d1c1a" opacity=".8"/>
          <path d="M604 410 C790 410 790 340 978 340 L978 420 C790 420 790 490 604 490Z" fill="#f2c200" opacity=".9"/>
        </g>
        <rect x="166" y="220" width="24" height="200" fill="#1d1c1a"/>
        <rect x="580" y="200" width="24" height="120" fill="#1d1c1a"/>
        <rect x="580" y="410" width="24" height="80" fill="#f2c200" stroke="#1d1c1a" stroke-width="2"/>
        <rect x="978" y="220" width="24" height="200" fill="#1d1c1a"/>
        <text x="135" y="186">Sent 100</text>
        <text id="t1" x="540" y="173">Email 60</text>
        <text id="t2" x="540" y="523">Link 40</text>
        <text id="t3" x="944" y="186">Joined 100</text>
        <text class="small" x="120" y="558">100 invites · ribbon width is proportional to count</text>
      </svg>
    </div>
    <div id="label"><span class="l-name">Sankey ribbon growth</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Ribbons grow left to right by widening a clip rectangle, one column at a time (linear, 0.8 s each).
  tl.fromTo("#leftReveal", { attr: { width: 0 } }, { attr: { width: 420 }, duration: 0.8, ease: "none" }, 0.3);
  tl.fromTo(["#t1", "#t2"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.08 }, 0.95);
  tl.fromTo("#rightReveal", { attr: { width: 0 } }, { attr: { width: 420 }, duration: 0.8, ease: "none" }, 1.3);
  tl.fromTo("#t3", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3 }, 2.05);
  // Second beat: the yellow destination node breathes once so the end state keeps a little life.
  tl.to("#t3", { scale: 1.08, transformOrigin: "0% 50%", duration: 0.3, ease: "power2.out" }, 2.4);
  tl.to("#t3", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.7);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
