<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-countdown-ticker</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #card { position: absolute; left: 184px; top: 110px; width: 800px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  #card .lab { position: absolute; left: 60px; top: 52px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #clock { position: absolute; left: 60px; top: 92px; height: 96px; width: 680px; font-size: 84px; font-weight: 700; line-height: 96px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #days { position: absolute; left: 0; top: 0; }
  #hm { position: absolute; left: 290px; top: 0; }
  .sec { position: absolute; left: 560px; top: 0; width: 120px; height: 96px; line-height: 96px; will-change: transform; }
  #days .unit { font-size: 34px; font-weight: 700; color: #6d6a63; margin-left: 8px; }
  #track { position: absolute; left: 60px; top: 222px; width: 680px; height: 14px; border-radius: 7px; background: #ece7da; overflow: hidden; }
  #fill { position: absolute; left: 0; top: 0; width: 680px; height: 14px; background: #f2c200; will-change: transform; }
  #target { position: absolute; left: 60px; top: 262px; font-size: 18px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="card">
        <div class="lab">Launch in</div>
        <div id="clock">
          <div id="days">2<span class="unit">days</span></div>
          <div id="hm">23:59:</div>
          <div class="sec" id="s0">58</div>
          <div class="sec" id="s1">57</div>
          <div class="sec" id="s2">56</div>
        </div>
        <div id="track"><div id="fill"></div></div>
        <div id="target">Ends Oct 31, 23:59 UTC</div>
      </div>
    </div>
    <div id="label"><span class="l-name">Countdown ticker</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.6 } });
  // One seconds element per second state; each swap slides the new pair up from 14 px over 250 ms.
  const secs = ["#s0", "#s1", "#s2"];
  secs.forEach((s, k) => {
    if (k === 0) {
      tl.fromTo(s, { y: 0, opacity: 1 }, { y: 0, opacity: 1, duration: 0.01 }, 0);
    } else {
      tl.fromTo(s, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, k);
    }
    if (k < secs.length - 1) {
      tl.fromTo(s, { opacity: 1 }, { opacity: 0, duration: 0.02, immediateRender: false }, k + 1);
    }
  });
  // The yellow time bar drains steadily the whole clip, so the frame keeps moving between swaps.
  tl.fromTo("#fill", { scaleX: 0.42, transformOrigin: "0% 50%" }, { scaleX: 0.3, duration: 3, ease: "none" }, 0);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
