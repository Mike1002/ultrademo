<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>reactive-displacement</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; overflow: hidden; }
  /* both cards 520x300, centred at (640,360) -> left 380, top 210; GSAP owns transform */
  .card { position: absolute; left: 380px; top: 210px; width: 520px; height: 300px; background: #fffdf8;
    border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, opacity; }
  #victim { z-index: 1; }
  #intruder { z-index: 2; }
  .line { position: absolute; left: 44px; top: 48px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { position: absolute; left: 44px; top: 100px; font-size: 18px; color: #6d6a63; }
  .num { position: absolute; left: 44px; top: 150px; font-size: 96px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .pill { position: absolute; left: 44px; top: 160px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200;
    color: #1d1c1a; font-size: 22px; font-weight: 700; display: grid; place-items: center; }
  .rule { position: absolute; left: 44px; top: 140px; width: 432px; height: 2px; background: #e3ded2; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="card" id="victim">
      <div class="line">Every frame is code</div>
      <div class="sub">Current view, about to be displaced</div>
      <div class="rule"></div>
      <div class="pill">Continue</div>
    </div>
    <div class="card" id="intruder">
      <div class="line">New view lands</div>
      <div class="sub">It shoves the old one off the stage</div>
      <div class="num">98%</div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  // Values from the rule: DRIVER_DUR 1.0, back.out(1.5), VICTIM_FRACTION 0.45, tilt 10 deg, fade sharpness 5, dwell >= 1 s.
  const STAGE_W = 1280, INTRUDER_START_X = STAGE_W, VICTIM_END_X = -STAGE_W;
  const DRIVER_AT = 0.45, DRIVER_DUR = 1.0, BOUNCE_FACTOR = 1.5, VICTIM_FRACTION = 0.45;
  const INTRUDER_TILT = 10, FADE_IN_SHARPNESS = 5, VICTIM_KICK_DEG = 18;
  const WOBBLE_AT = DRIVER_AT + DRIVER_DUR, WOBBLE_DUR = 0.9, WOBBLE_AMP_DEG = 2.2;
  const backOut = gsap.parseEase(`back.out(${BOUNCE_FACTOR})`);

  // Pure function of timeline time: ONE driver feeds both cards (causal link).
  function renderAt(t) {
    const raw = Math.min(1, Math.max(0, (t - DRIVER_AT) / DRIVER_DUR));
    const p = backOut(raw);
    const intruderX = INTRUDER_START_X * (1 - p);
    const intruderOpacity = Math.min(1, Math.max(0, p * FADE_IN_SHARPNESS));
    let intruderRot = -INTRUDER_TILT * (1 - p);
    // impact aftermath: damped sine wobble after the intruder plants
    if (t > WOBBLE_AT) {
      const w = Math.min(1, (t - WOBBLE_AT) / WOBBLE_DUR);
      intruderRot += Math.sin(w * Math.PI * 4) * WOBBLE_AMP_DEG * (1 - w);
    }
    const victimP = Math.min(1, p / VICTIM_FRACTION);
    const victimX = VICTIM_END_X * victimP;
    gsap.set("#intruder", { x: intruderX, rotation: intruderRot, opacity: intruderOpacity });
    gsap.set("#victim", { x: victimX, rotation: -VICTIM_KICK_DEG * victimP, opacity: 1 - victimP });
  }
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render;
  tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
