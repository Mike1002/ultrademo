<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-caption-takeover</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px;  }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .diagram { position: absolute; left: 110px; right: 110px; top: 240px; display: flex; align-items: center; gap: 30px; }
  .diagram i { height: 1px; background: #e3ded2; flex: 1; display: block; }
  .diagram .dot { width: 38px; height: 38px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; }
  .headline { position: absolute; left: 110px; top: 95px; font-size: 56px; font-weight: 700; }
  .rail { position: absolute; left: 70px; right: 70px; top: 480px; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 44px; white-space: nowrap; }
  .full { position: absolute; inset: 0; opacity: 0; background: #f6f3ec; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; will-change: transform; }
  .full .big { font-size: 112px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
  .full .dot { width: 24px; height: 24px; border-radius: 50%; background: #f2c200; border: 2px solid #1d1c1a; margin-top: 16px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="diagram" data-layout-allow-overlap data-layout-allow-occlusion><span class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Invite</span><i></i><span class="lab" data-layout-allow-overlap data-layout-allow-occlusion>Accept</span><i></i><span class="dot"></span></div>
      <div class="headline" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div>
      <div class="rail" id="rail" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team in one click.</div>
      <div class="full" id="full" data-layout-allow-overlap><span class="lab">The one line to remember</span><div class="big">Invite your team</div><div class="big">in one click.</div><div class="dot"></div></div>
    </div>
    <div id="label"><span class="l-name">Caption takeover</span><span class="l-sep">·</span><span>Captions</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Both states live in the DOM; the swap is instant, only the return is tweened.
  // #full starts hidden in CSS (a zero-duration set at 0 does not render at the playhead's exact 0).
  tl.set("#rail", { opacity: 0 }, 0.9);
  tl.set("#full", { opacity: 1, scale: 1 }, 0.9);
  tl.to("#full", { opacity: 0, scale: 0.98, duration: 0.25, ease: "power2.out" }, 2.1);
  tl.to("#rail", { opacity: 1, duration: 0.25, ease: "none" }, 2.1);
  // Quiet idle after the return so the clip is never frozen.
  tl.fromTo("#rail", { y: 6 }, { y: 0, duration: 0.6, ease: "power3.out" }, 2.1);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
