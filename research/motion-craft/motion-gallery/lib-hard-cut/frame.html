<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-hard-cut</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; will-change: transform, opacity, filter; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
  .card { position: absolute; left: 264px; top: 110px; width: 640px; height: 360px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; will-change: transform, filter, opacity; }
  .card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  .card h1 { position: absolute; left: 56px; top: 80px; font-size: 56px; font-weight: 700; line-height: 64px; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 160px; font-size: 22px; color: #6d6a63; white-space: nowrap; }
  .card .btn { position: absolute; left: 56px; top: 240px; width: 200px; height: 60px; border-radius: 14px; background: #f2c200; border: 2px solid #1d1c1a; color: #1d1c1a;
    font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; will-change: transform; }
  .card.b h1 { font-size: 96px; line-height: 104px; top: 74px; font-variant-numeric: tabular-nums; }
  .card.b .sub { top: 190px; }
  .card.b .bar { position: absolute; left: 56px; top: 250px; width: 300px; height: 14px; border-radius: 7px; background: #f2c200; border: 2px solid #1d1c1a; transform-origin: 0 50%; will-change: transform; }
  .cursor { position: absolute; width: 28px; height: 38px; z-index: 10; pointer-events: none; transform-origin: 2px 2px; will-change: transform; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
  .cursor svg { width: 28px; height: 38px; display: block; }

  .shot.a { background: #f6f3ec; }
  .shot.b { background: #ece7da; opacity: 0; }

</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">

      <div data-layout-allow-overlap data-layout-allow-occlusion class="shot a" id="A"><div class="card a " id="a" data-layout-allow-overlap ><div data-layout-allow-overlap data-layout-allow-occlusion class="lab">Orbit</div><h1 data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</h1><div data-layout-allow-overlap data-layout-allow-occlusion class="sub">3 seats left on this plan</div><div data-layout-allow-overlap data-layout-allow-occlusion class="btn">Continue</div></div><div class="cursor" id="cur" style="left:420px;top:380px" data-layout-allow-overlap ><svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg></div></div>
      <div data-layout-allow-overlap data-layout-allow-occlusion class="shot b" id="B"><div class="card b " id="b" data-layout-allow-overlap ><div data-layout-allow-overlap data-layout-allow-occlusion class="lab">This month</div><h1 data-layout-allow-overlap data-layout-allow-occlusion>12,480</h1><div data-layout-allow-overlap data-layout-allow-occlusion class="sub">invites sent</div><div data-layout-allow-overlap data-layout-allow-occlusion class="bar"></div></div></div>

    </div>
    <div id="label"><span class="l-name">Hard cut</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>

  const tl = gsap.timeline({ paused: true, defaults: { ease: "none" } });
  const CUT1 = 1.0, CUT2 = 2.0;
  tl.fromTo("#A", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
  tl.fromTo("#B", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo("#b .bar", { scaleX: 0.4 }, { scaleX: 0.4, duration: 0.01 }, 0);
  // Scene A keeps its own small life: the cursor drifts toward Continue across the whole clip and presses it near the end.
  tl.fromTo("#cur", { x: 470, y: 150 }, { x: 60, y: 40, duration: CUT1, ease: "power1.inOut" }, 0);
  tl.to("#cur", { x: 0, y: 0, duration: 0.45, ease: "power2.out" }, CUT2);
  tl.to("#cur", { scale: 0.85, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 2.55);
  tl.fromTo("#a .btn", { scale: 1 }, { scale: 0.95, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, 2.55);
  // Scene B keeps its own: the bar fills while it is on screen.
  tl.to("#b .bar", { scaleX: 1, duration: 0.9, ease: "power2.out" }, CUT1 + 0.05);
  // The cuts: zero overlap, A off and B on in the same frame at 1.0 s, back again at 2.0 s.
  tl.set("#A", { opacity: 0 }, CUT1);
  tl.set("#B", { opacity: 1 }, CUT1);
  tl.set("#A", { opacity: 1 }, CUT2);
  tl.set("#B", { opacity: 0 }, CUT2);
  // The number ticks up while B is on screen (12,462 to 12,480), written from time so a cold seek shows the right digits.
  const h1 = document.querySelector("#b h1"), fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const tick = gsap.parseEase("power2.out");
  function renderAt(t) {
    const p = Math.max(0, Math.min(1, (t - CUT1) / (CUT2 - CUT1)));
    h1.textContent = fmt(12462 + Math.round(18 * tick(p)));
  }
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };

  window.__timelines["main"] = tl;
</script>
</body>
</html>
