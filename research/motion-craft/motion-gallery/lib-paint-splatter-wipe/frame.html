<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-paint-splatter-wipe</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .panel { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .art { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  .art.a { background: #ece7da; }
  .art.b { background: #f6f3ec; }
  .card { position: absolute; left: 204px; top: 100px; width: 760px; height: 380px; background: #fffdf8;
    border: 2px solid #1d1c1a; border-radius: 24px; }
  .card .eyebrow { position: absolute; left: 56px; top: 44px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .card .h1 { position: absolute; left: 56px; top: 84px; font-size: 56px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .card .sub { position: absolute; left: 56px; top: 164px; font-size: 22px; color: #6d6a63; }
  .card .btn { position: absolute; left: 56px; top: 254px; width: 200px; height: 60px; background: #f2c200; border: 2px solid #1d1c1a;
    border-radius: 14px; font-size: 20px; font-weight: 700; line-height: 56px; text-align: center; color: #1d1c1a; }
  .card .av { position: absolute; top: 44px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #1d1c1a; background: #ece7da;
    font-size: 20px; font-weight: 700; line-height: 60px; text-align: center; }
  .card .av.v1 { left: 540px; } .card .av.v2 { left: 592px; } .card .av.v3 { left: 644px; }
  .art.b .num { position: absolute; left: 92px; top: 86px; font-size: 136px; font-weight: 700; line-height: 1; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .art.b .cap { position: absolute; left: 100px; top: 236px; font-size: 22px; color: #6d6a63; }
  .art.b .row { position: absolute; left: 96px; width: 520px; height: 60px; border-top: 2px solid #e3ded2; font-size: 22px; line-height: 58px;
    padding-left: 30px; will-change: transform; }
  .art.b .row .dot { position: absolute; left: 0; top: 24px; width: 12px; height: 12px; border-radius: 50%; background: #f2c200; }
  .art.b .row.r1 { top: 320px; } .art.b .row.r2 { top: 384px; } .art.b .row.r3 { top: 448px; }
  .art.b .disc { will-change: transform; position: absolute; left: 780px; top: 150px; width: 280px; height: 280px; border-radius: 50%; background: #f2c200;
    border: 2px solid #1d1c1a; text-align: center; color: #1d1c1a; }
  .art.b .disc .pct { position: absolute; left: 0; width: 276px; top: 86px; font-size: 72px; font-weight: 700; line-height: 1; }
  .art.b .disc .pl { position: absolute; left: 0; width: 276px; top: 166px; font-size: 18px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }

  #B { clip-path: url(#sp); -webkit-clip-path: url(#sp); }
  #defs { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #rim { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="panel" id="A"><div class="art a" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class="card"><div class="eyebrow" data-layout-allow-overlap data-layout-allow-occlusion>Orbit</div><div class="h1" data-layout-allow-overlap data-layout-allow-occlusion>Invite your team</div><div class="sub" data-layout-allow-overlap data-layout-allow-occlusion>3 seats left</div><div class="btn" data-layout-allow-overlap data-layout-allow-occlusion>Continue</div><div class="av v1" data-layout-allow-overlap data-layout-allow-occlusion>JD</div><div class="av v2" data-layout-allow-overlap data-layout-allow-occlusion>SK</div><div class="av v3" data-layout-allow-overlap data-layout-allow-occlusion>ML</div></div></div></div>
      <div class="panel" id="B" data-layout-allow-overlap><div class="art b" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow><div class="num" data-layout-allow-overlap data-layout-allow-occlusion>12,480</div><div class="cap" data-layout-allow-overlap data-layout-allow-occlusion>invites sent</div><div class="row r1" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Jamie Dalton</div><div class="row r2" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Sam Kim</div><div class="row r3" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span>Morgan Lee</div><div class="disc" data-layout-allow-overlap data-layout-allow-occlusion><div class="pct" data-layout-allow-overlap data-layout-allow-occlusion>98%</div><div class="pl" data-layout-allow-overlap data-layout-allow-occlusion>accepted</div></div></div></div>
      <svg id="rim" viewBox="0 0 1168 580" data-layout-allow-overlap><g id="rimg"></g></svg>
      <svg id="defs" data-layout-allow-overlap><defs><clipPath id="sp" clipPathUnits="userSpaceOnUse"></clipPath></defs></svg>
    </div>
    <div id="label"><span class="l-name">Paint splatter wipe</span><span class="l-sep">·</span><span>Transitions</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  // One irregular blob (14 seeded lobes, smoothed) and 12 seeded droplets, built once with seed 1; the same shapes clip the stats scene and draw a yellow paint rim on top.
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = rand(1), CX = 584, CY = 290, NS = "http://www.w3.org/2000/svg";
  const pts = [];
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, r = 300 * (0.72 + rnd() * 0.56); pts.push([CX + Math.cos(a) * r, CY + Math.sin(a) * r * 0.9]); }
  let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (let i = 0; i < 14; i++) {
    const p0 = pts[(i + 13) % 14], p1 = pts[i], p2 = pts[(i + 1) % 14], p3 = pts[(i + 2) % 14];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += " C" + c1[0].toFixed(1) + " " + c1[1].toFixed(1) + " " + c2[0].toFixed(1) + " " + c2[1].toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
  }
  const dots = [];
  for (let i = 0; i < 12; i++) { const a = rnd() * Math.PI * 2, r = 330 + rnd() * 240; dots.push({ x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r * 0.85, r: 14 + rnd() * 30, delay: rnd() * 0.12 }); }
  function make(host, isRim) {
    const blob = document.createElementNS(NS, "path"); blob.setAttribute("d", d); blob.id = (isRim ? "rim" : "clip") + "Blob";
    if (isRim) { blob.setAttribute("fill", "none"); blob.setAttribute("stroke", "#f2c200"); blob.setAttribute("stroke-width", "16"); blob.setAttribute("vector-effect", "non-scaling-stroke"); }
    host.appendChild(blob);
    dots.forEach((p, i) => {
      const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", p.x.toFixed(1)); c.setAttribute("cy", p.y.toFixed(1)); c.setAttribute("r", "0"); c.id = (isRim ? "rim" : "clip") + "Dot" + i;
      if (isRim) { c.setAttribute("fill", "none"); c.setAttribute("stroke", "#f2c200"); c.setAttribute("stroke-width", "8"); }
      host.appendChild(c);
    });
  }
  make(document.getElementById("sp"), false);
  make(document.getElementById("rimg"), true);
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  const T0 = 0.95, DUR = 0.8;
  // Droplets land first (0.7 s on), then the main blob bursts from the centre, scale 0 to 3.4 over 0.8 s power3.out (its shortest lobe then passes the far corners), until no pixel of the invite scene is left.
  dots.forEach((p, i) => {
    tl.fromTo("#clipDot" + i, { attr: { r: 0 } }, { attr: { r: p.r }, duration: 0.4, ease: "back.out(1.4)" }, 0.7 + p.delay);
    tl.fromTo("#rimDot" + i, { attr: { r: 0 } }, { attr: { r: p.r }, duration: 0.4, ease: "back.out(1.4)" }, 0.7 + p.delay);
  });
  tl.fromTo("#clipBlob", { scale: 0, svgOrigin: CX + " " + CY }, { scale: 3.4, duration: DUR, ease: "power3.out" }, T0);
  tl.fromTo("#rimBlob", { scale: 0, svgOrigin: CX + " " + CY }, { scale: 3.4, duration: DUR, ease: "power3.out" }, T0);
  tl.fromTo("#rimg", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "none" }, T0 + 0.5);
  const ROWS_AT = 1.9;
  // Second beat: the three rows of the new scene settle in so the clip keeps moving.
  tl.fromTo(".art.b .row.r1", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT);
  tl.fromTo(".art.b .row.r2", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT + 0.1);
  tl.fromTo(".art.b .row.r3", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.5 }, ROWS_AT + 0.2);
  tl.fromTo(".art.b .disc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, ROWS_AT + 0.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
