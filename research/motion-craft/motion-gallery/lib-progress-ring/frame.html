<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-progress-ring</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #chart text { font-size: 22px; fill: #1d1c1a; font-variant-numeric: tabular-nums; }
  #chart .small { font-size: 16px; fill: #6d6a63; }
  #chart .big { font-size: 84px; font-weight: 700; fill: #1d1c1a; }
  .heading { position: absolute; left: 32px; top: 26px; font-size: 34px; font-weight: 700; }
  .sub { position: absolute; left: 34px; top: 72px; font-size: 16px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="heading">Seats fill as the team joins</div>
      <div class="sub">The ring and the number arrive at the same value</div>
      <svg id="chart" viewBox="0 0 1168 580" xmlns="http://www.w3.org/2000/svg">
        <circle cx="370" cy="330" r="172" fill="none" stroke="#e3ded2" stroke-width="22"/>
        <circle id="ring" cx="370" cy="330" r="172" fill="none" stroke="#f2c200" stroke-width="22" stroke-linecap="round" transform="rotate(-90 370 330)"/>
        <text id="pct" class="big" x="370" y="353" text-anchor="middle">0%</text>
        <text class="small" x="370" y="390" text-anchor="middle">seats filled</text>
        <text x="670" y="287">Of 100 seats</text>
        <text id="count" class="big" x="670" y="373">0</text>
        <text class="small" x="674" y="425">Orbit workspace · invites accepted</text>
      </svg>
    </div>
    <div id="label"><span class="l-name">Progress ring</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  const C = 2 * Math.PI * 172;
  const ring = document.querySelector("#ring"), pctEl = document.querySelector("#pct"), countEl = document.querySelector("#count");
  const out2 = p => 1 - (1 - p) * (1 - p);
  // p(t): 0 -> 0.75 over 0.45..1.85 s (power2.out), then a quiet second step 0.75 -> 0.82 over 2.3..2.9 s.
  function progressAt(t) {
    const a = out2(Math.max(0, Math.min(1, (t - 0.45) / 1.4)));
    const b = out2(Math.max(0, Math.min(1, (t - 2.3) / 0.6)));
    return 0.75 * a + 0.07 * b;
  }
  function renderAt(t) {
    const p = progressAt(t), n = Math.round(p * 100);
    ring.setAttribute("stroke-dasharray", C);
    ring.setAttribute("stroke-dashoffset", C * (1 - p));
    pctEl.textContent = n + "%";
    countEl.textContent = n;
  }
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
