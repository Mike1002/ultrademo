<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-push-in</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  .num { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .t-xl { font-size: 84px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .t-l { font-size: 56px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .t-m { font-size: 34px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .t-body { font-size: 22px; line-height: 1.4; }
  .hair { height: 1px; background: #e3ded2; }
  .dot { border-radius: 50%; background: #1d1c1a; }
  .dot.v { background: #f2c200; border: 2px solid #1d1c1a; }

  #sentence { position: absolute; left: 0; top: 205px; width: 1168px; height: 170px; display: flex; align-items: center; justify-content: center; gap: 24px; white-space: nowrap; will-change: transform; }
  #sentence .w { display: block; position: relative; font-size: 84px; font-weight: 700; line-height: 1.1; }
  #sentence .w.key { color: #1d1c1a; }
  #sentence .ul { position: absolute; left: 0; bottom: -6px; width: 100%; height: 10px; background: #f2c200; border-radius: 5px; }
  .head { position: absolute; left: 70px; top: 65px; }

  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">

      <div class="head lab">Push in on the key word · 1.6×</div>
      <div id="sentence" data-layout-allow-overlap data-layout-allow-overflow><div class="w" data-layout-allow-overflow>Every</div><div class="w key" id="key" data-layout-allow-overflow>frame<div class="ul" id="ul"></div></div><div class="w" data-layout-allow-overflow>is code.</div></div>

    </div>
    <div id="label"><span class="l-name">Push-in</span><span class="l-sep">·</span><span>Camera</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });

  // Push-in: scale the whole sentence about the centre of the key word, so neighbours slide to the edges.
  const sr = document.getElementById("sentence").getBoundingClientRect();
  const kr = document.getElementById("key").getBoundingClientRect();
  const ox = kr.left - sr.left + kr.width / 2;
  gsap.set("#sentence", { transformOrigin: ox + "px 85px" });
  tl.fromTo("#sentence", { scale: 1 }, { scale: 1.6, duration: 2.0, ease: "power1.inOut" }, 0.3);
  tl.fromTo("#ul", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.3);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
