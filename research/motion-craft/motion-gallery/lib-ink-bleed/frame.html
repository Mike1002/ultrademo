<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-ink-bleed</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; overflow: hidden; }
  #cv { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage"><canvas id="cv" width="1168" height="580"></canvas></div>
    <div id="label"><span class="l-name">Ink bleed</span><span class="l-sep">·</span><span>Texture &amp; Style</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  function rand(seed){ let a = seed >>> 0 || 1; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const W = 1168, H = 580, INK = "#1d1c1a", ACC = "#f2c200", MUTED = "#6d6a63";
  const SANS = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  const clamp = x => Math.max(0, Math.min(1, x));
  const out = x => 1 - Math.pow(1 - clamp(x), 3);
  const mix = (a, b, p) => a + (b - a) * p;
  const rng = rand(303);
  const blobs = Array.from({ length: 23 }, () => ({ x: 350 + rng() * 470, y: 210 + rng() * 130, r: 18 + rng() * 28, phase: rng() * 6.28 }));
  function circle(x, y, r, color, alpha) { ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  // Source timing (4 s) compressed to 3 s: blobs grow 0-0.7 s, bleed and merge, then contract 0.95-1.9 s as the headline sharpens.
  function renderAt(t) {
    ctx.clearRect(0, 0, W, H); ctx.globalAlpha = 1; ctx.filter = "none";
    ctx.fillStyle = INK; ctx.font = "24px " + SANS; ctx.textAlign = "left"; ctx.fillText("Words soaking into paper", 104, 95);
    ctx.fillStyle = MUTED; ctx.font = "18px " + SANS; ctx.fillText("From bleed to shape", 104, 514);
    const grow = out(t / 0.7), settle = out((t - 0.95) / 0.95), a = 1 - settle;
    ctx.filter = "blur(" + mix(16, 0, settle) + "px)";
    for (const b of blobs) circle(b.x + Math.sin(b.phase + t * 1.3) * 12 * a, b.y, b.r * grow * (1 + grow * 0.7) * (1 - settle), INK, a * 0.9);
    ctx.globalAlpha = out((t - 0.4) / 1.2);
    ctx.fillStyle = INK; ctx.font = "700 108px " + SANS; ctx.textAlign = "center"; ctx.fillText("Launch day.", 584, 330); ctx.textAlign = "left";
    ctx.globalAlpha = 1; ctx.filter = "none";
    // Yellow mark lands late, then a slow second bleed ring expands under it so the clip keeps moving.
    const ring = clamp((t - 2.2) / 0.8);
    if (ring > 0) circle(898, 200, 39 + ring * 60, ACC, 0.35 * (1 - ring));
    circle(898, 200, 39 * out((t - 1.3) / 0.5), ACC, 1);
    if (t > 1.3) { ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.beginPath(); ctx.arc(898, 200, 39 * out((t - 1.3) / 0.5), 0, Math.PI * 2); ctx.stroke(); }
  }
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render; tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
