<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>control-target-sync</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  /* target surface: 720x480 at (80,120) */
  .surface { position: absolute; left: 80px; top: 120px; width: 720px; height: 480px; background: #fffdf8;
    border: 2px solid #1d1c1a; border-radius: 24px; }
  .line { position: absolute; left: 44px; top: 44px; font-size: 36px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { position: absolute; left: 44px; top: 96px; font-size: 18px; color: #6d6a63; }
  /* target button 280x80 centred in the lower half: surface-relative (220, 280) -> centre (360, 320) */
  .target { position: absolute; left: 220px; top: 280px; width: 280px; height: 80px; border-radius: 18px; background: #f2c200;
    border: 2px solid #1d1c1a; font-size: 26px; font-weight: 700; display: grid; place-items: center;
    transform-origin: 50% 50%; will-change: transform; }
  /* inspector panel: 340x480 at (860,120) */
  .panel { position: absolute; left: 860px; top: 120px; width: 340px; height: 480px; background: #fffdf8;
    border: 2px solid #1d1c1a; border-radius: 24px; }
  .panel-title { position: absolute; left: 28px; top: 28px; font-size: 18px; color: #6d6a63; }
  .row { position: absolute; left: 28px; width: 284px; height: 56px; border-bottom: 2px solid #e3ded2;
    display: flex; align-items: center; justify-content: space-between; font-size: 20px; }
  .row .k { color: #6d6a63; }
  .row .v { font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; font-weight: 700;
    border: 2px solid #e3ded2; border-radius: 10px; padding: 6px 12px; }
  .row .v.active { border-color: #1d1c1a; }
  #row-rot { top: 80px; } #row-size { top: 152px; } #row-shift { top: 224px; }
  .hint { position: absolute; left: 28px; top: 420px; font-size: 16px; color: #6d6a63; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div class="surface">
      <div class="line">Every frame is code</div>
      <div class="sub">Edit the control, the button answers in the same frame</div>
      <div class="target" id="target-button">Continue</div>
    </div>
    <div class="panel">
      <div class="panel-title">Inspector</div>
      <div class="row" id="row-rot"><span class="k">Rotation</span><span class="v" id="rotation-readout">0°</span></div>
      <div class="row" id="row-size"><span class="k">Size</span><span class="v" id="size-readout">Medium</span></div>
      <div class="row" id="row-shift"><span class="k">Offset</span><span class="v" id="shift-readout">0 px</span></div>
      <div class="hint">One gesture, two surfaces</div>
    </div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  // Beat 1 (continuous couple): rotation scrub 0 -> -10 deg over 1.0 s power2.inOut, readout and target at ONE label.
  // Beat 2 (discrete couple): one state array carries readout text AND target scale; lands on "Large".
  const EDIT1_AT = 0.3, SCRUB_DUR = 1.0, SCRUB_EASE = "power2.inOut", ROT_TARGET = -10;
  const EDIT2_AT = 1.75;
  const STEPS = [
    { t: 0.0, text: "Medium", scale: 1.0 },   // equals the initial DOM state
    { t: 0.3, text: "Large", scale: 1.3 },
    { t: 0.65, text: "Small", scale: 0.85 },
    { t: 0.95, text: "Large", scale: 1.3 },   // lands and holds
  ];
  const STEPS_TOTAL = 1.1;
  const scrubEase = gsap.parseEase(SCRUB_EASE);
  const rotReadout = document.getElementById("rotation-readout");
  const sizeReadout = document.getElementById("size-readout");
  const rotRow = rotReadout, sizeRow = sizeReadout;

  tl.addLabel("edit1", EDIT1_AT);
  // Target half of the couple: a real transform tween at the label.
  tl.fromTo("#target-button", { rotation: 0 }, { rotation: ROT_TARGET, duration: SCRUB_DUR, ease: SCRUB_EASE }, "edit1");

  // Readout half + discrete couple: pure function of timeline time, same ease, same window (no overshoot: the readout is data).
  const stepAt = (time) => [...STEPS].reverse().find((s) => time >= s.t) ?? STEPS[0];
  function renderAt(t) {
    const p = Math.min(1, Math.max(0, (t - EDIT1_AT) / SCRUB_DUR));
    const v = ROT_TARGET * scrubEase(p);
    rotReadout.textContent = `${Math.round(v)}°`;
    rotRow.classList.toggle("active", t >= EDIT1_AT && t < EDIT1_AT + SCRUB_DUR + 0.3);
    const s = stepAt(Math.min(STEPS_TOTAL, t - EDIT2_AT));
    sizeReadout.textContent = s.text;           // both sides read the same state entry
    gsap.set("#target-button", { scale: s.scale });
    sizeRow.classList.toggle("active", t >= EDIT2_AT);
  }
  renderAt(0);
  tl.to({ k: 0 }, { k: 1, duration: 3, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
  const baseRender = tl.render;
  tl.render = function () { const r = baseRender.apply(this, arguments); renderAt(this.time()); return r; };
  window.__timelines["main"] = tl;
</script>
</body>
</html>
