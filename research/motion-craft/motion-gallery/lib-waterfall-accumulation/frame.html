<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-waterfall-accumulation</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #chart { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #chart text { font-size: 22px; fill: #1d1c1a; font-variant-numeric: tabular-nums; }
  #chart .val { font-weight: 700; }
  #chart .small { font-size: 16px; fill: #6d6a63; }
  #chart .grid { stroke: #e3ded2; stroke-width: 2; }
  #chart .axis { stroke: #1d1c1a; stroke-width: 2; }
  .heading { position: absolute; left: 32px; top: 26px; font-size: 34px; font-weight: 700; }
  .sub { position: absolute; left: 34px; top: 72px; font-size: 16px; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="heading">Changes add up to the total</div>
      <div class="sub">Each bar starts where the previous one ended</div>
      <svg id="chart" viewBox="0 0 1168 580" xmlns="http://www.w3.org/2000/svg">
        <line class="grid" x1="180" y1="180" x2="1040" y2="180"/><line class="grid" x1="180" y1="270" x2="1040" y2="270"/>
        <line class="grid" x1="180" y1="360" x2="1040" y2="360"/><line class="grid" x1="180" y1="450" x2="1040" y2="450"/>
        <line class="axis" x1="180" y1="450" x2="1040" y2="450"/>
        <text class="small" x="180" y="155">Seats · net change this quarter</text>
        <rect id="wf0" x="215" y="450" width="90" height="0" fill="#1d1c1a"/><text id="wval0" class="val" x="260" y="289" text-anchor="middle">80</text><text x="260" y="492" text-anchor="middle">Start</text>
        <line id="con0" x1="305" y1="302" x2="380" y2="302" stroke="#a19d93" stroke-width="2" stroke-dasharray="75" stroke-dashoffset="75"/>
        <rect id="wf1" x="380" y="302" width="90" height="0" fill="#1d1c1a"/><text id="wval1" class="val" x="425" y="224" text-anchor="middle">+35</text><text x="425" y="492" text-anchor="middle">Email</text>
        <line id="con1" x1="470" y1="237.25" x2="545" y2="237.25" stroke="#a19d93" stroke-width="2" stroke-dasharray="75" stroke-dashoffset="75"/>
        <rect id="wf2" x="545" y="237.25" width="90" height="0" fill="#1d1c1a"/><text id="wval2" class="val" x="590" y="178" text-anchor="middle">+25</text><text x="590" y="492" text-anchor="middle">Link</text>
        <line id="con2" x1="635" y1="191" x2="710" y2="191" stroke="#a19d93" stroke-width="2" stroke-dasharray="75" stroke-dashoffset="75"/>
        <rect id="wf3" x="710" y="191" width="90" height="0" fill="#f2c200" stroke="#1d1c1a" stroke-width="2"/><text id="wval3" class="val" x="755" y="178" text-anchor="middle">−20</text><text x="755" y="492" text-anchor="middle">Left</text>
        <line id="con3" x1="800" y1="228" x2="875" y2="228" stroke="#a19d93" stroke-width="2" stroke-dasharray="75" stroke-dashoffset="75"/>
        <rect id="wf4" x="875" y="450" width="90" height="0" fill="#1d1c1a"/><text id="wval4" class="val" x="920" y="215" text-anchor="middle">120</text><text x="920" y="492" text-anchor="middle">Total</text>
        <text class="small" x="180" y="550">80 + 35 + 25 − 20 = 120 seats</text>
      </svg>
    </div>
    <div id="label"><span class="l-name">Waterfall accumulation</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Each bar grows (0.4 s) from the previous cumulative endpoint; a connector then bridges to the next bar; 0.15 s rest between.
  const bars = [
    { id: 0, y0: 450, y1: 302, h: 148, at: 0.25 },
    { id: 1, y0: 302, y1: 237.25, h: 64.75, at: 0.8 },
    { id: 2, y0: 237.25, y1: 191, h: 46.25, at: 1.35 },
    { id: 3, y0: 191, y1: 191, h: 37, at: 1.9 },
    { id: 4, y0: 450, y1: 228, h: 222, at: 2.45 }
  ];
  bars.forEach(b => {
    tl.fromTo("#wf" + b.id, { attr: { y: b.y0, height: 0 } }, { attr: { y: b.y1, height: b.h }, duration: 0.4, ease: "power2.out" }, b.at);
    tl.fromTo("#wval" + b.id, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.2 }, b.at + 0.4);
    if (b.id < 4) tl.fromTo("#con" + b.id, { strokeDashoffset: 75 }, { strokeDashoffset: 0, duration: 0.14, ease: "none" }, b.at + 0.4);
  });
  window.__timelines["main"] = tl;
</script>
</body>
</html>
