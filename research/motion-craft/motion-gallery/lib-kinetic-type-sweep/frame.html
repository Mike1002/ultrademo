<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-kinetic-type-sweep</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; left: 0; top: 0; width: 1280px; height: 640px; overflow: hidden; }
  .lab { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  .row { position: absolute; left: 0; height: 193px; line-height: 193px; white-space: nowrap; will-change: transform; font-weight: 700; font-size: 200px; letter-spacing: -.04em; }
  .r1 { top: -11px; color: #1d1c1a; }
  .r2 { top: 193px; color: #1d1c1a; }
  .r3 { top: 404px; font-size: 210px; color: #a19d93; font-variant-numeric: tabular-nums; }
  .r2 span { display: inline-block; }
  #hit { transform-origin: 50% 60%; will-change: transform; }
  .band { position: absolute; left: 0; width: 1280px; height: 2px; background: #1d1c1a; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="row r1" id="R1" data-layout-allow-overlap data-layout-allow-overflow>Every frame is code · Every frame is code · Every frame is code ·</div>
      <div class="row r2" id="R2" data-layout-allow-overlap data-layout-allow-overflow><span class="rest" id="rest1">Ship it · Show it · Every frame is code ·&nbsp;</span><span id="hit">Launch day</span><span class="rest" id="rest2">&nbsp;· Ship it · Show it</span></div>
      <div class="row r3" id="R3" data-layout-allow-overlap data-layout-allow-overflow>12,480 · 98% · 1,284 · 3 · 12,480 · 98%</div>
      <div class="band" id="band1" style="top: 198px" data-layout-allow-overlap></div>
      <div class="band" id="band2" style="top: 401px" data-layout-allow-overlap></div>
    </div>
    <div id="label"><span class="l-name">Kinetic type sweep</span><span class="l-sep">·</span><span>Typography</span><span class="l-sep">·</span><span>high</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // Row 1 left and fast, row 3 left and slow, both easing off.
  tl.fromTo("#R1", { x: 1300 }, { x: -1500, duration: 2.2, ease: "power2.out" }, 0.1);
  tl.fromTo("#R3", { x: 1300 }, { x: -60, duration: 2.2, ease: "power2.out" }, 0.1);
  // Row 2 right at constant speed, then a hard power4.out stop with the key word at the horizontal centre.
  const r2 = document.getElementById("R2"), hit = document.getElementById("hit");
  const xEnd = 640 - (hit.offsetLeft + hit.offsetWidth / 2);
  const xStart = -r2.offsetWidth - 40;
  const L = xEnd - xStart, s = L * 0.0448; // constant-speed end velocity = power4.out start velocity for 1.6 s + 0.3 s
  tl.fromTo("#R2", { x: xStart }, { x: xEnd - s, duration: 1.6, ease: "none" }, 0.1);
  tl.to("#R2", { x: xEnd, duration: 0.3, ease: "power4.out" }, 1.701);
  // On the stop: only the key word turns yellow, the rest of the row and the other rows go faint.
  tl.fromTo("#hit", { color: "#1d1c1a", scale: 1.07 }, { color: "#f2c200", scale: 1, duration: 0.35, ease: "power3.out" }, 1.72);
  tl.fromTo("#R2 .rest", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "none" }, 1.8);
  tl.fromTo("#R1, #R3", { opacity: 1 }, { opacity: 0.13, duration: 0.5, ease: "none" }, 1.75);
  tl.fromTo(".band", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out", transformOrigin: "50% 50%" }, 1.8);
  // Idle: the stopped word breathes very slightly so the hold is not frozen.
  tl.to("#hit", { scale: 1.015, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.1);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
