<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-icon-flight</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #card { position: absolute; left: 264px; top: 90px; width: 640px; height: 400px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  #card .lab { position: absolute; left: 56px; top: 48px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #card h1 { position: absolute; left: 56px; top: 76px; font-size: 40px; font-weight: 700; line-height: 48px; white-space: nowrap; }
  #card .sub { position: absolute; left: 56px; top: 134px; font-size: 20px; color: #6d6a63; white-space: nowrap; }
  #btn { position: absolute; left: 56px; top: 236px; width: 320px; height: 80px; border-radius: 18px; background: #f2c200; border: 2px solid #1d1c1a; will-change: transform; }
  #btn .t { position: absolute; left: 36px; top: 0; height: 76px; line-height: 76px; font-size: 26px; font-weight: 700; white-space: nowrap; }
  #t2 { opacity: 0; }
  #win { position: absolute; left: 244px; top: 16px; width: 44px; height: 44px; overflow: hidden; }
  #win svg { position: absolute; left: 0; top: 0; width: 44px; height: 44px; display: block; will-change: transform, opacity; }
  #chk { opacity: 0; }
  #hint { position: absolute; left: 56px; top: 340px; font-size: 16px; color: #6d6a63; white-space: nowrap; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="card">
        <div class="lab">Orbit</div>
        <h1>Invite your team</h1>
        <div class="sub">12,480 invites sent this month</div>
        <div id="btn">
          <div class="t" id="t1" data-layout-allow-overlap>Export</div>
          <div class="t" id="t2" data-layout-allow-overlap>Exported</div>
          <div id="win" data-layout-allow-overflow>
            <svg id="arw" viewBox="0 0 44 44" data-layout-allow-overlap><path d="M12 32 L32 12 M16 12 L32 12 L32 28" fill="none" stroke="#1d1c1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg id="chk" viewBox="0 0 44 44" data-layout-allow-overlap><path d="M10 23 L19 32 L34 13" fill="none" stroke="#1d1c1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div id="hint">Sends the member list as a file</div>
      </div>
    </div>
    <div id="label"><span class="l-name">Icon flight</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out", duration: 0.5 } });
  // Params: 500 ms flight, 24 px travel, power2.out. The arrow lifts out of the top of its window and fades while the
  // check drops in from below; the button text crossfades. A beat later the pair reverses.
  const D = 0.5, T = 24;
  tl.fromTo("#arw", { y: 0, opacity: 1 }, { y: 0, opacity: 1, duration: 0.01, ease: "none" }, 0);
  tl.fromTo("#chk", { y: T, opacity: 0 }, { y: T, opacity: 0, duration: 0.01, ease: "none" }, 0);
  tl.fromTo("#t1", { opacity: 1 }, { opacity: 1, duration: 0.01, ease: "none" }, 0);
  tl.fromTo("#t2", { opacity: 0 }, { opacity: 0, duration: 0.01, ease: "none" }, 0);
  // press, then flight out / in
  tl.fromTo("#btn", { scale: 1 }, { scale: 0.97, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, 0.45);
  tl.to("#arw", { y: -T, opacity: 0, duration: D, ease: "power2.out" }, 0.6);
  tl.to("#chk", { y: 0, opacity: 1, duration: D, ease: "power2.out" }, 0.66);
  tl.to("#t1", { opacity: 0, duration: 0.25, ease: "none" }, 0.6);
  tl.to("#t2", { opacity: 1, duration: 0.25, ease: "none" }, 0.72);
  // reverse: the check leaves downward, the arrow drops back in from above
  tl.to("#chk", { y: T, opacity: 0, duration: D, ease: "power2.out" }, 2.0);
  tl.to("#arw", { y: 0, opacity: 1, duration: D, ease: "power2.out" }, 2.06);
  tl.to("#t2", { opacity: 0, duration: 0.25, ease: "none" }, 2.0);
  tl.to("#t1", { opacity: 1, duration: 0.25, ease: "none" }, 2.12);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
