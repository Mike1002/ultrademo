  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #art { position: absolute; left: 0; top: 0; width: 1168px; height: 580px; }
  #art text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 290px; letter-spacing: -0.02em; }
  #cap { position: absolute; left: 0; top: 470px; width: 1168px; text-align: center; font-size: 18px; color: #6d6a63; letter-spacing: .06em; text-transform: uppercase; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }

  </section>

<script>
  // Params: fill travel x -132 -> 132 px (one band period per second) with sine.inOut and fill scale 1.15 -> 1.3 linear, over the 3 s clip;
  // the letters are an SVG clipPath and the outline on top never moves. Only the band group is tweened (SVG transform, no layout).
  const tl = gsap.timeline({ paused: true, defaults: { ease: "sine.inOut", duration: 3 } });
  tl.fromTo("#fill", { x: -132, scale: 1.15, transformOrigin: "50% 50%" }, { x: 132, duration: 3, ease: "sine.inOut" }, 0);
  tl.fromTo("#fill", { scale: 1.15 }, { scale: 1.3, duration: 3, ease: "none", immediateRender: false }, 0);
  window.__timelines["main"] = tl;
</script>
