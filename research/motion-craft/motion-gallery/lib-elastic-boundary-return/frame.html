<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-elastic-boundary-return</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  #panel { position: absolute; left: 120px; top: 70px; width: 640px; height: 440px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 24px; }
  #panel .lab { position: absolute; left: 40px; top: 32px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #panel h1 { position: absolute; left: 40px; top: 54px; font-size: 32px; font-weight: 700; line-height: 40px; white-space: nowrap; }
  #edge { position: absolute; left: 758px; top: 70px; width: 0; height: 440px; border-left: 2px dashed #f2c200; }
  #edgeLab { position: absolute; left: 776px; top: 262px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; white-space: nowrap; }
  .m { position: absolute; left: 160px; width: 560px; height: 80px; background: #fffdf8; border: 2px solid #1d1c1a; border-radius: 16px; }
  .m .av { position: absolute; left: 20px; top: 18px; width: 40px; height: 40px; border-radius: 50%; background: #ece7da; border: 2px solid #1d1c1a; }
  .m .nm { position: absolute; left: 80px; top: 16px; font-size: 22px; font-weight: 600; white-space: nowrap; }
  .m .rl { position: absolute; left: 80px; top: 46px; font-size: 15px; color: #6d6a63; white-space: nowrap; }
  .m .grip { position: absolute; right: 22px; top: 30px; width: 20px; height: 20px; background: radial-gradient(circle, #a19d93 2.5px, transparent 3px) 0 0 / 10px 10px; }
  #drag { will-change: transform; box-shadow: 0 12px 28px rgba(29,28,26,0.16); background: #fbf3cf; }
  #band { position: absolute; left: 556px; top: 36px; width: 160px; height: 6px; border-radius: 3px; background: #f2c200; transform-origin: 0 50%; will-change: transform; }
  .cursor { position: absolute; left: 0; top: 0; width: 28px; height: 38px; z-index: 10; pointer-events: none;
    transform-origin: 2px 2px; will-change: transform; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
  .cursor svg { width: 28px; height: 38px; display: block; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div id="panel">
        <div class="lab">Orbit</div>
        <h1>Invite your team</h1>
      </div>
      <div id="edge"></div><div id="edgeLab">List edge</div>
      <div class="m" style="top:190px"><div class="av"></div><div class="nm">Jamie Dalton</div><div class="rl">Owner</div><div class="grip"></div></div>
      <div class="m" id="drag" style="top:290px" data-layout-allow-overlap data-layout-allow-overflow>
        <div class="av"></div><div class="nm">Sam Kim</div><div class="rl">Admin · dragging</div><div class="grip"></div>
        <div id="band" data-layout-allow-overlap></div>
      </div>
      <div class="m" style="top:390px"><div class="av"></div><div class="nm">Morgan Lee</div><div class="rl">Member</div><div class="grip"></div></div>
      <div class="cursor" id="cur" data-layout-allow-overlap>
        <svg viewBox="0 0 28 38"><path d="M2.5 2.5 L2.5 29.5 L9.6 23 L14.4 33.6 L19 31.6 L14.3 21.4 L23.8 21.4 Z" fill="#ffffff" stroke="#1d1c1a" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="label"><span class="l-name">Elastic boundary return</span><span class="l-sep">·</span><span>UI Demo</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 0.4 } });
  // Params: boundary at 40 px (the card's edge meets the list edge), overscroll factor 0.5 beyond it, 0.4 s return with a back ease.
  // The pointer moves at constant speed, so the card's travel is two straight tweens: 1:1 up to the limit, then half speed.
  const LIMIT = 40, K = 0.5, BAND = 160;
  const GX = 690, GY = 330;    // where the pointer grabs the card (its grip)
  tl.fromTo("#cur", { x: 560, y: 440 }, { x: 560, y: 440, duration: 0.01, ease: "none" }, 0);
  tl.fromTo("#drag", { x: 0 }, { x: 0, duration: 0.01, ease: "none" }, 0);
  tl.fromTo("#band", { scaleX: 0 }, { scaleX: 0, duration: 0.01, ease: "none" }, 0);
  function drag(raw, t0, T, tRelease) {
    const shown = LIMIT + (raw - LIMIT) * K;
    const tLimit = T * LIMIT / raw;
    tl.to("#cur", { x: GX + raw, duration: T, ease: "none" }, t0);
    tl.to("#drag", { x: LIMIT, duration: tLimit, ease: "none" }, t0);
    tl.to("#drag", { x: shown, duration: T - tLimit, ease: "none" }, t0 + tLimit);
    tl.to("#band", { scaleX: (raw - shown) / BAND, duration: T - tLimit, ease: "none" }, t0 + tLimit);
    // release: the card springs back inside the boundary; the band snaps shut
    tl.to("#drag", { x: 0, duration: 0.45, ease: "back.out(1.2)" }, tRelease);
    tl.to("#band", { scaleX: 0, duration: 0.08, ease: "none" }, tRelease);
  }
  // Pointer reaches the grip, grabs, pulls 320 px past the edge, holds, releases.
  tl.to("#cur", { x: GX, y: GY, duration: 0.3, ease: "power2.out" }, 0.1);
  drag(320, 0.45, 0.8, 1.4);
  // A second, shorter pull with the same resistance and return.
  tl.to("#cur", { x: GX, duration: 0.25, ease: "power2.inOut" }, 1.95);
  drag(160, 2.25, 0.3, 2.6);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
