<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>lib-unit-grid</title>
<script src="../_lib/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f3ec; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f3ec; color: #1d1c1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .clip { position: absolute; inset: 0; }
  #stage { position: absolute; left: 56px; top: 52px; width: 1168px; height: 580px; }
  .cell { position: absolute; width: 66px; height: 66px; border: 2px solid #e3ded2; border-radius: 8px; background: #fffdf8; overflow: hidden; }
  .fill { position: absolute; left: -2px; top: -2px; width: 66px; height: 66px; background: #f2c200; transform-origin: center bottom; will-change: transform; }
  .caption { position: absolute; left: 220px; top: 440px; width: 728px; text-align: center; font-size: 34px; font-weight: 700; }
  .unit-label { position: absolute; left: 220px; top: 71px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #6d6a63; }
  #label { position: absolute; left: 56px; top: 664px; height: 24px; display: flex; gap: 10px; align-items: center;
    font-size: 15px; color: #6d6a63; letter-spacing: 0.01em; white-space: nowrap; }
  #label .l-name { color: #1d1c1a; font-weight: 700; }
  #label .l-sep { color: #a19d93; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1280" data-height="720" data-fps="30">
  <section id="scene" class="clip" data-start="0" data-duration="3">
    <div id="stage">
      <div class="unit-label">One cell = one invite</div>
      <div id="cells"></div>
      <div class="caption" id="caption">18 of 30 accepted</div>
    </div>
    <div id="label"><span class="l-name">Unit grid fill</span><span class="l-sep">·</span><span>Data</span><span class="l-sep">·</span><span>steady</span></div>
  </section>
</div>
<script>
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // 30 cells in three rows of ten; the first 18 carry a fill that rises from the cell's bottom edge.
  const cells = document.querySelector("#cells");
  for (let i = 0; i < 30; i++) {
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell" + i;
    c.style.left = (220 + (i % 10) * 74) + "px";
    c.style.top = (142 + Math.floor(i / 10) * 82) + "px";
    if (i < 18) { const f = document.createElement("div"); f.className = "fill"; f.id = "fill" + i; c.appendChild(f); }
    cells.appendChild(c);
  }
  tl.fromTo(".fill", { scaleY: 0 }, { scaleY: 1, duration: 0.32, stagger: 0.06, ease: "power2.out" }, 0.3);
  tl.fromTo("#caption", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3 }, 1.82);
  // Second beat: the last filled cell confirms with a small pulse.
  tl.to("#cell17", { scale: 1.14, duration: 0.22, ease: "power2.out" }, 2.3);
  tl.to("#cell17", { scale: 1, duration: 0.4, ease: "power2.inOut" }, 2.52);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
